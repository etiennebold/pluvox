<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLUVOX" />
  <meta name="theme-color" content="#03050a" />
  <link id="appleTouchIcon" rel="apple-touch-icon" />
  <link id="faviconIcon" rel="icon" type="image/png" />
  <link id="pwaManifest" rel="manifest" />
  <title>PLUVOX — Dual-Universe Orbital Groovebox & Note Studio</title>
  <style>
    :root {
      --void: #03050a;
      --widget-bg: rgba(10, 15, 28, 0.22);
      --pill-bg: rgba(10, 15, 28, 0.58);
      --border: rgba(255, 255, 255, 0.16);
      --border-hi: rgba(56, 189, 248, 0.55);
      --text: #f8fafc;
      --dim: #94a3b8;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --rose: #fb7185;
      --violet: #c084fc;
      --emerald: #10b981;
      --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      user-select: none;
      touch-action: none;
    }

    canvas#cosmos {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: grab;
    }

    canvas#cosmos:active { cursor: grabbing; }

    /* MINIMALIST TOP BAR: ONLY BRAND, CELESTIAL & IGNITE */
    .top-bar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .top-cluster {
      display: flex;
      align-items: center;
      gap: 0.48rem;
      pointer-events: auto;
    }

    .brand {
      font-family: var(--mono);
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      background: linear-gradient(90deg, #ffffff 30%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta-sub {
      font-family: var(--mono);
      font-size: 0.56rem;
      color: var(--dim);
      letter-spacing: 0.08em;
    }

    .hud-pill {
      background: var(--pill-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.42rem 0.82rem;
      font-family: var(--mono);
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }

    .hud-pill:hover { border-color: rgba(255, 255, 255, 0.4); }
    .hud-pill:active { transform: scale(0.95); }

    .hud-pill.playing {
      background: rgba(16, 185, 129, 0.24);
      border-color: var(--emerald);
      color: #a7f3d0;
    }

    .hud-pill.muse-pill {
      border-color: rgba(192, 132, 252, 0.42);
      color: #e9d5ff;
    }

    .hud-pill svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* BOTTOM CENTER WEAPON WHEEL HUB */
    .wheel-trigger-wrap {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .wheel-hub-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--pill-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-hi);
      color: var(--cyan);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .wheel-hub-btn:hover { transform: scale(1.08); }
    .wheel-hub-btn:active { transform: scale(0.93); }
    .wheel-hub-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* GTA-STYLE SEGMENTED WEDGE WEAPON WHEEL */
    .wheel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 4, 10, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .wheel-backdrop.open { opacity: 1; pointer-events: auto; }

    .gta-wheel-container {
      position: fixed;
      width: 310px;
      height: 310px;
      margin-left: -155px;
      margin-top: -155px;
      z-index: 65;
      transform: scale(0.84);
      opacity: 0;
      will-change: transform, opacity;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
    }

    .wheel-backdrop.open .gta-wheel-container { transform: scale(1); opacity: 1; }
    svg#gtaWheelSvg { width: 100%; height: 100%; overflow: visible; }

    .wheel-wedge {
      fill: rgba(11, 17, 32, 0.88);
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 1.5;
      cursor: pointer;
      transition: fill 0.1s ease, stroke 0.1s ease, transform 0.12s ease;
      transform-origin: 155px 155px;
    }

    .wheel-wedge:hover {
      fill: rgba(56, 189, 248, 0.32);
      stroke: var(--cyan);
      stroke-width: 2;
      transform: scale(1.035);
    }

    .wheel-wedge.widget-open { stroke: rgba(16, 185, 129, 0.65); }

    .wheel-wedge-content {
      position: absolute;
      width: 68px;
      height: 46px;
      margin-left: -34px;
      margin-top: -23px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .wheel-wedge-content svg {
      width: 16px;
      height: 16px;
      stroke: #f8fafc;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wheel-wedge-label {
      font-family: var(--mono);
      font-size: 0.51rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #f8fafc;
    }

    .wheel-center-readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(6, 10, 20, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      font-family: var(--mono);
    }

    /* PERSISTENT, DRAGGABLE, 80% TRANSPARENT LAYERABLE WIDGETS */
    .studio-widget {
      position: fixed;
      width: 312px;
      max-width: 90vw;
      background: var(--widget-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      z-index: 30;
      overflow: hidden;
      will-change: left, top;
    }

    .studio-widget:hover { border-color: rgba(255, 255, 255, 0.32); }

    .widget-drag-bar {
      padding: 0.44rem 0.7rem;
      background: rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }

    .widget-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.68rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .widget-close-btn:hover { background: rgba(244, 63, 94, 0.45); }

    .widget-body {
      padding: 0.65rem;
      max-height: 60vh;
      overflow-y: auto;
    }

    .section-tag {
      font-family: var(--mono);
      font-size: 0.52rem;
      font-weight: 800;
      color: var(--dim);
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }

    .orbit-switcher-bar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 0.52rem;
    }

    .orb-tab {
      flex: 1;
      min-width: 42px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0.22rem 0.34rem;
      font-family: var(--mono);
      font-size: 0.52rem;
      font-weight: 800;
      color: var(--dim);
      cursor: pointer;
      text-align: center;
    }

    .orb-tab.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
    }

    .w-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-family: var(--mono);
      font-size: 0.59rem;
      color: var(--text);
    }

    .w-row:last-child { margin-bottom: 0; }

    .w-val {
      min-width: 36px;
      text-align: right;
      font-weight: 800;
      color: var(--cyan);
    }

    .w-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.28rem; }
    .w-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.3rem; }

    .w-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 0.36rem 0.26rem;
      font-family: var(--mono);
      font-size: 0.53rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: center;
    }

    .w-btn:hover { border-color: var(--cyan); background: rgba(56, 189, 248, 0.18); }
    .w-btn.active { border-color: var(--emerald); background: rgba(16, 185, 129, 0.28); color: #a7f3d0; }
    .w-btn.warn { border-color: var(--rose); background: rgba(244, 63, 94, 0.28); color: #ffe4e6; animation: pulseW 1s infinite; }

    @keyframes pulseW { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      height: 4px;
      border-radius: 999px;
      outline: none;
      flex: 1;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
    }

    select.w-select {
      background: rgba(10, 15, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 0.26rem 0.4rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.56rem;
      font-weight: 700;
      outline: none;
    }

    /* BOTTOM-RISING "FIND THE NOTE" GLASS PIANO & GUITAR NECK DOCK */
    .note-finder-dock {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(105%);
      width: min(680px, 96vw);
      background: rgba(8, 13, 24, 0.26);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 0.65rem 0.8rem max(14px, env(safe-area-inset-bottom));
      z-index: 45;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.65);
    }

    .note-finder-dock.open { transform: translateX(-50%) translateY(0); }

    .nf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.55rem;
      font-family: var(--mono);
      font-size: 0.58rem;
    }

    .nf-group { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }

    .piano-bed {
      position: relative;
      height: 112px;
      display: flex;
      gap: 3px;
      user-select: none;
    }

    .p-white {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 0 0 10px 10px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      font-family: var(--mono);
      font-size: 0.52rem;
      color: var(--dim);
      cursor: pointer;
    }

    .p-white:active { background: rgba(56, 189, 248, 0.38); border-color: var(--cyan); color: #fff; }

    .p-black {
      position: absolute;
      top: 0;
      width: 4.4%;
      height: 62%;
      background: rgba(4, 7, 15, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 0 0 7px 7px;
      z-index: 3;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4px;
      font-family: var(--mono);
      font-size: 0.44rem;
      color: var(--cyan);
    }

    .p-black:active { background: var(--cyan); color: #03050a; }

    .guitar-neck {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px;
      overflow-x: auto;
    }

    .g-string-row {
      display: grid;
      grid-template-columns: 32px repeat(12, minmax(36px, 1fr));
      gap: 2px;
      align-items: center;
    }

    .g-string-label {
      font-family: var(--mono);
      font-size: 0.52rem;
      font-weight: 800;
      color: var(--amber);
      text-align: center;
    }

    .g-fret {
      height: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.46rem;
      color: var(--dim);
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }

    .g-fret.dot-marker::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.45);
      bottom: 2px;
    }

    .g-fret:active { background: rgba(245, 158, 11, 0.42); border-color: var(--amber); color: #fff; }

    .hold-ring {
      position: fixed;
      width: 66px;
      height: 66px;
      margin-left: -33px;
      margin-top: -33px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      pointer-events: none;
      z-index: 55;
      opacity: 0;
      transform: scale(0.4);
      transition: transform 0.36s linear, opacity 0.12s ease;
    }

    .hold-ring.charging { opacity: 0.9; transform: scale(1.15); }

    .toast-pill {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 75;
      background: rgba(16, 185, 129, 0.26);
      border: 1px solid var(--emerald);
      color: #a7f3d0;
      font-family: var(--mono);
      font-size: 0.64rem;
      padding: 0.32rem 0.85rem;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .toast-pill.show { opacity: 1; }
  </style>
</head>
<body>

  <canvas id="cosmos"></canvas>
  <div id="holdRing" class="hold-ring"></div>
  <div id="toastPill" class="toast-pill"></div>

  <!-- MINIMALIST TOP BAR: ONLY BRAND, CELESTIAL & IGNITE -->
  <header class="top-bar">
    <div class="top-cluster">
      <span class="brand">PLUVOX</span>
      <span class="meta-sub" id="topMetaLabel">COSMOS · 90 BPM</span>
    </div>

    <div class="top-cluster">
      <button id="btnTopCelestial" class="hud-pill muse-pill" title="Open Celestial AI Co-Pilot & Pop-Culture Tune Generator">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>
        <span>CELESTIAL</span>
      </button>
      <button id="btnPlay" class="hud-pill">
        <svg id="playIconSvg" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        <span id="playBtnText">IGNITE</span>
      </button>
    </div>
  </header>

  <!-- BOTTOM CENTER WEAPON WHEEL HUB -->
  <div class="wheel-trigger-wrap">
    <button class="wheel-hub-btn" id="btnOpenWheel" title="Open Radial Menu (or Long-Press anywhere in space)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8"/></svg>
    </button>
  </div>

  <!-- GTA-STYLE SEGMENTED WEDGE WEAPON WHEEL -->
  <div class="wheel-backdrop" id="wheelBackdrop">
    <div class="gta-wheel-container" id="gtaWheel">
      <svg id="gtaWheelSvg" viewBox="0 0 310 310"></svg>
      <div class="wheel-center-readout" id="wheelCenterClose">
        <span style="font-size:0.55rem; color:var(--dim);">SELECT</span>
        <strong id="wheelHoverName" style="font-size:0.68rem; color:#fff; margin-top:2px;">WHEEL</strong>
      </div>
    </div>
  </div>

  <!-- BOTTOM-RISING "FIND THE NOTE" GLASS PIANO & GUITAR NECK -->
  <div class="note-finder-dock" id="noteFinderDock"></div>

  <!-- LAYER FOR PERSISTENT DRAGGABLE WIDGETS -->
  <div id="widgetLayer"></div>

  <script>
    // =========================================================================
    // 1. NATIVE iOS & ANDROID APP LOGO GENERATOR + PWA MANIFEST
    // =========================================================================
    function generateAppIconDataUrl(size = 512) {
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const g = c.getContext("2d");

      const bgGrad = g.createRadialGradient(size * 0.5, size * 0.5, size * 0.05, size * 0.5, size * 0.5, size * 0.72);
      bgGrad.addColorStop(0, "#0b1224");
      bgGrad.addColorStop(0.65, "#050814");
      bgGrad.addColorStop(1, "#020308");
      g.fillStyle = bgGrad;
      g.fillRect(0, 0, size, size);

      const cx = size * 0.5, cy = size * 0.5, baseR = size * 0.31;

      for (let layer = 1; layer <= 6; layer++) {
        g.beginPath();
        const rLayer = baseR + size * 0.018 + layer * (size * 0.015);
        const amp = (size * 0.018) * (1 - layer / 7.5);
        for (let i = 0; i <= 180; i++) {
          const a = (i / 180) * Math.PI * 2;
          const r = rLayer + Math.sin(a * 4 + layer * 0.35) * Math.cos(a * 2) * amp;
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.closePath();
        const rippleGrad = g.createLinearGradient(cx - rLayer, cy, cx + rLayer, cy);
        rippleGrad.addColorStop(0, `rgba(245, 158, 11, ${0.32 - layer * 0.04})`);
        rippleGrad.addColorStop(1, `rgba(56, 189, 248, ${0.32 - layer * 0.04})`);
        g.strokeStyle = rippleGrad;
        g.lineWidth = Math.max(1, size * 0.0022);
        g.stroke();
      }

      const ringGrad = g.createLinearGradient(cx - baseR, cy, cx + baseR, cy);
      ringGrad.addColorStop(0, "#f59e0b");
      ringGrad.addColorStop(0.48, "#fde68a");
      ringGrad.addColorStop(0.55, "#7dd3fc");
      ringGrad.addColorStop(1, "#38bdf8");

      g.save();
      g.beginPath();
      g.arc(cx, cy, baseR, 0, Math.PI * 2);
      g.strokeStyle = ringGrad;
      g.lineWidth = size * 0.022;
      g.shadowColor = "#38bdf8";
      g.shadowBlur = size * 0.045;
      g.stroke();
      g.restore();

      g.save();
      const fontSize = Math.round(size * 0.082);
      g.font = `300 ${fontSize}px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      g.fillStyle = "#f8fafc";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.shadowColor = "rgba(56, 189, 248, 0.55)";
      g.shadowBlur = size * 0.02;

      const letters = "PLUVOX".split("");
      const spacing = fontSize * 0.92;
      const totalW = spacing * (letters.length - 1);
      letters.forEach((ch, idx) => g.fillText(ch, cx - totalW / 2 + idx * spacing, cy + size * 0.004));
      g.restore();

      return c.toDataURL("image/png");
    }

    (function initPwaIcons() {
      const icon512 = generateAppIconDataUrl(512);
      const icon180 = generateAppIconDataUrl(180);
      document.getElementById("appleTouchIcon").href = icon180;
      document.getElementById("faviconIcon").href = icon180;
      const manifest = {

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
    function freqToMidi(freq) { return Math.round(69 + 12 * Math.log2(freq / 440)); }
    function midiToName(midi) { return `${NOTE_NAMES[midi % 12]}${Math.floor(midi / 12) - 1}`; }

    function quantizeMidiToScale(rawMidi, scaleKey) {
      const intervals = SCALES[scaleKey] || SCALES.minorPentatonic;
      const baseC = 48;
      let bestMidi = rawMidi, minDiff = Infinity;
      for (let oct = -1; oct <= 3; oct++) {
        for (const interval of intervals) {
          const candidate = baseC + oct * 12 + interval;
          const diff = Math.abs(rawMidi - candidate);
          if (diff < minDiff) { minDiff = diff; bestMidi = candidate; }
        }
      }
      return bestMidi;
    }

    function generateEuclidean(steps, pulses) {
      pulses = Math.max(0, Math.min(steps, pulses));

      if (pulses === 0) return pattern;
      let bucket = 0;
      for (let i = 0; i < steps; i++) {
        bucket += pulses;
        if (bucket >= steps) { bucket -= steps; pattern[i] = true; }
      }
      return pattern;
    }

    function createPlanetFromTemplate(idx, customCfg = null, isParallel = false) {
      const bank = isParallel ? PARALLEL_TEMPLATES : PLANET_TEMPLATES;
      const tpl = bank[idx % bank.length];
      const steps = customCfg ? customCfg.steps : tpl.steps;
      const pulses = customCfg ? customCfg.pulses : tpl.pulses;
      const type = customCfg && customCfg.type ? customCfg.type : tpl.type;
      const speedMult = customCfg?.speedMult ?? tpl.speed;
      const voiceLabel = VOICE_ENGINES.find(v => v.id === type)?.label || type.toUpperCase();

      let pattern;
      if (customCfg?.pattern) {
        pattern = [...customCfg.pattern];
      } else if (!customCfg && !isParallel && idx === 1) {
        pattern = [false, false, true, false];
      } else {
        pattern = generateEuclidean(steps, pulses);
      }

      const stepNotes = customCfg && Array.isArray(customCfg.stepNotes)
        ? [...customCfg.stepNotes]
        : Array.from({ length: steps }, (_, s) => [0, 2, 4, 3, 5, 4, 2, 0][s % 8]);

      const stepMidi = customCfg && Array.isArray(customCfg.stepMidi)
        ? [...customCfg.stepMidi]
        : new Array(steps).fill(null);

      return {
        id: idx,
        isParallel,
        baseName: tpl.baseName,
        layer: tpl.layer,
        name: `${tpl.baseName} · ${voiceLabel}`,
        type,
        color: tpl.color,
        planetRadius: tpl.radius,
        steps,
        pulses: pattern.filter(Boolean).length,
        speedMult,
        probability: customCfg?.probability ?? 100,

        });
      });
    }

    // =========================================================================
    // 5. GTA-STYLE SEGMENTED WEDGE WEAPON WHEEL (WITH UNIVERSE WEDGE)
    // =========================================================================
    const WEDGE_DEFS = [
      { id: "vox",      label: "VOX",      svgPath: `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>` },
      { id: "rack",     label: "RACK",     svgPath: `<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/>` },
      { id: "keys",     label: "KEYS",     svgPath: `<rect x="2" y="5" width="20" height="14" rx="2"/><line x1="7" y1="5" x2="7" y2="19"/><line x1="12" y1="5" x2="12" y2="19"/><line x1="17" y1="5" x2="17" y2="19"/>` },
      { id: "orbit",    label: "ORBIT",    svgPath: `<circle cx="12" cy="12" r="4"/><ellipse cx="12" cy="12" rx="10" ry="4" transform="rotate(-25 12 12)"/>` },
      { id: "parallel", label: "DUAL",     svgPath: `<circle cx="9" cy="12" r="5"/><circle cx="17" cy="9" r="3"/>` },
      { id: "universe", label: "UNIVERSE", svgPath: `<circle cx="12" cy="12" r="9"/><path d="M3.6 9h16.8M3.6 15h16.8"/><path d="M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>` },
      { id: "mix",      label: "MIX",      svgPath: `<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>` },
      { id: "save",     label: "SAVE",     svgPath: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>` }
    ];

    const wheelBackdrop = document.getElementById("wheelBackdrop");
    const gtaWheel = document.getElementById("gtaWheel");
    const gtaWheelSvg = document.getElementById("gtaWheelSvg");

    function polarToCartesian(cx, cy, r, angleDeg) {
      const rad = ((angleDeg - 90) * Math.PI) / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function createAnnularWedgePath(cx, cy, innerR, outerR, startAngle, endAngle) {
      const p1 = polarToCartesian(cx, cy, outerR, startAngle);
      const p2 = polarToCartesian(cx, cy, outerR, endAngle);
      const p3 = polarToCartesian(cx, cy, innerR, endAngle);
      const p4 = polarToCartesian(cx, cy, innerR, startAngle);
      const largeArc = endAngle - startAngle <= 180 ? "0" : "1";
      return `M ${p1.x} ${p1.y} A ${outerR} ${outerR} 0 ${largeArc} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${innerR} ${innerR} 0 ${largeArc} 0 ${p4.x} ${p4.y} Z`;
    }

    function openGtaWeaponWheel(x, y) {
      const margin = 165;
      gtaWheel.style.left = `${Math.max(margin, Math.min(logicalW - margin, x))}px`;
      gtaWheel.style.top = `${Math.max(margin, Math.min(logicalH - margin, y))}px`;

      gtaWheelSvg.innerHTML = "";
      gtaWheel.querySelectorAll(".wheel-wedge-content").forEach(el => el.remove());

      const cx = 155, cy = 155, innerR = 48, outerR = 148;
      const sliceDeg = 360 / WEDGE_DEFS.length;
      const gapDeg = 2.4;

      WEDGE_DEFS.forEach((w, idx) => {
        const startA = idx * sliceDeg - sliceDeg / 2 + gapDeg / 2;
        const endA = (idx + 1) * sliceDeg - sliceDeg / 2 - gapDeg / 2;
        const midA = idx * sliceDeg;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", createAnnularWedgePath(cx, cy, innerR, outerR, startA, endA));
        const isActive = (w.id === "keys" && isNoteFinderOpen) || openWidgets[w.id];
        path.setAttribute("class", `wheel-wedge ${isActive ? "widget-open" : ""}`);

        path.addEventListener("pointerenter", () => { document.getElementById("wheelHoverName").textContent = w.label; });
        path.addEventListener("click", () => {
          closeGtaWeaponWheel();
          if (w.id === "keys") toggleNoteFinder();
          else togglePersistentWidget(w.id);
        });
        gtaWheelSvg.appendChild(path);

        const labelPos = polarToCartesian(cx, cy, (innerR + outerR) * 0.52, midA);
        const content = document.createElement("div");
        content.className = "wheel-wedge-content";
        content.style.left = `${labelPos.x}px`;
        content.style.top = `${labelPos.y}px`;
        content.innerHTML = `<svg viewBox="0 0 24 24">${w.svgPath}</svg><span class="wheel-wedge-label">${w.label}</span>`;
        gtaWheel.appendChild(content);
      });

      document.getElementById("wheelHoverName").textContent = "WHEEL";
      wheelBackdrop.classList.add("open");
    }

    function closeGtaWeaponWheel() { wheelBackdrop.classList.remove("open"); }
    wheelBackdrop.addEventListener("click", e => { if (e.target === wheelBackdrop || e.target.closest("#wheelCenterClose")) closeGtaWeaponWheel(); });
    document.getElementById("btnOpenWheel").addEventListener("click", () => openGtaWeaponWheel(logicalW / 2, logicalH / 2));
    document.getElementById("btnTopCelestial").addEventListener("click", () => togglePersistentWidget("muse"));

    // =========================================================================
    // 6. PERSISTENT, DRAGGABLE, 80% TRANSPARENT LAYERABLE WIDGET SYSTEM
    // =========================================================================
    const widgetLayer = document.getElementById("widgetLayer");
    const openWidgets = {};
    let topZIndex = 31;

    function bringWidgetToFront(el) {
      topZIndex++;
      el.style.zIndex = topZIndex;
    }

    function togglePersistentWidget(id, forceOpen = false) {
      if (openWidgets[id] && !forceOpen) {
        openWidgets[id].remove();
        delete openWidgets[id];
        return;
      }
      if (!openWidgets[id]) {
        const el = document.createElement("div");
        el.className = "studio-widget";
        const count = Object.keys(openWidgets).length;
        el.style.left = `${Math.min(logicalW - 320, Math.max(14, 20 + (count % 3) * 32))}px`;
        el.style.top = `${Math.min(logicalH - 300, Math.max(64, 70 + (count % 4) * 36))}px`;
        bringWidgetToFront(el);
        el.addEventListener("pointerdown", () => bringWidgetToFront(el));
        widgetLayer.appendChild(el);
        openWidgets[id] = el;
      } else {
        bringWidgetToFront(openWidgets[id]);
      }
      renderWidgetContent(id);
    }

    function makeWidgetDraggable(widgetEl, handleEl) {
      let dragging = false, offsetX = 0, offsetY = 0;
      handleEl.addEventListener("pointerdown", e => {
        if (e.target.closest("button")) return;
        dragging = true;
        bringWidgetToFront(widgetEl);
        const rect = widgetEl.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        handleEl.setPointerCapture(e.pointerId);
      });
      handleEl.addEventListener("pointermove", e => {
        if (!dragging) return;
        widgetEl.style.left = `${Math.max(4, Math.min(logicalW - widgetEl.offsetWidth - 4, e.clientX - offsetX))}px`;
        widgetEl.style.top = `${Math.max(4, Math.min(logicalH - widgetEl.offsetHeight - 4, e.clientY - offsetY))}px`;
      });
      handleEl.addEventListener("pointerup", () => { dragging = false; });
    }

    function refreshAllOpenWidgets() {
      Object.keys(openWidgets).forEach(id => renderWidgetContent(id));

        el.querySelector("#wAddOrb").onclick = () => {

    function updateTopLabel() {

    // =========================================================================
    // 7. ZERO-ALLOCATION WEB AUDIO ENGINE
    // =========================================================================
    let audioCtx = null, masterFilter = null, masterAnalyser = null, tapeSaturator = null;
    let compressorNode = null, delayNode = null, delayWet = null, rainBandFilter = null, rainGain = null, vinylGain = null;
    let focusCarrierOsc = null, focusLfoOsc = null, focusMasterGain = null;
    let sharedNoiseBuffer = null, sharedPowerCurve = null;
    const planetPanners = [];

    let wavProcessor = null, isRecordingWav = false, wavLeftChunks = [], wavRightChunks = [];
    let isPlaying = false, schedulerTimer = null, nextTickTime = 0, nextParallelTickTime = 0, globalTick = 0, currentChordIndex = 0;
    let micStream = null, analyserNode = null, isHumCapturing = false;
    let humCapturedSteps = new Array(16).fill(false), humCapturedNotes = new Array(16).fill(0);

    const SHARED_CURVE_SAMPLES = 4096;
    function makeTapeSaturationCurve(amount) {
      const k = amount * 1.4, curve = new Float32Array(SHARED_CURVE_SAMPLES), deg = Math.PI / 180;
      for (let i = 0; i < SHARED_CURVE_SAMPLES; i++) {
        const x = (i * 2) / SHARED_CURVE_SAMPLES - 1;
        curve[i] = k === 0 ? x : ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    function updateTapeDrive(pct) {
      if (tapeSaturator) tapeSaturator.curve = makeTapeSaturationCurve(Number(pct));
    }

    function initAudioEngine() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const noiseLen = audioCtx.sampleRate;
      sharedNoiseBuffer = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
      const nOut = sharedNoiseBuffer.getChannelData(0);
      for (let i = 0; i < noiseLen; i++) nOut[i] = Math.random() * 2 - 1;

      sharedPowerCurve = makeTapeSaturationCurve(145);

      compressorNode = audioCtx.createDynamicsCompressor();
      compressorNode.threshold.value = -14;
      compressorNode.ratio.value = 3.5;

      tapeSaturator = audioCtx.createWaveShaper();
      tapeSaturator.oversample = "2x";
      updateTapeDrive(driveLevel);

      masterFilter = audioCtx.createBiquadFilter();
      masterFilter.type = "lowpass";
      masterFilter.frequency.value = filterCutoff;

      masterAnalyser = audioCtx.createAnalyser();
      masterAnalyser.fftSize = 128;

      delayNode = audioCtx.createDelay(2.0);
      delayNode.delayTime.value = 0.33;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.36;
      delayWet = audioCtx.createGain();
      delayWet.gain.value = delayAmount / 100;

      delayNode.connect(fb);
      fb.connect(delayNode);
      delayNode.connect(delayWet);
      delayWet.connect(tapeSaturator);

      tapeSaturator.connect(masterFilter);
      masterFilter.connect(compressorNode);
      compressorNode.connect(masterAnalyser);
      masterAnalyser.connect(audioCtx.destination);

      for (let i = 0; i < 10; i++) {
        const pan = audioCtx.createStereoPanner();
        pan.connect(tapeSaturator);
        planetPanners.push(pan);
      }

      wavProcessor = audioCtx.createScriptProcessor(4096, 2, 2);
      wavProcessor.onaudioprocess = e => {
        if (!isRecordingWav) return;
        wavLeftChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        wavRightChunks.push(new Float32Array(e.inputBuffer.getChannelData(1)));
      };

      focusCarrierOsc = audioCtx.createOscillator();
      focusCarrierOsc.frequency.value = 174;
      const modGain = audioCtx.createGain();
      modGain.gain.value = 0.5;
      focusLfoOsc = audioCtx.createOscillator();
      focusLfoOsc.frequency.value = focusHz || 12.5;
      const depth = audioCtx.createGain();
      depth.gain.value = 0.45;
      focusMasterGain = audioCtx.createGain();
      focusMasterGain.gain.value = 0.0001;

      focusLfoOsc.connect(depth);
      depth.connect(modGain.gain);
      focusCarrierOsc.connect(modGain);
      modGain.connect(focusMasterGain);
      focusMasterGain.connect(compressorNode);
      focusCarrierOsc.start();
      focusLfoOsc.start();
      updateBrainwaveCarrier();

      const bufferSize = audioCtx.sampleRate * 2;
      const rainBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const rd = rainBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        rd[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.042;
        b6 = w * 0.115926;
      }
      const rainSrc = audioCtx.createBufferSource();
      rainSrc.buffer = rainBuf;
      rainSrc.loop = true;
      rainBandFilter = audioCtx.createBiquadFilter();
      rainBandFilter.type = "bandpass";
      rainBandFilter.frequency.value = UNIVERSES[activeUniverseKey].rainFreq;
      rainGain = audioCtx.createGain();
      rainGain.gain.value = (rainLevel / 100) * 0.55;
      rainSrc.connect(rainBandFilter);
      rainBandFilter.connect(rainGain);
      rainGain.connect(compressorNode);
      rainSrc.start();

      const vinylBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const vd = vinylBuf.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        vd[i] = Math.random() > 0.9978 ? (Math.random() * 2 - 1) * 0.48 : (Math.random() * 2 - 1) * 0.005;
      }
      const vinylSrc = audioCtx.createBufferSource();
      vinylSrc.buffer = vinylBuf;
      vinylSrc.loop = true;
      const vh = audioCtx.createBiquadFilter();
      vh.type = "highpass";
      vh.frequency.value = 1850;
      vinylGain = audioCtx.createGain();
      vinylGain.gain.value = (vinylLevel / 100) * 0.65;
      vinylSrc.connect(vh);
      vh.connect(vinylGain);
      vinylGain.connect(compressorNode);
      vinylSrc.start();
    }

    function updateBrainwaveCarrier() {
      if (!audioCtx || !focusMasterGain) return;
      if (focusHz <= 0) focusMasterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.12);
      else { focusLfoOsc.frequency.setTargetAtTime(focusHz, audioCtx.currentTime, 0.08); focusMasterGain.gain.setTargetAtTime(0.03, audioCtx.currentTime, 0.12); }
    }

    // Pure Universe Switcher: transforms visual theme & acoustic room WITHOUT resetting user's beat
    function setUniverse(key, silent = false) {
      if (!UNIVERSES[key]) return;
      activeUniverseKey = key;
      const u = UNIVERSES[key];
      filterCutoff = u.filterDefault;
      driveLevel = u.driveDefault;
      if (rainBandFilter && audioCtx) rainBandFilter.frequency.setTargetAtTime(u.rainFreq, audioCtx.currentTime, 0.12);
      if (masterFilter && audioCtx) masterFilter.frequency.setTargetAtTime(filterCutoff, audioCtx.currentTime, 0.12);
      updateTapeDrive(driveLevel);
      updateTopLabel();
      if (!silent) showToast(`Universe: ${u.label}`);
    }

    function triggerPowerChordStrum(time, rootMidi, vol, isPalmMute = false, panIdx = 0) {
      const panner = planetPanners[panIdx % planetPanners.length];
      const dist = audioCtx.createWaveShaper();
      dist.curve = sharedPowerCurve;
      const cabFilter = audioCtx.createBiquadFilter();
      cabFilter.type = "lowpass";
      cabFilter.frequency.setValueAtTime(isPalmMute ? 1350 : 2850, time);
      cabFilter.frequency.exponentialRampToValueAtTime(isPalmMute ? 280 : 680, time + (isPalmMute ? 0.14 : 0.42));

      dist.connect(cabFilter);
      cabFilter.connect(panner);
      if (!isPalmMute) cabFilter.connect(delayNode);

      [0, 7, 12].forEach((semi, idx) => {
        const strumDelay = idx * 0.015;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(midiToFreq(rootMidi + semi), time + strumDelay);

        gain.gain.setValueAtTime(0.001, time + strumDelay);
        gain.gain.linearRampToValueAtTime(vol * 0.22, time + strumDelay + 0.007);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + strumDelay + (isPalmMute ? 0.16 : 0.48));

        osc.connect(gain);
        gain.connect(dist);
        osc.start(time + strumDelay);
        osc.stop(time + strumDelay + 0.52);
      });
    }

    function triggerGrandPianoNote(time, midi, vol, panIdx = 0, isTine = false) {
      const panner = planetPanners[panIdx % planetPanners.length];
      const freq = midiToFreq(midi);
      const oscFund = audioCtx.createOscillator();
      const oscHarm = audioCtx.createOscillator();
      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      oscFund.type = "triangle";
      oscHarm.type = isTine ? "sine" : "triangle";
      oscFund.frequency.setValueAtTime(freq, time);
      oscHarm.frequency.setValueAtTime(freq * (isTine ? 3.0 : 2.0), time);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(isTine ? 3400 : 2600, time);
      filter.frequency.exponentialRampToValueAtTime(420, time + 0.55);

      gain.gain.setValueAtTime(0.001, time);
      gain.gain.linearRampToValueAtTime(vol * 0.42, time + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.65);

      oscFund.connect(filter);
      oscHarm.connect(filter);
      filter.connect(gain);
      gain.connect(panner);
      gain.connect(delayNode);

      oscFund.start(time);
      oscHarm.start(time);
      oscFund.stop(time + 0.68);
      oscHarm.stop(time + 0.68);
    }

    function triggerChordPad(time, durationSec) {
      if (!audioCtx || chordProgKey === "none") return;
      const chords = CHORD_PROGRESSIONS[chordProgKey];
      if (!chords || chords.length === 0) return;
      const notes = chords[currentChordIndex % chords.length];
      currentChordIndex++;

      notes.forEach((midi, idx) => {
        const freq = midiToFreq(midi);
        const osc1 = audioCtx.createOscillator(), osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter(), gain = audioCtx.createGain();
        osc1.type = activeUniverseKey === "studio" ? "sawtooth" : "triangle";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(freq, time);
        osc2.frequency.setValueAtTime(freq * 1.003, time);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(activeUniverseKey === "studio" ? 1350 : 950, time);

        const peak = 0.05 / Math.sqrt(notes.length);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(peak, time + 0.35);
        gain.gain.setValueAtTime(peak * 0.85, time + durationSec - 0.4);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec);

        osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(tapeSaturator);
        if (idx === 0) gain.connect(delayNode);
        osc1.start(time); osc2.start(time);
        osc1.stop(time + durationSec + 0.05); osc2.stop(time + durationSec + 0.05);
      });
    }

    function triggerPlanetVoice(planet, time, stepIndex, panVal = 0) {
      if (!audioCtx) return;
      const intervals = SCALES[scaleKey] || SCALES.minorPentatonic;
      const t = planet.type;

      let layerGain = 1.0;
      if (planet.layer === "rock" && hybridXfade > 0) layerGain = Math.max(0.08, 1 - hybridXfade / 105);
      if (planet.layer === "synth" && hybridXfade < 0) layerGain = Math.max(0.08, 1 + hybridXfade / 105);

      let uniGain = 1.0;
      if (!planet.isParallel && universeBalance > 0) uniGain = Math.max(0.05, 1 - universeBalance / 102);
      if (planet.isParallel && universeBalance < 0) uniGain = Math.max(0.05, 1 + universeBalance / 102);

      const effectiveVol = planet.volume * layerGain * uniGain;
      const panIdx = (planet.isParallel ? 7 : 0) + (planet.id % 7);
      const panner = planetPanners[panIdx % planetPanners.length];
      const vMeta = VOICE_ENGINES.find(v => v.id === t);
      panner.pan.setValueAtTime(Math.max(-1, Math.min(1, panVal * (vMeta?.band === "low" ? 0.22 : 0.85))), time);

      const customMidi = planet.stepMidi ? planet.stepMidi[stepIndex % planet.stepMidi.length] : null;
      const stepDegree = planet.stepNotes[stepIndex % planet.stepNotes.length] || 0;
      const noteIdx = (stepDegree + planet.pitchOffset) % intervals.length;

      if (t === "powerStrum" || t === "chugStrum") {
        const midi = customMidi !== null ? customMidi : (36 + intervals[noteIdx]);
        triggerPowerChordStrum(time, midi, effectiveVol, t === "chugStrum", panIdx);
      } else if (t === "grandPiano" || t === "tineKeys") {
        const midi = customMidi !== null ? customMidi : (48 + intervals[noteIdx]);
        triggerGrandPianoNote(time, midi, effectiveVol, panIdx, t === "tineKeys");
      } else if (t.startsWith("kick") || t === "taikoDrum") {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = t === "kick808" ? "sine" : "triangle";
        osc.frequency.setValueAtTime(t === "kick808" ? 135 : 176, time);
        osc.frequency.exponentialRampToValueAtTime(38, time + 0.16);
        gain.gain.setValueAtTime(effectiveVol, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.38);
        osc.connect(gain); gain.connect(panner);
        osc.start(time); osc.stop(time + 0.4);
      } else if (t.startsWith("snare") || t === "rim") {
        const dur = t === "rim" ? 0.11 : 0.22;
        const noise = audioCtx.createBufferSource();
        noise.buffer = sharedNoiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = t === "rim" ? "bandpass" : "highpass";
        filter.frequency.value = t === "rim" ? 1550 : 950;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(effectiveVol * 0.65, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(panner); gain.connect(delayNode);
        noise.start(time); noise.stop(time + dur + 0.01);
      } else if (t === "vinylScratch") {
        const dur = 0.22;
        const noise = audioCtx.createBufferSource();
        noise.buffer = sharedNoiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 6.5;
        filter.frequency.setValueAtTime(650 + stepDegree * 80, time);
        filter.frequency.exponentialRampToValueAtTime(3400, time + 0.08);
        filter.frequency.exponentialRampToValueAtTime(520, time + dur);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(effectiveVol * 0.68, time + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(panner); gain.connect(delayNode);
        noise.start(time); noise.stop(time + dur + 0.01);
      } else if (t.startsWith("hat") || t === "crashCym") {
        const dur = t === "hatClosed" ? 0.055 : (t === "hatOpen" ? 0.22 : 0.52);
        const noise = audioCtx.createBufferSource();
        noise.buffer = sharedNoiseBuffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 6200;

        const octaveBase = (t.includes("Bass") || t === "nuMetalGtr") ? 36 : 52;

    function scheduleSystemOrbits(list, playTime, sixteenthDuration, isFillWindow) {
      const anySoloed = list.some(pl => pl.soloed);
      list.forEach(p => {
        const stepAdvance = p.speedMult === 0.5 ? (globalTick % 2 === 0 ? 1 : 0) : p.speedMult;
        const subTicks = Math.max(1, Math.floor(stepAdvance));

        for (let sub = 0; sub < subTicks; sub++) {
          if (stepAdvance === 0) break;
          const subTime = playTime + (sub / subTicks) * sixteenthDuration;
          p.phaseSteps = (p.phaseSteps + 1) % p.steps;
          const stepIdx = Math.floor(p.phaseSteps) % p.steps;

          const isAudible = anySoloed ? p.soloed : !p.muted;
          const passesProb = (p.probability >= 100) || (Math.random() * 100 <= p.probability);
          let isHit = p.pattern[stepIdx] && isAudible && passesProb;

          if (isFillWindow && isAudible && !p.isParallel && p.id === 1) isHit = true;

          if (isHit) {
            const targetAngle = (stepIdx / p.steps) * Math.PI * 2 - Math.PI / 2;
            triggerPlanetVoice(p, subTime, stepIdx, Math.cos(targetAngle));
            p.pendingVisualHit = { time: subTime, stepIdx, angle: targetAngle };
          } else {
            p.pendingVisualStep = { time: subTime, angle: (stepIdx / p.steps) * Math.PI * 2 - Math.PI / 2 };
          }
        }
      });
    }

    function schedulerLoop() {
      const sixteenthDuration = (60 / bpm) / 4;

        const barTick64 = globalTick % 64;
        const isFillWindow = autoFillsEnabled && (barTick64 >= 60);

        scheduleSystemOrbits(planets, playTime, sixteenthDuration, isFillWindow);

        if (jamPartnerEnabled && globalTick % 2 === 1) {
          const silenceMs = performance.now() - lastUserPlayTime;
          if (silenceMs > 650 && silenceMs < 6000) {
            const intervals = SCALES[scaleKey];
            const replyDeg = (globalTick % 5 + 2) % intervals.length;
            triggerGrandPianoNote(playTime, 60 + intervals[replyDeg], 0.35, 0, true);
          }
        }

        nextTickTime += sixteenthDuration;
        globalTick++;
      }

      if (parallelVisible && parallelActive) {
        const parSixteenth = ((60 / (bpm * parallelBpmRatio)) / 4);
        while (nextParallelTickTime < audioCtx.currentTime + 0.08) {
          scheduleSystemOrbits(parallelPlanets, nextParallelTickTime, parSixteenth, false);
          nextParallelTickTime += parSixteenth;
        }
      }
    }

    function autoCorrelate(buf, sampleRate) {
      let size = buf.length, rms = 0;
      for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / size);
      if (rms < 0.018) return { freq: -1, rms };
      let r1 = 0, r2 = size - 1, thres = 0.2;
      for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }
      buf = buf.slice(r1, r2); size = buf.length;
      const c = new Array(size).fill(0);
      for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buf[j] * buf[j + i];
      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < size; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      return maxpos > 0 ? { freq: sampleRate / maxpos, rms } : { freq: -1, rms };
    }

    function exportMultiTrackMidi() {
      const intervals = SCALES[scaleKey];
      const stepTicks = 120, events = [];
      planets.forEach((p, pIdx) => {
        if (p.muted) return;
        const ch = p.type.startsWith("kick") || p.type.startsWith("snare") || p.type === "rim" ? 9 : (pIdx % 8);
        for (let step = 0; step < 64; step++) {
          const sIdx = step % p.steps;
          if (!p.pattern[sIdx]) continue;
          const customM = p.stepMidi ? p.stepMidi[sIdx] : null;
          const note = customM !== null ? customM : (p.type.startsWith("kick") ? 36 : (p.type.startsWith("snare") ? 38 : 48 + intervals[(p.stepNotes[sIdx] || 0) % intervals.length]));
          events.push({ tick: step * stepTicks, data: [0x90 | ch, note, 100] });
          events.push({ tick: step * stepTicks + 110, data: [0x80 | ch, note, 0] });
        }
      });
      events.sort((a, b) => a.tick - b.tick);
      const trackBytes = [];
      let lastTick = 0;
      events.forEach(ev => {
        let d = ev.tick - lastTick; lastTick = ev.tick;
        const v = []; let buf = d & 0x7f;
        while ((d >>= 7)) { buf <<= 8; buf |= ((d & 0x7f) | 0x80); }
        while (true) { v.push(buf & 0xff); if (buf & 0x80) buf >>= 8; else break; }
        trackBytes.push(...v, ...ev.data);
      });
      trackBytes.push(0x00, 0xff, 0x2f, 0x00);
      const hdr = [0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,1,0xe0,0x4d,0x54,0x72,0x6b,(trackBytes.length>>24)&255,(trackBytes.length>>16)&255,(trackBytes.length>>8)&255,trackBytes.length&255];
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([new Uint8Array([...hdr, ...trackBytes])], { type: "audio/midi" }));
      a.download = `PLUVOX-${bpm}BPM.mid`;
      a.click();
      showToast("Exported .MID File!");
    }

          p.springVel += (p.type.startsWith("kick") ? 4.5 : 2.8);
          if (isParallel) parallelSunVel += 3.2;
          else if (p.type.startsWith("kick")) sunVel += 5.0;
          const pos = getPlanetPosition(p);
          shockwaves.push({ x: pos.x, y: pos.y, r: p.planetRadius, maxR: isParallel ? 42 : 68, color: p.color, alpha: 0.78 });
        } else if (p.pendingVisualStep && audioNow >= p.pendingVisualStep.time) {
          p.visualAngle = p.pendingVisualStep.angle;
          p.pendingVisualStep = null;
        }

        p.springVel = (p.springVel - p.springOffset * 0.09) * 0.89;
        p.springOffset += p.springVel;
        p.floatPhase += dt * (1.2 + p.id * 0.25);
        p.pulseFlash *= 0.9;

        const systemRunning = isPlaying && (!isParallel || parallelActive);
        if (systemRunning) {
          const effSixteenth = isParallel ? (sixteenthSec / parallelBpmRatio) : sixteenthSec;
          const orbitPeriodSec = (p.steps * effSixteenth) / p.speedMult;
          p.visualAngle += ((Math.PI * 2) / orbitPeriodSec) * dt;
        } else {
          p.visualAngle += 0.07 * dt * (p.id % 2 === 0 ? 1 : -1);
        }

        const orbitR = getOrbitRadius(p.id, isParallel) + p.springOffset + Math.sin(p.floatPhase) * 2.0;
        const isSel = (activeTarget.universe === (isParallel ? "parallel" : "main")) && (p.id === activeTarget.id);
        const dimmed = isDimSystem || (anySoloed ? !p.soloed : p.muted);

        ctx.beginPath(); ctx.arc(center.cx, center.cy, orbitR, 0, Math.PI * 2);
        ctx.strokeStyle = p.locked ? "#38bdf8" : (isSel ? p.color : "rgba(148, 163, 184, 0.22)");
        ctx.globalAlpha = dimmed ? 0.16 : (isSel || p.locked ? 0.7 : 1);
        ctx.lineWidth = isSel || p.locked ? 1.8 : 1.0; ctx.stroke(); ctx.globalAlpha = 1;

        const nodes = [];
        for (let s = 0; s < p.steps; s++) {
          const sa = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = center.cx + Math.cos(sa) * orbitR, ny = center.cy + Math.sin(sa) * orbitR;
          const active = p.pattern[s];
          if (active) nodes.push({ x: nx, y: ny });

          if (p.nodeFlashes[s] > 0.04) {
            p.nodeFlashes[s] *= 0.87;
            ctx.beginPath();
            ctx.arc(nx, ny, (isParallel ? 4 : 6) + (1 - p.nodeFlashes[s]) * 10, 0, Math.PI * 2);
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = p.nodeFlashes[s];
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          const hasCustomNote = p.stepMidi && p.stepMidi[s] !== null;
          ctx.beginPath();
          ctx.arc(nx, ny, active ? (isParallel ? 3.8 : 5.2) : (isParallel ? 2.0 : 2.8), 0, Math.PI * 2);
          ctx.globalAlpha = dimmed ? 0.25 : 1;
          ctx.fillStyle = active ? (hasCustomNote ? "#ffffff" : p.color) : "rgba(148, 163, 184, 0.45)";
          ctx.fill();
          if (active && hasCustomNote) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
        }

        if (nodes.length > 1) {
          ctx.beginPath();
          nodes.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
          ctx.closePath(); ctx.strokeStyle = p.color;
          ctx.globalAlpha = dimmed ? 0.08 : (0.24 + p.pulseFlash * 0.35);
          ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1;
        }

        const px = center.cx + Math.cos(p.visualAngle) * orbitR;
        const py = center.cy + Math.sin(p.visualAngle) * orbitR;
        const pRad = p.planetRadius + p.pulseFlash * 4.0;

        ctx.beginPath(); ctx.arc(px, py, pRad * 1.55, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.globalAlpha = dimmed ? 0.08 : 0.18; ctx.fill();

        ctx.beginPath(); ctx.arc(px, py, pRad * 0.85, 0, Math.PI * 2);
        ctx.globalAlpha = dimmed ? 0.32 : 0.95; ctx.fill();

        ctx.beginPath(); ctx.arc(px, py, pRad * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff"; ctx.globalAlpha = dimmed ? 0.28 : 0.95; ctx.fill();
        ctx.globalAlpha = 1;

        if (isSel || p.locked) {
          ctx.beginPath(); ctx.arc(px, py, pRad + 4.5, 0, Math.PI * 2);
          ctx.strokeStyle = p.locked ? "#38bdf8" : "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
        }
      });
    }

    function renderCosmos(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      const w = logicalW, h = logicalH;
      const mainC = getMainCenter();
      const parC = getParallelCenter();
      const sixteenthSec = (60 / bpm) / 4;
      const u = UNIVERSES[activeUniverseKey];

      ctx.fillStyle = u.bgTrail;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = `rgba(${u.streakColor}, 0.45)`;
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        ctx.fillRect(s.x * w, s.y * h, s.r, s.r);
      }

      const rainPct = rainLevel / 100;
      const activeP = Math.floor(particles.length * rainPct);
      for (let i = 0; i < activeP; i++) {
        const p = particles[i];
        p.wob += 0.03;
        if (u.particleMode === "rain" || u.particleMode === "neonrain") {
          p.x -= p.speed * 0.55; p.y += p.speed * 1.25;
          if (p.y > h + 20 || p.x < -20) { p.x = Math.random() * (w + 200); p.y = -20; }
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.len * 0.45, p.y - p.len);
          ctx.strokeStyle = `rgba(${u.streakColor}, ${p.alpha * rainPct})`; ctx.lineWidth = 1.2; ctx.stroke();
        } else {
          p.y -= p.speed * 0.3; p.x += Math.sin(p.wob) * 0.8;
          if (p.y < -20) { p.y = h + 20; p.x = Math.random() * w; }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${u.streakColor}, ${p.alpha * rainPct})`; ctx.fill();
        }
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.12;
        sw.alpha *= 0.9;
        if (sw.alpha < 0.03) { shockwaves.splice(i, 1); continue; }
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color; ctx.globalAlpha = sw.alpha; ctx.lineWidth = 1.6; ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Main Sun
      sunVel = (sunVel - sunSpring * 0.11) * 0.88;
      sunSpring += sunVel;
      const sunR = Math.max(16, 24 + sunSpring);
      const sunTint = isHumCapturing ? "#fb7185" : (isPlaying ? u.sunCore : "#94a3b8");

      ctx.beginPath(); ctx.arc(mainC.cx, mainC.cy, sunR * 2.1, 0, Math.PI * 2);
      ctx.fillStyle = sunTint; ctx.globalAlpha = 0.12; ctx.fill();
      ctx.beginPath(); ctx.arc(mainC.cx, mainC.cy, sunR * 1.35, 0, Math.PI * 2);
      ctx.globalAlpha = 0.28; ctx.fill();
      ctx.beginPath(); ctx.arc(mainC.cx, mainC.cy, sunR * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.95; ctx.fill();
      ctx.globalAlpha = 1;

      if (masterAnalyser && isPlaying) {
        masterAnalyser.getByteTimeDomainData(waveData);
        ctx.beginPath();
        for (let i = 0; i < waveData.length; i++) {
          const a = (i / waveData.length) * Math.PI * 2;
          const rW = sunR + 12 + ((waveData[i] - 128) / 128) * 14;
          const wx = mainC.cx + Math.cos(a) * rW, wy = mainC.cy + Math.sin(a) * rW;
          if (i === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
        }
        ctx.closePath(); ctx.strokeStyle = `rgba(${u.streakColor}, 0.5)`; ctx.lineWidth = 1.4; ctx.stroke();
      }

      const audioNow = audioCtx ? audioCtx.currentTime : 0;
      drawSolarSystem(planets, mainC, false, dt, sixteenthSec, audioNow);

      // Draw Optional Parallel Solar System ONLY when enabled
      if (parallelVisible) {
        ctx.beginPath();
        ctx.moveTo(mainC.cx, mainC.cy);
        ctx.lineTo(parC.cx, parC.cy);
        ctx.strokeStyle = parallelActive ? "rgba(192, 132, 252, 0.24)" : "rgba(148, 163, 184, 0.08)";
        ctx.setLineDash([4, 6]);
        ctx.lineWidth = 1.2;
        ctx.stroke();
        ctx.setLineDash([]);

        parallelSunVel = (parallelSunVel - parallelSunSpring * 0.12) * 0.88;
        parallelSunSpring += parallelSunVel;
        const parSunR = Math.max(10, 14 + parallelSunSpring);
        const parTint = parallelActive ? "#c084fc" : "#64748b";

        ctx.beginPath(); ctx.arc(parC.cx, parC.cy, parSunR * 2.0, 0, Math.PI * 2);
        ctx.fillStyle = parTint; ctx.globalAlpha = parallelActive ? 0.18 : 0.08; ctx.fill();
        ctx.beginPath(); ctx.arc(parC.cx, parC.cy, parSunR * 0.9, 0, Math.PI * 2);
        ctx.fillStyle = parallelActive ? "#f3e8ff" : "#94a3b8"; ctx.globalAlpha = 0.9; ctx.fill();
        ctx.globalAlpha = 1;

        drawSolarSystem(parallelPlanets, parC, true, dt, sixteenthSec, audioNow);
      }

      requestAnimationFrame(renderCosmos);
    }

    // Pointer Interaction across Main & Optional Parallel Solar System
    let longPressTimer = null, pressStartPos = null, draggingOrb = null;

    function hitTestSystem(list, center, isParallel, mx, my) {
      for (const p of list) {
        const pos = getPlanetPosition(p);
        if (Math.hypot(mx - pos.x, my - pos.y) <= p.planetRadius + 15) {
          selectPlanet(p.id, true, isParallel ? "parallel" : "main");
          return true;
        }
      }
      for (const p of list) {
        const orbitR = getOrbitRadius(p.id, isParallel) + p.springOffset + Math.sin(p.floatPhase) * 2.0;
        for (let s = 0; s < p.steps; s++) {
          const sa = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = center.cx + Math.cos(sa) * orbitR, ny = center.cy + Math.sin(sa) * orbitR;
          if (Math.hypot(mx - nx, my - ny) <= 15) {
            selectPlanet(p.id, true, isParallel ? "parallel" : "main");
            if (p.pattern[s]) {
              draggingOrb = { universe: isParallel ? "parallel" : "main", planetId: p.id, originStep: s, hoverStep: s, moved: false };
            } else {
              p.pattern[s] = true;
              p.pulses = p.pattern.filter(Boolean).length;
              refreshAllOpenWidgets();
              saveStudioState();
              shockwaves.push({ x: nx, y: ny, r: 4, maxR: 32, color: p.color, alpha: 0.85 });
            }
            return true;
          }
        }
      }
      const dist = Math.hypot(mx - center.cx, my - center.cy);
      for (const p of list) {
        const orbitR = getOrbitRadius(p.id, isParallel) + p.springOffset + Math.sin(p.floatPhase) * 2.0;
        if (Math.abs(dist - orbitR) <= 12) {
          selectPlanet(p.id, true, isParallel ? "parallel" : "main");
          return true;
        }
      }
      return false;
    }

    canvas.addEventListener("pointerdown", e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;
      const mainC = getMainCenter();
      const parC = getParallelCenter();
      pressStartPos = { x: mx, y: my };

      if (Math.hypot(mx - mainC.cx, my - mainC.cy) <= 40) {
        togglePlay();
        return;
      }

      if (parallelVisible && Math.hypot(mx - parC.cx, my - parC.cy) <= 24) {
        parallelActive = !parallelActive;
        parallelSunVel += 5.0;
        if (parallelActive && !isPlaying) togglePlay();
        updateTopLabel();
        refreshAllOpenWidgets();
        saveStudioState();
        showToast(parallelActive ? "Parallel System IGNITED" : "Parallel System Muted");
        return;
      }

      if (hitTestSystem(planets, mainC, false, mx, my)) return;
      if (parallelVisible && hitTestSystem(parallelPlanets, parC, true, mx, my)) return;

      holdRing.style.left = `${mx}px`;
      holdRing.style.top = `${my}px`;
      holdRing.classList.add("charging");
      longPressTimer = setTimeout(() => {
        holdRing.classList.remove("charging");
        openGtaWeaponWheel(mx, my);
      }, 360);
    });

    canvas.addEventListener("pointermove", e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left, my = e.clientY - rect.top;

      if (pressStartPos && Math.hypot(mx - pressStartPos.x, my - pressStartPos.y) > 12) {
        clearTimeout(longPressTimer);
        holdRing.classList.remove("charging");
      }

      if (draggingOrb) {
        draggingOrb.moved = true;
        const isPar = draggingOrb.universe === "parallel";
        const center = isPar ? getParallelCenter() : getMainCenter();
        const list = isPar ? parallelPlanets : planets;
        const p = list[draggingOrb.planetId];
        let a = Math.atan2(my - center.cy, mx - center.cx) + Math.PI / 2;
        if (a < 0) a += Math.PI * 2;
        draggingOrb.hoverStep = Math.round((a / (Math.PI * 2)) * p.steps) % p.steps;
      }
    });

    window.addEventListener("pointerup", () => {
      clearTimeout(longPressTimer);
      holdRing.classList.remove("charging");
      pressStartPos = null;

      if (draggingOrb) {
        const list = draggingOrb.universe === "parallel" ? parallelPlanets : planets;
        const p = list[draggingOrb.planetId];
        if (!draggingOrb.moved || draggingOrb.hoverStep === draggingOrb.originStep) {
          p.pattern[draggingOrb.originStep] = false;
          if (p.stepMidi) p.stepMidi[draggingOrb.originStep] = null;
        } else {
          p.pattern[draggingOrb.originStep] = false;
          p.pattern[draggingOrb.hoverStep] = true;
          if (p.stepMidi) {
            p.stepMidi[draggingOrb.hoverStep] = p.stepMidi[draggingOrb.originStep];
            p.stepMidi[draggingOrb.originStep] = null;
          }
          p.springVel += 2.8;
        }
        p.pulses = p.pattern.filter(Boolean).length;
        refreshAllOpenWidgets();
        saveStudioState();
        draggingOrb = null;
      }
    });

    document.getElementById("btnPlay").addEventListener("click", togglePlay);
    window.addEventListener("keydown", e => {
      if (document.activeElement.tagName === "INPUT") return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    });

    // Boot
    solarScenes[0] = captureCurrentSnapshot("DECK 01");
    loadStudioState();
    updateTopLabel();
    requestAnimationFrame(renderCosmos);
  </script>
</body>
</html>
