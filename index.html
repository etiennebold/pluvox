<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLUVOX" />
  <meta name="theme-color" content="#03050a" />
  <link id="appleTouchIcon" rel="apple-touch-icon" />
  <link id="faviconIcon" rel="icon" type="image/png" />
  <link id="pwaManifest" rel="manifest" />
  <title>PLUVOX — Spatial Orbital Music Studio</title>
  <style>
    :root {
      --void: #03050a;
      --widget-bg: rgba(10, 15, 28, 0.22);
      --pill-bg: rgba(10, 15, 28, 0.58);
      --border: rgba(255, 255, 255, 0.16);
      --border-hi: rgba(56, 189, 248, 0.55);
      --text: #f8fafc;
      --dim: #94a3b8;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --rose: #fb7185;
      --violet: #c084fc;
      --emerald: #10b981;
      --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      scrollbar-width: thin;
      scrollbar-color: rgba(56, 189, 248, 0.35) rgba(255, 255, 255, 0.04);
    }

    /* CUSTOM DARK-GLASS SCROLLBARS (NO WINDOWS DEFAULT BARS) */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(56, 189, 248, 0.32);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(56, 189, 248, 0.6);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      user-select: none;
      touch-action: none;
    }

    canvas#cosmos {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: grab;
    }

    canvas#cosmos:active { cursor: grabbing; }

    /* MINIMALIST TOP BAR: ONLY BRAND, CELESTIAL & IGNITE */
    .top-bar {
      position: fixed;
      top: max(14px, env(safe-area-inset-top));
      left: 18px;
      right: 18px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .top-cluster {
      display: flex;
      align-items: center;
      gap: 0.48rem;
      pointer-events: auto;
    }

    .brand {
      font-family: var(--mono);
      font-size: 1.12rem;
      font-weight: 800;
      letter-spacing: 0.2em;
      background: linear-gradient(90deg, #ffffff 30%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .meta-sub {
      font-family: var(--mono);
      font-size: 0.56rem;
      color: var(--dim);
      letter-spacing: 0.08em;
    }

    .hud-pill {
      background: var(--pill-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.42rem 0.82rem;
      font-family: var(--mono);
      font-size: 0.64rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.38rem;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }

    .hud-pill:hover { border-color: rgba(255, 255, 255, 0.4); }
    .hud-pill:active { transform: scale(0.95); }

    .hud-pill.playing {
      background: rgba(16, 185, 129, 0.24);
      border-color: var(--emerald);
      color: #a7f3d0;
    }

    .hud-pill.muse-pill {
      border-color: rgba(192, 132, 252, 0.42);
      color: #e9d5ff;
    }

    .hud-pill svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .reset-view-pill {
      position: fixed;
      top: 56px;
      right: 18px;
      z-index: 20;
      display: none;
    }

    .reset-view-pill.visible { display: inline-flex; }

    /* BOTTOM CENTER WEAPON WHEEL HUB */
    .wheel-trigger-wrap {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
    }

    .wheel-hub-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--pill-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-hi);
      color: var(--cyan);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .wheel-hub-btn:hover { transform: scale(1.08); }
    .wheel-hub-btn:active { transform: scale(0.93); }
    .wheel-hub-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* GTA-STYLE SEGMENTED WEDGE WEAPON WHEEL */
    .wheel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(2, 4, 10, 0.42);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }

    .wheel-backdrop.open { opacity: 1; pointer-events: auto; }

    .gta-wheel-container {
      position: fixed;
      width: 310px;
      height: 310px;
      margin-left: -155px;
      margin-top: -155px;
      z-index: 65;
      transform: scale(0.84);
      opacity: 0;
      will-change: transform, opacity;
      transition: transform 0.16s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.12s ease;
    }

    .wheel-backdrop.open .gta-wheel-container { transform: scale(1); opacity: 1; }
    svg#gtaWheelSvg { width: 100%; height: 100%; overflow: visible; }

    .wheel-wedge {
      fill: rgba(11, 17, 32, 0.88);
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 1.5;
      cursor: pointer;
      transition: fill 0.1s ease, stroke 0.1s ease, transform 0.12s ease;
      transform-origin: 155px 155px;
    }

    .wheel-wedge:hover {
      fill: rgba(56, 189, 248, 0.32);
      stroke: var(--cyan);
      stroke-width: 2;
      transform: scale(1.035);
    }

    .wheel-wedge.widget-open { stroke: rgba(16, 185, 129, 0.65); }

    .wheel-wedge-content {
      position: absolute;
      width: 68px;
      height: 46px;
      margin-left: -34px;
      margin-top: -23px;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
    }

    .wheel-wedge-content svg {
      width: 16px;
      height: 16px;
      stroke: #f8fafc;
      fill: none;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wheel-wedge-label {
      font-family: var(--mono);
      font-size: 0.51rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #f8fafc;
    }

    .wheel-center-readout {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 84px;
      height: 84px;
      border-radius: 50%;
      background: rgba(6, 10, 20, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      font-family: var(--mono);
    }

    /* PERSISTENT, DRAGGABLE, 80% TRANSPARENT LAYERABLE WIDGETS */
    .studio-widget {
      position: fixed;
      width: 324px;
      max-width: 92vw;
      background: var(--widget-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      z-index: 30;
      overflow: hidden;
      will-change: left, top;
    }

    .studio-widget:hover { border-color: rgba(255, 255, 255, 0.32); }

    .widget-drag-bar {
      padding: 0.44rem 0.7rem;
      background: rgba(255, 255, 255, 0.06);
      border-bottom: 1px solid rgba(255, 255, 255, 0.09);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }

    .widget-close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      font-size: 0.68rem;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .widget-close-btn:hover { background: rgba(244, 63, 94, 0.45); }

    .widget-body {
      padding: 0.65rem;
      max-height: 62vh;
      overflow-y: auto;
    }

    .section-tag {
      font-family: var(--mono);
      font-size: 0.52rem;
      font-weight: 800;
      color: var(--dim);
      letter-spacing: 0.08em;
      margin-bottom: 0.35rem;
      text-transform: uppercase;
    }

    .orbit-switcher-bar {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: 0.52rem;
    }

    .orb-tab {
      flex: 1;
      min-width: 42px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      padding: 0.22rem 0.34rem;
      font-family: var(--mono);
      font-size: 0.52rem;
      font-weight: 800;
      color: var(--dim);
      cursor: pointer;
      text-align: center;
    }

    .orb-tab.active {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
    }

    .w-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      font-family: var(--mono);
      font-size: 0.59rem;
      color: var(--text);
    }

    .w-row:last-child { margin-bottom: 0; }

    .w-val {
      min-width: 38px;
      text-align: right;
      font-weight: 800;
      color: var(--cyan);
    }

    .w-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.28rem; }
    .w-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.3rem; }

    .w-btn {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 0.36rem 0.26rem;
      font-family: var(--mono);
      font-size: 0.53rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .w-btn:hover { border-color: var(--cyan); background: rgba(56, 189, 248, 0.18); }
    .w-btn.active { border-color: var(--emerald); background: rgba(16, 185, 129, 0.28); color: #a7f3d0; }
    .w-btn.warn { border-color: var(--rose); background: rgba(244, 63, 94, 0.28); color: #ffe4e6; animation: pulseW 1s infinite; }

    .jukebox-scroll {
      max-height: 155px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 0.55rem;
      padding-right: 3px;
    }

    .motif-row-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.11);
      border-radius: 8px;
      padding: 0.34rem 0.52rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--mono);
      font-size: 0.54rem;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }

    .motif-row-btn:hover {
      border-color: var(--violet);
      background: rgba(192, 132, 252, 0.18);
    }

    .motif-cat-tag {
      font-size: 0.46rem;
      color: var(--cyan);
      opacity: 0.85;
      margin-left: 6px;
    }

    @keyframes pulseW { 0%,100% { opacity: 1; } 50% { opacity: 0.65; } }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      height: 4px;
      border-radius: 999px;
      outline: none;
      flex: 1;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--cyan);
      cursor: pointer;
    }

    select.w-select {
      background: rgba(10, 15, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 0.26rem 0.4rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.56rem;
      font-weight: 700;
      outline: none;
    }

    /* BOTTOM-RISING "FIND THE NOTE" GLASS PIANO & GUITAR NECK DOCK */
    .note-finder-dock {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%) translateY(105%);
      width: min(680px, 96vw);
      background: rgba(8, 13, 24, 0.26);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-bottom: none;
      border-radius: 20px 20px 0 0;
      padding: 0.65rem 0.8rem max(14px, env(safe-area-inset-bottom));
      z-index: 45;
      transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: 0 -16px 48px rgba(0, 0, 0, 0.65);
    }

    .note-finder-dock.open { transform: translateX(-50%) translateY(0); }

    .nf-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.55rem;
      font-family: var(--mono);
      font-size: 0.58rem;
    }

    .nf-group { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; }

    .piano-bed {
      position: relative;
      height: 112px;
      display: flex;
      gap: 3px;
      user-select: none;
    }

    .p-white {
      flex: 1;
      height: 100%;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 0 0 10px 10px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      font-family: var(--mono);
      font-size: 0.52rem;
      color: var(--dim);
      cursor: pointer;
    }

    .p-white:active, .p-white.target-hint {
      background: rgba(56, 189, 248, 0.35);
      border-color: var(--cyan);
      color: #fff;
    }

    .p-black {
      position: absolute;
      top: 0;
      width: 4.4%;
      height: 62%;
      background: rgba(4, 7, 15, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 0 0 7px 7px;
      z-index: 3;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 4px;
      font-family: var(--mono);
      font-size: 0.44rem;
      color: var(--cyan);
    }

    .p-black:active, .p-black.target-hint {
      background: var(--cyan);
      color: #03050a;
    }

    .guitar-neck {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
      padding: 6px;
      overflow-x: auto;
    }

    .g-string-row {
      display: grid;
      grid-template-columns: 32px repeat(12, minmax(36px, 1fr));
      gap: 2px;
      align-items: center;
    }

    .g-string-label {
      font-family: var(--mono);
      font-size: 0.52rem;
      font-weight: 800;
      color: var(--amber);
      text-align: center;
    }

    .g-fret {
      height: 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      font-family: var(--mono);
      font-size: 0.46rem;
      color: var(--dim);
      display: grid;
      place-items: center;
      cursor: pointer;
      position: relative;
    }

    .g-fret.dot-marker::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(245, 158, 11, 0.45);
      bottom: 2px;
    }

    .g-fret:active { background: rgba(245, 158, 11, 0.42); border-color: var(--amber); color: #fff; }

    .hold-ring {
      position: fixed;
      width: 66px;
      height: 66px;
      margin-left: -33px;
      margin-top: -33px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      pointer-events: none;
      z-index: 55;
      opacity: 0;
      transform: scale(0.4);
      transition: transform 0.36s linear, opacity 0.12s ease;
    }

    .hold-ring.charging { opacity: 0.9; transform: scale(1.15); }

    .toast-pill {
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 75;
      background: rgba(16, 185, 129, 0.26);
      border: 1px solid var(--emerald);
      color: #a7f3d0;
      font-family: var(--mono);
      font-size: 0.64rem;
      padding: 0.32rem 0.85rem;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
    }

    .toast-pill.show { opacity: 1; }
  </style>
</head>
<body>

  <canvas id="cosmos"></canvas>
  <div id="holdRing" class="hold-ring"></div>
  <div id="toastPill" class="toast-pill"></div>

  <!-- MINIMALIST TOP BAR: ONLY BRAND, CELESTIAL & IGNITE -->
  <header class="top-bar">
    <div class="top-cluster">
      <span class="brand">PLUVOX</span>
      <span class="meta-sub" id="topMetaLabel">COSMOS · 88 BPM</span>
    </div>

    <div class="top-cluster">
      <button id="btnTopCelestial" class="hud-pill muse-pill" title="Open Celestial Study Jukebox & Ear Training">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/></svg>
        <span>CELESTIAL</span>
      </button>
      <button id="btnPlay" class="hud-pill">
        <svg id="playIconSvg" viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>
        <span id="playBtnText">IGNITE</span>
      </button>
    </div>
  </header>

  <button id="btnResetView" class="hud-pill reset-view-pill">CENTER VIEW</button>

  <!-- BOTTOM CENTER WEAPON WHEEL HUB -->
  <div class="wheel-trigger-wrap">
    <button class="wheel-hub-btn" id="btnOpenWheel" title="Open Radial Menu (or Long-Press anywhere in space)">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M19.1 4.9l-2.8 2.8M7.7 16.3l-2.8 2.8"/></svg>
    </button>
  </div>

  <!-- GTA-STYLE SEGMENTED WEDGE WEAPON WHEEL -->
  <div class="wheel-backdrop" id="wheelBackdrop">
    <div class="gta-wheel-container" id="gtaWheel">
      <svg id="gtaWheelSvg" viewBox="0 0 310 310"></svg>
      <div class="wheel-center-readout" id="wheelCenterClose">
        <span style="font-size:0.55rem; color:var(--dim);">SELECT</span>
        <strong id="wheelHoverName" style="font-size:0.68rem; color:#fff; margin-top:2px;">WHEEL</strong>
      </div>
    </div>
  </div>

  <!-- BOTTOM-RISING "FIND THE NOTE" GLASS PIANO & GUITAR NECK -->
  <div class="note-finder-dock" id="noteFinderDock"></div>

  <!-- LAYER FOR PERSISTENT DRAGGABLE WIDGETS -->
  <div id="widgetLayer"></div>

  <script>
    // =========================================================================
    // 1. NATIVE iOS & ANDROID APP LOGO GENERATOR + PWA MANIFEST
    // =========================================================================
    function generateAppIconDataUrl(size = 512) {
      const c = document.createElement("canvas");
      c.width = size; c.height = size;
      const g = c.getContext("2d");

      const bgGrad = g.createRadialGradient(size * 0.5, size * 0.5, size * 0.05, size * 0.5, size * 0.5, size * 0.72);
      bgGrad.addColorStop(0, "#0b1224");
      bgGrad.addColorStop(0.65, "#050814");
      bgGrad.addColorStop(1, "#020308");
      g.fillStyle = bgGrad;
      g.fillRect(0, 0, size, size);

      const cx = size * 0.5, cy = size * 0.5, baseR = size * 0.31;

      for (let layer = 1; layer <= 6; layer++) {
        g.beginPath();
        const rLayer = baseR + size * 0.018 + layer * (size * 0.015);
        const amp = (size * 0.018) * (1 - layer / 7.5);
        for (let i = 0; i <= 180; i++) {
          const a = (i / 180) * Math.PI * 2;
          const r = rLayer + Math.sin(a * 4 + layer * 0.35) * Math.cos(a * 2) * amp;
          const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
          if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.closePath();
        const rippleGrad = g.createLinearGradient(cx - rLayer, cy, cx + rLayer, cy);
        rippleGrad.addColorStop(0, `rgba(245, 158, 11, ${0.32 - layer * 0.04})`);
        rippleGrad.addColorStop(1, `rgba(56, 189, 248, ${0.32 - layer * 0.04})`);
        g.strokeStyle = rippleGrad;
        g.lineWidth = Math.max(1, size * 0.0022);
        g.stroke();
      }

      const ringGrad = g.createLinearGradient(cx - baseR, cy, cx + baseR, cy);
      ringGrad.addColorStop(0, "#f59e0b");
      ringGrad.addColorStop(0.48, "#fde68a");
      ringGrad.addColorStop(0.55, "#7dd3fc");
      ringGrad.addColorStop(1, "#38bdf8");

      g.save();
      g.beginPath();
      g.arc(cx, cy, baseR, 0, Math.PI * 2);
      g.strokeStyle = ringGrad;
      g.lineWidth = size * 0.022;
      g.shadowColor = "#38bdf8";
      g.shadowBlur = size * 0.045;
      g.stroke();
      g.restore();

      g.save();
      const fontSize = Math.round(size * 0.082);
      g.font = `300 ${fontSize}px "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
      g.fillStyle = "#f8fafc";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.shadowColor = "rgba(56, 189, 248, 0.55)";
      g.shadowBlur = size * 0.02;

      const letters = "PLUVOX".split("");
      const spacing = fontSize * 0.92;
      const totalW = spacing * (letters.length - 1);
      letters.forEach((ch, idx) => g.fillText(ch, cx - totalW / 2 + idx * spacing, cy + size * 0.004));
      g.restore();

      return c.toDataURL("image/png");
    }

    // Maps 0..100 Speed Slider -> Multiplier (0 = Paused, 50 = 1.0x Normal, 100 = 2.0x Double)
    function speedScaleToMultiplier(speed0to100) {

    function quantizeMidiToScale(rawMidi, scaleKey) {
      const intervals = SCALES[scaleKey] || SCALES.minorPentatonic;
      const baseC = 48;
      let bestMidi = rawMidi, minDiff = Infinity;
      for (let oct = -1; oct <= 3; oct++) {
        for (const interval of intervals) {
          const candidate = baseC + oct * 12 + interval;
          const diff = Math.abs(rawMidi - candidate);
          if (diff < minDiff) { minDiff = diff; bestMidi = candidate; }
        }
      }
      return bestMidi;
    }

    function generateEuclidean(steps, pulses) {
      pulses = Math.max(0, Math.min(steps, pulses));
      const pattern = new Array(steps).fill(false);
      if (pulses === 0) return pattern;
      let bucket = 0;
      for (let i = 0; i < steps; i++) {
        bucket += pulses;
        if (bucket >= steps) { bucket -= steps; pattern[i] = true; }
      }
      return pattern;
    }

          localStorage.setItem("pluvox_v20_student", JSON.stringify({
            activeSceneIdx, solarScenes, current: captureCurrentSnapshot()
          }));
        } catch (_) {}
      }, 350);

    // Compute exact MIDI note for any orbit step (never returns undefined or NaN)
    function getStepMidiNote(planet, stepIndex) {
      const intervals = SCALES[scaleKey] || SCALES.minorPentatonic;
      const custom = planet.stepMidi[stepIndex % planet.stepMidi.length];
      if (typeof custom === "number" && !Number.isNaN(custom)) return custom;

      const deg = planet.stepNotes[stepIndex % planet.stepNotes.length] ?? 0;
      const noteIdx = Math.abs(deg + planet.pitchOffset) % intervals.length;
      const t = planet.type;
      const baseOct = (t.includes("Bass") || t === "chugStrum") ? 36 : (t === "powerStrum" ? 40 : 48);
      return baseOct + intervals[noteIdx];
    }

    function updateLiveHarmonyReadout(midiNotes) {
      if (!midiNotes || midiNotes.length === 0) return;
      const uniquePcs = [...new Set(midiNotes.map(m => ((m % 12) + 12) % 12))].sort((a, b) => a - b);
      const rootName = NOTE_NAMES[uniquePcs[0]];
      if (uniquePcs.length === 1) {
        liveHarmonyLabel = `${rootName} ROOT`;
      } else if (uniquePcs.length === 2) {
        const diff = (uniquePcs[1] - uniquePcs[0] + 12) % 12;
        const intervalNames = { 3: "MINOR 3RD", 4: "MAJOR 3RD", 5: "4TH", 7: "5TH POWER", 10: "MIN 7TH" };
        liveHarmonyLabel = `${rootName} ${intervalNames[diff] || "DYAD"}`;
      } else {
        const hasMin3 = uniquePcs.includes((uniquePcs[0] + 3) % 12);
        const hasMaj3 = uniquePcs.includes((uniquePcs[0] + 4) % 12);
        liveHarmonyLabel = `${rootName} ${hasMin3 ? "MINOR" : (hasMaj3 ? "MAJOR" : "CHORD")}`;
      }
    }

    // =========================================================================
    // 4. BOTTOM-RISING "FIND THE NOTE" GLASS PIANO & GUITAR NECK + EAR TRAINING
    // =========================================================================
    const noteFinderDock = document.getElementById("noteFinderDock");
    let isNoteFinderOpen = false;
    let noteFinderInstrument = "piano";
    let noteFinderMode = "audition";
    let noteFinderWriteCursor = 0;
    let guitarPowerChordMode = false;

    function toggleNoteFinder(forceState = null) {
      isNoteFinderOpen = forceState !== null ? forceState : !isNoteFinderOpen;
      noteFinderDock.classList.toggle("open", isNoteFinderOpen);
      if (isNoteFinderOpen) renderNoteFinder();

    function startEarTrainingChallenge() {
      initAudioEngine();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const pool = [48, 50, 51, 53, 55, 58, 60]; // C minor pentatonic / Dorian
      earChallengeNotes = Array.from({ length: 3 }, () => pool[Math.floor(Math.random() * pool.length)]);
      earChallengeProgress = 0;
      isEarTrainingActive = true;

      // Play the 3-note melody for the student to find by ear
      const now = audioCtx.currentTime;
      earChallengeNotes.forEach((m, i) => {
        triggerGrandPianoNote(now + i * 0.48, m, 0.72, 0, false);
      });

      toggleNoteFinder(true);
      showToast("Ear Training: Find the 3 notes on the keys!");
    }

    function playAuditionOrWriteNote(midi, forcePowerStrum = false) {
      initAudioEngine();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const p = getSelectedPlanet();
      const now = audioCtx.currentTime;

      const useStrum = forcePowerStrum || p.type === "powerStrum" || p.type === "chugStrum";
      if (useStrum) {
        triggerPowerChordStrum(now, midi, 0.68, p.type === "chugStrum", 0);
      } else if (p.type === "acousGtr" || p.type === "cleanChorus" || p.type === "elecGuitar") {
        triggerGuitarPluckNote(now, midi, 0.68, 0, p.type);
      } else {
        triggerGrandPianoNote(now, midi, 0.68, 0, p.type === "tineKeys");
      }

      // Check Ear-Training Call & Response match
      if (isEarTrainingActive && earChallengeNotes.length > 0) {
        const expected = earChallengeNotes[earChallengeProgress];
        if (midi % 12 === expected % 12) {
          earChallengeProgress++;
          if (earChallengeProgress >= earChallengeNotes.length) {
            isEarTrainingActive = false;
            showToast(`Matched all 3 notes (${earChallengeNotes.map(midiToName).join(" - ")})!`);
          } else {
            showToast(`Correct (${midiToName(midi)})! Find note ${earChallengeProgress + 1} of 3...`);
          }
        } else {
          showToast(`Played ${midiToName(midi)} — listen again & try another key`);
        }
      }

      if (noteFinderMode === "write") {
        const activeSteps = p.pattern.map((v, i) => (v ? i : -1)).filter(i => i !== -1);
        const targetStep = activeSteps.length > 0
          ? activeSteps[noteFinderWriteCursor % activeSteps.length]
          : (noteFinderWriteCursor % p.steps);

        p.pattern[targetStep] = true;
        p.pulses = p.pattern.filter(Boolean).length;
        p.stepMidi[targetStep] = midi;
        p.nodeFlashes[targetStep] = 1.0;
        noteFinderWriteCursor++;

        refreshAllOpenWidgets();
        saveStudioState();
        showToast(`Wrote ${midiToName(midi)} → ${p.baseName} Step ${targetStep + 1}`);
      } else if (!isEarTrainingActive) {
        showToast(`Note: ${midiToName(midi)}${useStrum ? " Power Chord" : ""}`);
      }
    }

    // =========================================================================

    // =========================================================================
    const WEDGE_DEFS = [
      { id: "vox",      label: "VOX",      svgPath: `<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/>` },

    const wheelBackdrop = document.getElementById("wheelBackdrop");
    const gtaWheel = document.getElementById("gtaWheel");

    function polarToCartesian(cx, cy, r, angleDeg) {
      const rad = ((angleDeg - 90) * Math.PI) / 180;
      return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
    }

    function createAnnularWedgePath(cx, cy, innerR, outerR, startAngle, endAngle) {
      const p1 = polarToCartesian(cx, cy, outerR, startAngle);
      const p2 = polarToCartesian(cx, cy, outerR, endAngle);
      const p3 = polarToCartesian(cx, cy, innerR, endAngle);
      const p4 = polarToCartesian(cx, cy, innerR, startAngle);
      const largeArc = endAngle - startAngle <= 180 ? "0" : "1";
      return `M ${p1.x} ${p1.y} A ${outerR} ${outerR} 0 ${largeArc} 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${innerR} ${innerR} 0 ${largeArc} 0 ${p4.x} ${p4.y} Z`;
    }

    function openGtaWeaponWheel(x, y) {
      const margin = 165;
      gtaWheel.style.left = `${Math.max(margin, Math.min(logicalW - margin, x))}px`;
      gtaWheel.style.top = `${Math.max(margin, Math.min(logicalH - margin, y))}px`;

      gtaWheelSvg.innerHTML = "";
      gtaWheel.querySelectorAll(".wheel-wedge-content").forEach(el => el.remove());

      const cx = 155, cy = 155, innerR = 48, outerR = 148;
      const sliceDeg = 360 / WEDGE_DEFS.length;
      const gapDeg = 2.4;

      WEDGE_DEFS.forEach((w, idx) => {
        const startA = idx * sliceDeg - sliceDeg / 2 + gapDeg / 2;
        const endA = (idx + 1) * sliceDeg - sliceDeg / 2 - gapDeg / 2;
        const midA = idx * sliceDeg;

        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", createAnnularWedgePath(cx, cy, innerR, outerR, startA, endA));
        const isActive = (w.id === "keys" && isNoteFinderOpen) || openWidgets[w.id];
        path.setAttribute("class", `wheel-wedge ${isActive ? "widget-open" : ""}`);

        path.addEventListener("pointerenter", () => { document.getElementById("wheelHoverName").textContent = w.label; });
        path.addEventListener("click", () => {
          closeGtaWeaponWheel();
          if (w.id === "keys") toggleNoteFinder();
          else togglePersistentWidget(w.id);
        });
        gtaWheelSvg.appendChild(path);

        const labelPos = polarToCartesian(cx, cy, (innerR + outerR) * 0.52, midA);
        const content = document.createElement("div");
        content.className = "wheel-wedge-content";
        content.style.left = `${labelPos.x}px`;
        content.style.top = `${labelPos.y}px`;
        content.innerHTML = `<svg viewBox="0 0 24 24">${w.svgPath}</svg><span class="wheel-wedge-label">${w.label}</span>`;
        gtaWheel.appendChild(content);
      });

      document.getElementById("wheelHoverName").textContent = "WHEEL";
      wheelBackdrop.classList.add("open");
    }

    function closeGtaWeaponWheel() { wheelBackdrop.classList.remove("open"); }
    wheelBackdrop.addEventListener("click", e => { if (e.target === wheelBackdrop || e.target.closest("#wheelCenterClose")) closeGtaWeaponWheel(); });
    document.getElementById("btnOpenWheel").addEventListener("click", () => openGtaWeaponWheel(logicalW / 2, logicalH / 2));
    document.getElementById("btnTopCelestial").addEventListener("click", () => togglePersistentWidget("muse"));

    // =========================================================================
    // 6. PERSISTENT, DRAGGABLE, 80% TRANSPARENT LAYERABLE WIDGET SYSTEM
    // =========================================================================
    const widgetLayer = document.getElementById("widgetLayer");
    const openWidgets = {};
    let topZIndex = 31;

    function bringWidgetToFront(el) {
      topZIndex++;
      el.style.zIndex = topZIndex;
    }

    function togglePersistentWidget(id, forceOpen = false) {
      if (openWidgets[id] && !forceOpen) {
        openWidgets[id].remove();
        delete openWidgets[id];
        return;
      }
      if (!openWidgets[id]) {
        const el = document.createElement("div");
        el.className = "studio-widget";
        const count = Object.keys(openWidgets).length;
        el.style.left = `${Math.min(logicalW - 332, Math.max(14, 20 + (count % 3) * 32))}px`;
        el.style.top = `${Math.min(logicalH - 300, Math.max(64, 70 + (count % 4) * 36))}px`;
        bringWidgetToFront(el);
        el.addEventListener("pointerdown", () => bringWidgetToFront(el));
        widgetLayer.appendChild(el);
        openWidgets[id] = el;
      } else {
        bringWidgetToFront(openWidgets[id]);
      }
      renderWidgetContent(id);
    }

    function makeWidgetDraggable(widgetEl, handleEl) {
      let dragging = false, offsetX = 0, offsetY = 0;
      handleEl.addEventListener("pointerdown", e => {
        if (e.target.closest("button")) return;
        dragging = true;
        bringWidgetToFront(widgetEl);
        const rect = widgetEl.getBoundingClientRect();
        offsetX = e.clientX - rect.left;
        offsetY = e.clientY - rect.top;
        handleEl.setPointerCapture(e.pointerId);
      });
      handleEl.addEventListener("pointermove", e => {
        if (!dragging) return;
        widgetEl.style.left = `${Math.max(4, Math.min(logicalW - widgetEl.offsetWidth - 4, e.clientX - offsetX))}px`;
        widgetEl.style.top = `${Math.max(4, Math.min(logicalH - widgetEl.offsetHeight - 4, e.clientY - offsetY))}px`;
      });
      handleEl.addEventListener("pointerup", () => { dragging = false; });
    }

    function refreshAllOpenWidgets() {
      Object.keys(openWidgets).forEach(id => renderWidgetContent(id));
      if (isNoteFinderOpen) renderNoteFinder();
    }

    function renderJukeboxList(containerEl) {

    function renderWidgetContent(id) {

    function updateTopLabel() {
      document.getElementById("topMetaLabel").textContent = `${UNIVERSES[activeUniverseKey].label} · ${bpm} BPM`;
    }

    // =========================================================================
    // 7. CLEAN, STATIC-FREE ACOUSTIC & ELECTRIC WEB AUDIO ENGINE
    // =========================================================================
    let audioCtx = null, masterFilter = null, masterAnalyser = null, masterGainBus = null;
    let compressorNode = null, delayNode = null, delayWet = null, rainBandFilter = null, rainGain = null;
    let focusCarrierOsc = null, focusLfoOsc = null, focusMasterGain = null;
    let sharedNoiseBuffer = null;
    const planetPanners = [];

    let isPlaying = false, schedulerTimer = null, nextTickTime = 0, globalTick = 0;
    let micStream = null, analyserNode = null, isHumCapturing = false;
    let humCapturedSteps = new Array(16).fill(false), humCapturedNotes = new Array(16).fill(0);

    function initAudioEngine() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const noiseLen = audioCtx.sampleRate;
      sharedNoiseBuffer = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
      const nOut = sharedNoiseBuffer.getChannelData(0);
      for (let i = 0; i < noiseLen; i++) nOut[i] = Math.random() * 2 - 1;

      // Clean headroom summing bus (zero distortion/static)
      masterGainBus = audioCtx.createGain();
      masterGainBus.gain.value = 0.65;

      masterFilter = audioCtx.createBiquadFilter();
      masterFilter.type = "lowpass";
      masterFilter.frequency.value = filterCutoff;

      compressorNode = audioCtx.createDynamicsCompressor();
      compressorNode.threshold.value = -10;
      compressorNode.knee.value = 12;
      compressorNode.ratio.value = 3.0;
      compressorNode.attack.value = 0.005;
      compressorNode.release.value = 0.15;

      masterAnalyser = audioCtx.createAnalyser();
      masterAnalyser.fftSize = 128;

      delayNode = audioCtx.createDelay(2.0);
      delayNode.delayTime.value = 0.32;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.28;
      delayWet = audioCtx.createGain();
      delayWet.gain.value = delayAmount / 100;

      delayNode.connect(fb);
      fb.connect(delayNode);
      delayNode.connect(delayWet);
      delayWet.connect(masterGainBus);

      masterGainBus.connect(masterFilter);
      masterFilter.connect(compressorNode);
      compressorNode.connect(masterAnalyser);
      masterAnalyser.connect(audioCtx.destination);

      for (let i = 0; i < 8; i++) {
        const pan = audioCtx.createStereoPanner();
        pan.connect(masterGainBus);
        planetPanners.push(pan);
      }

      focusCarrierOsc = audioCtx.createOscillator();
      focusCarrierOsc.frequency.value = 174;
      const modGain = audioCtx.createGain();
      modGain.gain.value = 0.5;
      focusLfoOsc = audioCtx.createOscillator();
      focusLfoOsc.frequency.value = focusHz || 10;
      const depth = audioCtx.createGain();
      depth.gain.value = 0.45;
      focusMasterGain = audioCtx.createGain();
      focusMasterGain.gain.value = 0.0001;

      focusLfoOsc.connect(depth);
      depth.connect(modGain.gain);
      focusCarrierOsc.connect(modGain);
      modGain.connect(focusMasterGain);
      focusMasterGain.connect(compressorNode);
      focusCarrierOsc.start();
      focusLfoOsc.start();
      updateBrainwaveCarrier();

      // Gentle optional rain ambience (muted at 0% by default so there is zero static)
      const bufferSize = audioCtx.sampleRate * 2;
      const rainBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const rd = rainBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.997 * b0 + w * 0.03;
        b1 = 0.985 * b1 + w * 0.04;
        b2 = 0.950 * b2 + w * 0.05;
        rd[i] = (b0 + b1 + b2) * 0.035;
      }
      const rainSrc = audioCtx.createBufferSource();
      rainSrc.buffer = rainBuf;
      rainSrc.loop = true;
      rainBandFilter = audioCtx.createBiquadFilter();
      rainBandFilter.type = "bandpass";
      rainBandFilter.frequency.value = UNIVERSES[activeUniverseKey].rainFreq;
      rainGain = audioCtx.createGain();
      rainGain.gain.value = (rainLevel / 100) * 0.25;
      rainSrc.connect(rainBandFilter);
      rainBandFilter.connect(rainGain);
      rainGain.connect(compressorNode);
      rainSrc.start();
    }

    function updateBrainwaveCarrier() {
      if (!audioCtx || !focusMasterGain) return;
      if (focusHz <= 0) focusMasterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.12);
      else { focusLfoOsc.frequency.setTargetAtTime(focusHz, audioCtx.currentTime, 0.08); focusMasterGain.gain.setTargetAtTime(0.025, audioCtx.currentTime, 0.12); }
    }

    function setUniverse(key, silent = false) {
      if (!UNIVERSES[key]) return;
      activeUniverseKey = key;
      const u = UNIVERSES[key];
      filterCutoff = u.filterDefault;
      if (rainBandFilter && audioCtx) rainBandFilter.frequency.setTargetAtTime(u.rainFreq, audioCtx.currentTime, 0.12);
      if (masterFilter && audioCtx) masterFilter.frequency.setTargetAtTime(filterCutoff, audioCtx.currentTime, 0.12);
      updateTopLabel();
      if (!silent) showToast(`Universe: ${u.label}`);
    }

    // Warm Acoustic / Clean Electric / Overdrive Guitar Pluck Synthesis
    function triggerGuitarPluckNote(time, midi, vol, panIdx = 0, mode = "acousGtr", targetCtx = audioCtx, targetDest = null, targetDelay = delayNode) {
      const dest = targetDest || planetPanners[panIdx % planetPanners.length];
      const freq = midiToFreq(midi);
      const osc1 = targetCtx.createOscillator();
      const osc2 = targetCtx.createOscillator();
      const bodyFilter = targetCtx.createBiquadFilter();
      const gain = targetCtx.createGain();

      osc1.type = mode === "elecGuitar" ? "sawtooth" : "triangle";
      osc2.type = "sine";
      osc1.frequency.setValueAtTime(freq, time);
      osc2.frequency.setValueAtTime(freq * 2.0, time);

      bodyFilter.type = "lowpass";
      bodyFilter.Q.value = mode === "acousGtr" ? 2.4 : 1.4;
      bodyFilter.frequency.setValueAtTime(mode === "elecGuitar" ? 2600 : 2100, time);
      bodyFilter.frequency.exponentialRampToValueAtTime(340, time + 0.45);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(vol * 0.38, time + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.55);

      osc1.connect(bodyFilter);
      osc2.connect(bodyFilter);
      bodyFilter.connect(gain);
      gain.connect(dest);
      if (targetDelay) gain.connect(targetDelay);

      osc1.start(time); osc2.start(time);
      osc1.stop(time + 0.58); osc2.stop(time + 0.58);
    }

    // Clean Power Chord Down-Strum (Root + 5th + Octave without static clipping)
    function triggerPowerChordStrum(time, rootMidi, vol, isPalmMute = false, panIdx = 0, targetCtx = audioCtx, targetDest = null, targetDelay = delayNode) {
      const dest = targetDest || planetPanners[panIdx % planetPanners.length];
      const cabFilter = targetCtx.createBiquadFilter();
      cabFilter.type = "lowpass";
      cabFilter.frequency.setValueAtTime(isPalmMute ? 1250 : 2400, time);
      cabFilter.frequency.exponentialRampToValueAtTime(isPalmMute ? 260 : 540, time + (isPalmMute ? 0.14 : 0.42));

      cabFilter.connect(dest);
      if (!isPalmMute && targetDelay) cabFilter.connect(targetDelay);

      [0, 7, 12].forEach((semi, idx) => {
        const strumDelay = idx * 0.015;
        const osc = targetCtx.createOscillator();
        const gain = targetCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(midiToFreq(rootMidi + semi), time + strumDelay);

        gain.gain.setValueAtTime(0.0001, time + strumDelay);
        gain.gain.linearRampToValueAtTime(vol * 0.16, time + strumDelay + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + strumDelay + (isPalmMute ? 0.16 : 0.46));

        osc.connect(gain);
        gain.connect(cabFilter);
        osc.start(time + strumDelay);
        osc.stop(time + strumDelay + 0.5);
      });
    }

    // Grand Piano / Tine Electric Piano Synthesis
    function triggerGrandPianoNote(time, midi, vol, panIdx = 0, isTine = false, targetCtx = audioCtx, targetDest = null, targetDelay = delayNode) {
      const dest = targetDest || planetPanners[panIdx % planetPanners.length];
      const freq = midiToFreq(midi);
      const oscFund = targetCtx.createOscillator();
      const oscHarm = targetCtx.createOscillator();
      const filter = targetCtx.createBiquadFilter();
      const gain = targetCtx.createGain();

      oscFund.type = "triangle";
      oscHarm.type = isTine ? "sine" : "triangle";
      oscFund.frequency.setValueAtTime(freq, time);
      oscHarm.frequency.setValueAtTime(freq * (isTine ? 3.0 : 2.0), time);

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(isTine ? 3200 : 2500, time);
      filter.frequency.exponentialRampToValueAtTime(380, time + 0.55);

      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.linearRampToValueAtTime(vol * 0.38, time + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.65);

      oscFund.connect(filter);
      oscHarm.connect(filter);
      filter.connect(gain);
      gain.connect(dest);
      if (targetDelay) gain.connect(targetDelay);

      oscFund.start(time); oscHarm.start(time);
      oscFund.stop(time + 0.68); oscHarm.stop(time + 0.68);
    }

    function triggerPlanetVoice(planet, time, stepIndex, panVal = 0, targetCtx = audioCtx, targetDest = null, targetDelay = delayNode, noiseBuf = sharedNoiseBuffer) {
      if (!targetCtx) return;
      const t = planet.type;
      const isAccent = planet.stepAccents ? planet.stepAccents[stepIndex % planet.stepAccents.length] : true;
      const velScale = isAccent ? 1.0 : 0.72;
      const headroom = 1 / Math.sqrt(Math.max(1, planets.length));
      const effectiveVol = planet.volume * velScale * headroom;

      const panIdx = planet.id % planetPanners.length;
      const panner = targetDest || planetPanners[panIdx];
      if (!targetDest) {
        const vMeta = VOICE_ENGINES.find(v => v.id === t);
        panner.pan.setValueAtTime(Math.max(-1, Math.min(1, panVal * (vMeta?.band === "low" ? 0.2 : 0.75))), time);
      }

      const midi = getStepMidiNote(planet, stepIndex);

      if (t === "powerStrum" || t === "chugStrum") {
        triggerPowerChordStrum(time, midi, effectiveVol, t === "chugStrum", panIdx, targetCtx, targetDest, targetDelay);
      } else if (t === "acousGtr" || t === "cleanChorus" || t === "elecGuitar") {
        triggerGuitarPluckNote(time, midi, effectiveVol, panIdx, t, targetCtx, targetDest, targetDelay);
      } else if (t === "grandPiano" || t === "tineKeys" || t === "warmKeys") {
        triggerGrandPianoNote(time, midi, effectiveVol, panIdx, t === "tineKeys", targetCtx, targetDest, targetDelay);
      } else if (t.startsWith("kick") || t === "taikoDrum") {
        const osc = targetCtx.createOscillator(), gain = targetCtx.createGain();
        osc.type = t === "kick808" ? "sine" : "triangle";
        osc.frequency.setValueAtTime(t === "kick808" ? 128 : 165, time);
        osc.frequency.exponentialRampToValueAtTime(42, time + 0.15);
        gain.gain.setValueAtTime(effectiveVol * 0.85, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 0.34);
        osc.connect(gain); gain.connect(panner);
        osc.start(time); osc.stop(time + 0.36);
      } else if (t.startsWith("snare") || t === "rim") {
        const dur = t === "rim" ? 0.09 : 0.19;
        const noise = targetCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const filter = targetCtx.createBiquadFilter();
        filter.type = t === "rim" ? "bandpass" : "highpass";
        filter.frequency.value = t === "rim" ? 1600 : 1050;
        const gain = targetCtx.createGain();
        gain.gain.setValueAtTime(effectiveVol * 0.52, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(panner);
        if (targetDelay) gain.connect(targetDelay);
        noise.start(time); noise.stop(time + dur + 0.01);
      } else if (t.startsWith("hat")) {
        const dur = t === "hatClosed" ? 0.045 : 0.18;
        const noise = targetCtx.createBufferSource();
        noise.buffer = noiseBuf;
        const filter = targetCtx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 6800;
        const gain = targetCtx.createGain();
        gain.gain.setValueAtTime(effectiveVol * 0.28, time);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + dur);
        noise.connect(filter); filter.connect(gain); gain.connect(panner);
        noise.start(time); noise.stop(time + dur + 0.01);
      } else {
        // Bowed Cello, Upright Bass, Electric Bass, Marimba, Kalimba, Celesta
        const freq = midiToFreq(midi);
        const osc1 = targetCtx.createOscillator(), osc2 = targetCtx.createOscillator();
        const filter = targetCtx.createBiquadFilter(), gain = targetCtx.createGain();

        const isBowed = (t === "celloStrings" || t === "rotaryOrgan");
        osc1.type = isBowed ? "sawtooth" : "triangle";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(freq, time);
        osc2.frequency.setValueAtTime(freq * 2.0, time);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(t.includes("Bass") ? 950 : 1850, time);
        filter.frequency.exponentialRampToValueAtTime(280, time + 0.35);

        const attack = isBowed ? 0.055 : 0.008;
        const decay = isBowed ? 0.58 : 0.38;
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(effectiveVol * 0.42, time + attack);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + decay);

        osc1.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(panner);
        if (targetDelay && !t.includes("Bass")) gain.connect(targetDelay);
        osc1.start(time); osc2.start(time);
        osc1.stop(time + decay + 0.04); osc2.stop(time + decay + 0.04);
      }
    }

    async function bounceOfflineWavMaster() {
      showToast("Rendering 4-Bar Studio Master...");
      const sampleRate = 44100;
      const sixteenthSec = (60 / bpm) / 4;
      const totalDuration = sixteenthSec * 64 + 0.8;
      const offline = new OfflineAudioContext(2, Math.ceil(sampleRate * totalDuration), sampleRate);

      const nBuf = offline.createBuffer(1, sampleRate, sampleRate);
      const nOut = nBuf.getChannelData(0);
      for (let i = 0; i < sampleRate; i++) nOut[i] = Math.random() * 2 - 1;

      const bus = offline.createGain();
      bus.gain.value = 0.65;
      const flt = offline.createBiquadFilter();
      flt.type = "lowpass";
      flt.frequency.value = filterCutoff;
      bus.connect(flt);
      flt.connect(offline.destination);

      for (let tick = 0; tick < 64; tick++) {
        const t = tick * sixteenthSec;
        planets.forEach(p => {
          const mult = speedScaleToMultiplier(p.speed);
          if (p.muted || mult <= 0) return;
          const sIdx = Math.floor(tick * mult) % p.steps;
          if (p.pattern[sIdx]) triggerPlanetVoice(p, t, sIdx, 0, offline, bus, null, nBuf);
        });
      }

      const rendered = await offline.startRendering();
      const L = rendered.getChannelData(0), R = rendered.getChannelData(1);
      const buf = new ArrayBuffer(44 + L.length * 4);
      const view = new DataView(buf);
      const ws = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
      ws(0,"RIFF"); view.setUint32(4,36+L.length*4,true); ws(8,"WAVE"); ws(12,"fmt ");
      view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,2,true);
      view.setUint32(24,sampleRate,true); view.setUint32(28,sampleRate*4,true);
      view.setUint16(32,4,true); view.setUint16(34,16,true); ws(36,"data"); view.setUint32(40,L.length*4,true);
      let off = 44;
      for (let i = 0; i < L.length; i++) {
        const sL = Math.max(-1, Math.min(1, L[i]));
        const sR = Math.max(-1, Math.min(1, R[i]));
        view.setInt16(off, sL < 0 ? sL * 0x8000 : sL * 0x7FFF, true);
        view.setInt16(off + 2, sR < 0 ? sR * 0x8000 : sR * 0x7FFF, true);
        off += 4;
      }
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
      a.download = `PLUVOX-Master-${bpm}BPM.wav`;
      a.click();
      showToast("Bounced 4-Bar .WAV Master!");
    }

    // Continuous Phase Accumulator Scheduler supporting smooth 0..100 Speed Slider
    function schedulerLoop() {
      const sixteenthDuration = (60 / bpm) / 4;
      while (nextTickTime < audioCtx.currentTime + 0.08) {
        const playTime = nextTickTime;
        const anySoloed = planets.some(pl => pl.soloed);
        const activeChordNotes = [];

        planets.forEach(p => {
          const mult = speedScaleToMultiplier(p.speed);
          if (mult <= 0) return;

          const prevStep = Math.floor(p.phaseAccum) % p.steps;
          p.phaseAccum += mult;
          const curStep = Math.floor(p.phaseAccum) % p.steps;

          if (curStep !== prevStep || mult >= 1) {
            const stepIdx = curStep;
            const isAudible = anySoloed ? p.soloed : !p.muted;
            const isHit = p.pattern[stepIdx] && isAudible;

            if (isHit) {
              const targetAngle = (stepIdx / p.steps) * Math.PI * 2 - Math.PI / 2;
              triggerPlanetVoice(p, playTime, stepIdx, Math.cos(targetAngle));
              p.pendingVisualHit = { time: playTime, stepIdx, angle: targetAngle };
              if (!p.type.startsWith("kick") && !p.type.startsWith("snare") && !p.type.startsWith("hat")) {
                activeChordNotes.push(getStepMidiNote(p, stepIdx));
              }
            } else {
              p.pendingVisualStep = { time: playTime, angle: (stepIdx / p.steps) * Math.PI * 2 - Math.PI / 2 };
            }
          }
        });

        if (activeChordNotes.length > 0) updateLiveHarmonyReadout(activeChordNotes);
        nextTickTime += sixteenthDuration;
        globalTick++;
      }
    }

    function autoCorrelate(buf, sampleRate) {
      let size = buf.length, rms = 0;
      for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / size);
      if (rms < 0.018) return { freq: -1, rms };
      let r1 = 0, r2 = size - 1, thres = 0.2;
      for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }
      buf = buf.slice(r1, r2); size = buf.length;
      const c = new Array(size).fill(0);
      for (let i = 0; i < size; i++) for (let j = 0; j < size - i; j++) c[i] += buf[j] * buf[j + i];
      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < size; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      return maxpos > 0 ? { freq: sampleRate / maxpos, rms } : { freq: -1, rms };
    }

    async function toggleHumToOrbit() {
      initAudioEngine();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      if (isHumCapturing) {
        isHumCapturing = false;
        if (openWidgets.vox) renderWidgetContent("vox");
        const steps = 8;
        const pat = humCapturedSteps.slice(0, steps);
        const notes = humCapturedNotes.slice(0, steps);
        const hits = pat.filter(Boolean).length;
        if (hits === 0) { showToast("No hum detected"); return; }

        const targetIdx = planets.length < 6 ? planets.length : 0;
        const orbit = createPlanetFromTemplate(targetIdx, { type: "grandPiano", steps, pulses: hits, pattern: pat, stepNotes: notes, volume: 0.68 });
        orbit.name = `${orbit.baseName} · HUM MELODY`;
        orbit.springVel = 6.5;
        if (planets.length < 6) planets.push(orbit);
        else planets[targetIdx] = orbit;
        selectPlanet(targetIdx, true);
        saveStudioState();
        showToast(`Captured ${hits}-note Hum Melody!`);
        return;
      }

      try {
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
          const src = audioCtx.createMediaStreamSource(micStream);
          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 2048;
          src.connect(analyserNode);
        }
        isHumCapturing = true;
        humCapturedSteps = new Array(16).fill(false);
        humCapturedNotes = new Array(16).fill(0);
        if (openWidgets.vox) renderWidgetContent("vox");
        showToast("Hum 'na-na-na' now!");
        if (!isPlaying) togglePlay();

        const timeData = new Float32Array(analyserNode.fftSize);
        const intervals = SCALES[scaleKey];
        const loop = () => {
          if (!isHumCapturing) return;
          analyserNode.getFloatTimeDomainData(timeData);
          const { freq, rms } = autoCorrelate(timeData, audioCtx.sampleRate);
          const slot = globalTick % 16;
          if (rms > 0.024 && freq > 75 && freq < 1600) {
            const qMidi = quantizeMidiToScale(freqToMidi(freq), scaleKey);
            const rel = ((qMidi % 12) + 12) % 12;
            let bestDeg = 0, minD = 99;
            intervals.forEach((iv, i) => { if (i < 8 && Math.abs((iv % 12) - rel) < minD) { minD = Math.abs((iv % 12) - rel); bestDeg = i; } });
            humCapturedSteps[slot] = true;
            humCapturedNotes[slot] = bestDeg;
            sunVel += 2.2;
          }
          requestAnimationFrame(loop);
        };
        loop();
      } catch (err) {
        alert("Mic access denied: " + err.message);
      }
    }

    function exportMultiTrackMidi() {
      const stepTicks = 120, events = [];
      planets.forEach((p, pIdx) => {
        if (p.muted) return;
        const ch = p.type.startsWith("kick") || p.type.startsWith("snare") || p.type === "rim" ? 9 : (pIdx % 8);
        for (let step = 0; step < 64; step++) {
          const sIdx = step % p.steps;
          if (!p.pattern[sIdx]) continue;
          const note = p.type.startsWith("kick") ? 36 : (p.type.startsWith("snare") ? 38 : getStepMidiNote(p, sIdx));
          events.push({ tick: step * stepTicks, data: [0x90 | ch, note, 100] });
          events.push({ tick: step * stepTicks + 110, data: [0x80 | ch, note, 0] });
        }
      });
      events.sort((a, b) => a.tick - b.tick);
      const trackBytes = [];
      let lastTick = 0;
      events.forEach(ev => {
        let d = ev.tick - lastTick; lastTick = ev.tick;
        const v = []; let buf = d & 0x7f;
        while ((d >>= 7)) { buf <<= 8; buf |= ((d & 0x7f) | 0x80); }
        while (true) { v.push(buf & 0xff); if (buf & 0x80) buf >>= 8; else break; }
        trackBytes.push(...v, ...ev.data);
      });
      trackBytes.push(0x00, 0xff, 0x2f, 0x00);
      const hdr = [0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,1,0xe0,0x4d,0x54,0x72,0x6b,(trackBytes.length>>24)&255,(trackBytes.length>>16)&255,(trackBytes.length>>8)&255,trackBytes.length&255];
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([new Uint8Array([...hdr, ...trackBytes])], { type: "audio/midi" }));
      a.download = `PLUVOX-${bpm}BPM.mid`;
      a.click();
      showToast("Exported .MID File!");
    }

    // =========================================================================
    // 8. CLEAN SINGLE-SYSTEM CANVAS RENDERER (ZERO undefinedNaN + HARMONY HUD)
    // =========================================================================
    const canvas = document.getElementById("cosmos");
    const ctx = canvas.getContext("2d", { alpha: false });
    const holdRing = document.getElementById("holdRing");

    let logicalW = window.innerWidth;
    let logicalH = window.innerHeight;

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
      logicalW = window.innerWidth;
      logicalH = window.innerHeight;
      canvas.width = Math.floor(logicalW * dpr);
      canvas.height = Math.floor(logicalH * dpr);

    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const stars = Array.from({ length: 110 }, () => ({ x: Math.random(), y: Math.random(), r: 0.7 + Math.random() * 1.1 }));
    const particles = Array.from({ length: 50 }, () => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, len: 12 + Math.random() * 18, size: 1.5 + Math.random() * 2.2, speed: 3 + Math.random() * 4.5, alpha: 0.16 + Math.random() * 0.28, wob: Math.random() * 6.28 }));
    const shockwaves = [];
    const waveData = new Uint8Array(64);
    let sunSpring = 0, sunVel = 0, lastFrame = performance.now();

    function updateResetViewPill() {
      const btn = document.getElementById("btnResetView");
      const moved = Math.abs(camZoom - 1.0) > 0.04 || Math.abs(camPanX) > 12 || Math.abs(camPanY) > 12;

    }

    document.getElementById("btnResetView").addEventListener("click", () => {

    function screenToWorld(sx, sy) {
      const cx = logicalW / 2, cy = logicalH / 2;
      return {
        x: (sx - cx - camPanX) / camZoom + cx,
        y: (sy - cy - camPanY) / camZoom + cy
      };
    }

    function getOrbitRadius(index) {
      const minDim = Math.min(logicalW, logicalH);
      const maxSpan = minDim * 0.39;
      const base = Math.max(66, minDim * 0.12);
      const spacing = Math.min(54, (maxSpan - base) / Math.max(1, Math.max(3, planets.length) - 1));
      return base + index * spacing;
    }

    function getPlanetPosition(p) {
      const cx = logicalW / 2, cy = logicalH / 2;
      const muteDrift = p.muted ? 14 : 0;
      const r = getOrbitRadius(p.id) + p.springOffset + muteDrift + Math.sin(p.floatPhase) * 2.0;
      return { x: cx + Math.cos(p.visualAngle) * r, y: cy + Math.sin(p.visualAngle) * r, orbitR: r };
    }

    function selectPlanet(id, autoOpenInspector = false) {
      selectedPlanetId = id;
      const p = getSelectedPlanet();

      } else {

      }
    }

    function renderCosmos(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      const w = logicalW, h = logicalH, cx = w / 2, cy = h / 2;
      const sixteenthSec = (60 / bpm) / 4;
      const u = UNIVERSES[activeUniverseKey];

      ctx.fillStyle = u.bgTrail;
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = `rgba(${u.streakColor}, 0.42)`;
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        ctx.fillRect(s.x * w, s.y * h, s.r, s.r);
      }

      const rainPct = rainLevel / 100;
      const activeP = Math.floor(particles.length * rainPct);
      for (let i = 0; i < activeP; i++) {
        const p = particles[i];
        p.wob += 0.03;
        if (u.particleMode === "rain" || u.particleMode === "neonrain") {
          p.x -= p.speed * 0.55; p.y += p.speed * 1.25;
          if (p.y > h + 20 || p.x < -20) { p.x = Math.random() * (w + 200); p.y = -20; }
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.len * 0.45, p.y - p.len);
          ctx.strokeStyle = `rgba(${u.streakColor}, ${p.alpha * rainPct})`; ctx.lineWidth = 1.2; ctx.stroke();
        } else {
          p.y -= p.speed * 0.3; p.x += Math.sin(p.wob) * 0.8;
          if (p.y < -20) { p.y = h + 20; p.x = Math.random() * w; }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${u.streakColor}, ${p.alpha * rainPct})`; ctx.fill();
        }
      }

      ctx.save();
      ctx.translate(cx + camPanX, cy + camPanY);
      ctx.scale(camZoom, camZoom);
      ctx.translate(-cx, -cy);

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.12;
        sw.alpha *= 0.9;
        if (sw.alpha < 0.03) { shockwaves.splice(i, 1); continue; }
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color; ctx.globalAlpha = sw.alpha; ctx.lineWidth = 1.6; ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Central Sun
      sunVel = (sunVel - sunSpring * 0.11) * 0.88;
      sunSpring += sunVel;
      const sunR = Math.max(16, 24 + sunSpring);
      const sunTint = isHumCapturing ? "#fb7185" : (isPlaying ? u.sunCore : "#94a3b8");

      ctx.beginPath(); ctx.arc(cx, cy, sunR * 2.1, 0, Math.PI * 2);
      ctx.fillStyle = sunTint; ctx.globalAlpha = 0.12; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, sunR * 1.35, 0, Math.PI * 2);
      ctx.globalAlpha = 0.28; ctx.fill();
      ctx.beginPath(); ctx.arc(cx, cy, sunR * 0.85, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff"; ctx.globalAlpha = 0.95; ctx.fill();
      ctx.globalAlpha = 1;

      // Live Music-Theory Harmony Readout beneath the Sun
      if (isPlaying) {
        ctx.font = "700 10px monospace";
        ctx.fillStyle = "rgba(248, 250, 252, 0.72)";
        ctx.textAlign = "center";
        ctx.fillText(liveHarmonyLabel, cx, cy + sunR + 22);
        ctx.textAlign = "left";
      }

      if (masterAnalyser && isPlaying) {
        masterAnalyser.getByteTimeDomainData(waveData);
        ctx.beginPath();
        for (let i = 0; i < waveData.length; i++) {
          const a = (i / waveData.length) * Math.PI * 2;
          const rW = sunR + 12 + ((waveData[i] - 128) / 128) * 14;
          const wx = cx + Math.cos(a) * rW, wy = cy + Math.sin(a) * rW;
          if (i === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
        }
        ctx.closePath(); ctx.strokeStyle = `rgba(${u.streakColor}, 0.5)`; ctx.lineWidth = 1.4; ctx.stroke();
      }

      const anySoloed = planets.some(pl => pl.soloed);
      const audioNow = audioCtx ? audioCtx.currentTime : 0;

      planets.forEach(p => {
        if (p.pendingVisualHit && audioNow >= p.pendingVisualHit.time) {
          const hit = p.pendingVisualHit;
          p.pendingVisualHit = null;
          p.visualAngle = hit.angle;
          p.pulseFlash = 1.0;
          p.nodeFlashes[hit.stepIdx] = 1.0;
          p.springVel += (p.type.startsWith("kick") ? 4.5 : 2.8);
          if (p.type.startsWith("kick")) sunVel += 5.0;
          const pos = getPlanetPosition(p);
          shockwaves.push({ x: pos.x, y: pos.y, r: p.planetRadius, maxR: 68, color: p.color, alpha: 0.78 });
        } else if (p.pendingVisualStep && audioNow >= p.pendingVisualStep.time) {
          p.visualAngle = p.pendingVisualStep.angle;
          p.pendingVisualStep = null;
        }

        p.springVel = (p.springVel - p.springOffset * 0.09) * 0.89;
        p.springOffset += p.springVel;
        p.floatPhase += dt * (1.2 + p.id * 0.25);
        p.pulseFlash *= 0.9;

        const mult = speedScaleToMultiplier(p.speed);
        if (isPlaying && mult > 0) {
          const orbitPeriodSec = (p.steps * sixteenthSec) / mult;
          p.visualAngle += ((Math.PI * 2) / orbitPeriodSec) * dt;
        } else if (!isPlaying) {
          p.visualAngle += 0.07 * dt * (p.id % 2 === 0 ? 1 : -1);
        }

        const muteDrift = p.muted ? 14 : 0;
        const orbitR = getOrbitRadius(p.id) + p.springOffset + muteDrift + Math.sin(p.floatPhase) * 2.0;
        const isSel = p.id === selectedPlanetId;
        const dimmed = anySoloed ? !p.soloed : p.muted;

        ctx.beginPath(); ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
        ctx.strokeStyle = p.locked ? "#38bdf8" : (isSel ? p.color : "rgba(148, 163, 184, 0.22)");
        ctx.globalAlpha = dimmed ? 0.16 : (isSel || p.locked ? 0.7 : 1);
        ctx.lineWidth = isSel || p.locked ? 1.8 : 1.0; ctx.stroke(); ctx.globalAlpha = 1;

        const nodes = [];
        for (let s = 0; s < p.steps; s++) {
          const sa = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = cx + Math.cos(sa) * orbitR, ny = cy + Math.sin(sa) * orbitR;
          const active = p.pattern[s];
          if (active) nodes.push({ x: nx, y: ny });

          if (p.nodeFlashes[s] > 0.04) {
            p.nodeFlashes[s] *= 0.87;
            ctx.beginPath();
            ctx.arc(nx, ny, 6 + (1 - p.nodeFlashes[s]) * 10, 0, Math.PI * 2);
            ctx.strokeStyle = p.color;
            ctx.globalAlpha = p.nodeFlashes[s];
            ctx.lineWidth = 1.4;
            ctx.stroke();
            ctx.globalAlpha = 1;
          }

          const hasCustomNote = p.stepMidi && p.stepMidi[s] !== null;
          ctx.beginPath();
          ctx.arc(nx, ny, active ? 5.2 : 2.8, 0, Math.PI * 2);
          ctx.globalAlpha = dimmed ? 0.25 : 1;
          ctx.fillStyle = active ? (hasCustomNote ? "#ffffff" : p.color) : "rgba(148, 163, 184, 0.45)";
          ctx.fill();
          if (active && hasCustomNote) {
            ctx.strokeStyle = p.color;
            ctx.lineWidth = 1.5;
            ctx.stroke();
          }

          // Safe Note Labels around selected orbit when Find-the-Note dock is open
          if (active && isSel && isNoteFinderOpen) {
            const labelMidi = getStepMidiNote(p, s);
            ctx.font = "700 9px monospace";
            ctx.fillStyle = "#f8fafc";
            ctx.fillText(midiToName(labelMidi), nx + 8, ny + 3);
          }

          ctx.globalAlpha = 1;
        }

        if (nodes.length > 1) {
          ctx.beginPath();
          nodes.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
          ctx.closePath(); ctx.strokeStyle = p.color;
          ctx.globalAlpha = dimmed ? 0.08 : (0.24 + p.pulseFlash * 0.35);
          ctx.lineWidth = 1.2; ctx.stroke(); ctx.globalAlpha = 1;
        }

        const px = cx + Math.cos(p.visualAngle) * orbitR;
        const py = cy + Math.sin(p.visualAngle) * orbitR;
        const pRad = p.planetRadius + p.pulseFlash * 4.0;

        ctx.beginPath(); ctx.arc(px, py, pRad * 1.55, 0, Math.PI * 2);
        ctx.fillStyle = p.color; ctx.globalAlpha = dimmed ? 0.08 : 0.18; ctx.fill();

        ctx.beginPath(); ctx.arc(px, py, pRad * 0.85, 0, Math.PI * 2);
        ctx.globalAlpha = dimmed ? 0.32 : 0.95; ctx.fill();

        ctx.beginPath(); ctx.arc(px, py, pRad * 0.38, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff"; ctx.globalAlpha = dimmed ? 0.28 : 0.95; ctx.fill();
        ctx.globalAlpha = 1;

        if (isSel || p.locked) {
          ctx.beginPath(); ctx.arc(px, py, pRad + 4.5, 0, Math.PI * 2);
          ctx.strokeStyle = p.locked ? "#38bdf8" : "#ffffff"; ctx.lineWidth = 1.5; ctx.stroke();
        }
      });

      ctx.restore();
      requestAnimationFrame(renderCosmos);
    }

    // =========================================================================
    // 9. TOUCH GESTURES: PINCH-ZOOM, FLICK-TO-MUTE & LONG-PRESS RADIAL WHEEL
    // =========================================================================
    let longPressTimer = null, pressStartPos = null, draggingOrb = null;
    let flickCandidate = null, lastTapTime = 0;
    const activePointers = new Map();
    let initialPinchDist = 0, initialPinchZoom = 1;

    canvas.addEventListener("wheel", e => {
      e.preventDefault();
      camZoom = Math.max(0.65, Math.min(2.2, camZoom - e.deltaY * 0.001));
      updateResetViewPill();
    }, { passive: false });

    canvas.addEventListener("pointerdown", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
      activePointers.set(e.pointerId, { x: sx, y: sy });

      if (activePointers.size === 2) {
        clearTimeout(longPressTimer);
        holdRing.classList.remove("charging");
        const pts = Array.from(activePointers.values());
        initialPinchDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
        initialPinchZoom = camZoom;
        return;
      }

      const wPos = screenToWorld(sx, sy);
      const cx = logicalW / 2, cy = logicalH / 2;
      pressStartPos = { x: sx, y: sy };

      if (Math.hypot(wPos.x - cx, wPos.y - cy) <= 40) {
        togglePlay();
        return;
      }

      // 1. Tap Planet Body -> Auto-Popup Orbit Inspector
      for (const p of planets) {
        const pos = getPlanetPosition(p);
        if (Math.hypot(wPos.x - pos.x, wPos.y - pos.y) <= p.planetRadius + 15) {
          selectPlanet(p.id, true);
          flickCandidate = { planet: p, startX: wPos.x, startY: wPos.y };
          return;
        }
      }

      // 2. Tap or Double-Tap Step Node (Double-tap toggles dynamic accent)
      for (const p of planets) {
        const muteDrift = p.muted ? 14 : 0;
        const orbitR = getOrbitRadius(p.id) + p.springOffset + muteDrift + Math.sin(p.floatPhase) * 2.0;
        for (let s = 0; s < p.steps; s++) {
          const sa = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = cx + Math.cos(sa) * orbitR, ny = cy + Math.sin(sa) * orbitR;
          if (Math.hypot(wPos.x - nx, wPos.y - ny) <= 15) {
            selectPlanet(p.id, true);
            const nowMs = performance.now();
            if (p.pattern[s] && nowMs - lastTapTime < 280) {
              p.stepAccents[s] = !p.stepAccents[s];
              showToast(`Step ${s + 1}: ${p.stepAccents[s] ? "Accent (Loud)" : "Ghost Note (Soft)"}`);
              lastTapTime = 0;
              return;
            }
            lastTapTime = nowMs;

            if (p.pattern[s]) {
              draggingOrb = { planetId: p.id, originStep: s, hoverStep: s, moved: false };
            } else {
              p.pattern[s] = true;
              p.pulses = p.pattern.filter(Boolean).length;
              refreshAllOpenWidgets();
              saveStudioState();
              shockwaves.push({ x: nx, y: ny, r: 4, maxR: 32, color: p.color, alpha: 0.85 });
            }
            return;
          }
        }
      }

      // 3. Tap Orbit Ring Line -> Easy Orbit Selection
      const dist = Math.hypot(wPos.x - cx, wPos.y - cy);
      for (const p of planets) {
        const muteDrift = p.muted ? 14 : 0;
        const orbitR = getOrbitRadius(p.id) + p.springOffset + muteDrift + Math.sin(p.floatPhase) * 2.0;
        if (Math.abs(dist - orbitR) <= 12) {
          selectPlanet(p.id, true);
          return;
        }
      }

      // 4. Long-Press Open Space -> GTA Radial Weapon Wheel
      holdRing.style.left = `${sx}px`;
      holdRing.style.top = `${sy}px`;
      holdRing.classList.add("charging");
      longPressTimer = setTimeout(() => {
        holdRing.classList.remove("charging");
        openGtaWeaponWheel(sx, sy);
      }, 360);
    });

    canvas.addEventListener("pointermove", e => {
      const rect = canvas.getBoundingClientRect();
      const sx = e.clientX - rect.left, sy = e.clientY - rect.top;

      if (activePointers.has(e.pointerId)) {
        const prev = activePointers.get(e.pointerId);
        if (activePointers.size === 2) {
          const pts = Array.from(activePointers.values());
          const curDist = Math.hypot(pts[1].x - pts[0].x, pts[1].y - pts[0].y);
          if (initialPinchDist > 10) {
            camZoom = Math.max(0.65, Math.min(2.2, initialPinchZoom * (curDist / initialPinchDist)));
          }
          camPanX += (sx - prev.x) * 0.5;
          camPanY += (sy - prev.y) * 0.5;
          updateResetViewPill();
          activePointers.set(e.pointerId, { x: sx, y: sy });
          return;
        }
        activePointers.set(e.pointerId, { x: sx, y: sy });
      }

      const wPos = screenToWorld(sx, sy);

      if (pressStartPos && Math.hypot(sx - pressStartPos.x, sy - pressStartPos.y) > 12) {
        clearTimeout(longPressTimer);
        holdRing.classList.remove("charging");
      }

      if (flickCandidate) {
        const dist = Math.hypot(wPos.x - flickCandidate.startX, wPos.y - flickCandidate.startY);
        if (dist > 38) {
          flickCandidate.planet.muted = !flickCandidate.planet.muted;
          flickCandidate.planet.springVel += 4.5;
          refreshAllOpenWidgets();
          saveStudioState();
          showToast(`${flickCandidate.planet.baseName}: ${flickCandidate.planet.muted ? "MUTED" : "ACTIVE"}`);
          flickCandidate = null;
        }
        return;
      }

      if (draggingOrb) {
        draggingOrb.moved = true;
        const cx = logicalW / 2, cy = logicalH / 2;
        const p = planets[draggingOrb.planetId];
        let a = Math.atan2(wPos.y - cy, wPos.x - cx) + Math.PI / 2;
        if (a < 0) a += Math.PI * 2;
        draggingOrb.hoverStep = Math.round((a / (Math.PI * 2)) * p.steps) % p.steps;
      }
    });

    window.addEventListener("pointerup", e => {
      activePointers.delete(e.pointerId);
      clearTimeout(longPressTimer);
      holdRing.classList.remove("charging");
      pressStartPos = null;
      flickCandidate = null;

      if (draggingOrb) {
        const p = planets[draggingOrb.planetId];
        if (!draggingOrb.moved || draggingOrb.hoverStep === draggingOrb.originStep) {
          p.pattern[draggingOrb.originStep] = false;
          if (p.stepMidi) p.stepMidi[draggingOrb.originStep] = null;
        } else {
          p.pattern[draggingOrb.originStep] = false;
          p.pattern[draggingOrb.hoverStep] = true;
          if (p.stepMidi) {
            p.stepMidi[draggingOrb.hoverStep] = p.stepMidi[draggingOrb.originStep];
            p.stepMidi[draggingOrb.originStep] = null;
          }
          p.springVel += 2.8;
        }
        p.pulses = p.pattern.filter(Boolean).length;
        refreshAllOpenWidgets();
        saveStudioState();
        draggingOrb = null;
      }
    });

    document.getElementById("btnPlay").addEventListener("click", togglePlay);
    window.addEventListener("keydown", e => {
      if (document.activeElement.tagName === "INPUT") return;
      if (e.code === "Space") { e.preventDefault(); togglePlay(); }
      else if (e.code === "ArrowRight" || e.code === "ArrowUp") selectPlanet((selectedPlanetId + 1) % planets.length, false);
      else if (e.code === "ArrowLeft" || e.code === "ArrowDown") selectPlanet((selectedPlanetId - 1 + planets.length) % planets.length, false);
    });

    // Boot
    solarScenes[0] = captureCurrentSnapshot("DECK 01");
    loadStudioState();
    updateTopLabel();
    requestAnimationFrame(renderCosmos);
  </script>
</body>
</html>
