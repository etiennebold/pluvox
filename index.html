<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLUVOX" />
  <meta name="theme-color" content="#03050a" />
  <link id="appleTouchIcon" rel="apple-touch-icon" />
  <link id="faviconIcon" rel="icon" type="image/png" />
  <link id="pwaManifest" rel="manifest" />
  <title>PLUVOX — Minimalist Spatial Groovebox & Orbital Studio</title>
  <style>
    :root {
      --void: #03050a;
      --glass: rgba(10, 15, 28, 0.78);
      --glass-strong: rgba(11, 17, 32, 0.94);
      --border: rgba(255, 255, 255, 0.14);
      --border-hi: rgba(56, 189, 248, 0.48);
      --text: #f8fafc;
      --dim: #94a3b8;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --rose: #fb7185;
      --violet: #c084fc;
      --emerald: #10b981;
      --mono: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
      --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--text);
      font-family: var(--sans);
      user-select: none;
      touch-action: none;
    }

    canvas#cosmos {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: grab;
    }

    canvas#cosmos:active { cursor: grabbing; }

    /* MINIMALIST TOP HEADER */
    .top-bar {
      position: fixed;
      top: max(16px, env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      z-index: 15;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .top-cluster {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      pointer-events: auto;
    }

    .brand {
      font-family: var(--mono);
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      background: linear-gradient(90deg, #ffffff 30%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .biome-tag {
      font-family: var(--mono);
      font-size: 0.62rem;
      color: var(--dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .glass-pill {
      background: var(--glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.42rem 0.88rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .glass-pill:hover { border-color: rgba(255, 255, 255, 0.36); transform: translateY(-1px); }
    .glass-pill:active { transform: scale(0.95); }

    .glass-pill.playing {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--emerald);
      color: #a7f3d0;
      box-shadow: 0 0 22px rgba(16, 185, 129, 0.28);
    }

    .glass-pill.hum-active {
      background: rgba(244, 63, 94, 0.26);
      border-color: var(--rose);
      color: #ffe4e6;
      animation: pulseGlow 1s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.62; }
    }

    /* BOTTOM MINIMALIST PINNED DOCK + WEAPON WHEEL TRIGGER */
    .bottom-dock {
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 16px;
      right: 16px;
      z-index: 15;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
      pointer-events: none;
    }

    .bottom-dock > * { pointer-events: auto; }

    .wheel-hub-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--glass-strong);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-hi);
      color: var(--cyan);
      font-size: 1.15rem;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6), 0 0 18px rgba(56, 189, 248, 0.22);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .wheel-hub-btn:hover { transform: scale(1.08) rotate(45deg); }
    .wheel-hub-btn:active { transform: scale(0.94); }

    /* RADIAL WEAPON-WHEEL OVERLAY */
    .wheel-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(2, 4, 10, 0.48);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .wheel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .weapon-wheel {
      position: fixed;
      width: 300px;
      height: 300px;
      margin-left: -150px;
      margin-top: -150px;
      border-radius: 50%;
      z-index: 45;
      pointer-events: none;
      transform: scale(0.75);
      opacity: 0;
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease;
    }

    .wheel-backdrop.open .weapon-wheel {
      transform: scale(1);
      opacity: 1;
      pointer-events: auto;
    }

    .wheel-ring-bg {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(11, 17, 32, 0.45) 26%, rgba(11, 17, 32, 0.92) 72%);
      border: 1px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(56, 189, 248, 0.12);
    }

    .wheel-center-core {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 74px;
      height: 74px;
      border-radius: 50%;
      background: var(--glass-strong);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 0.56rem;
      color: var(--dim);
      text-align: center;
      cursor: pointer;
    }

    .wheel-node {
      position: absolute;
      width: 78px;
      height: 62px;
      margin-left: -39px;
      margin-top: -31px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      transition: all 0.14s ease;
    }

    .wheel-node:hover, .wheel-node.hovered {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--cyan);
      transform: scale(1.1);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
    }

    .wheel-node-icon { font-size: 1.15rem; }
    .wheel-node-label {
      font-family: var(--mono);
      font-size: 0.56rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.03em;
    }

    .wheel-pin-btn {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--dim);
      font-size: 0.58rem;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .wheel-pin-btn.pinned {
      background: var(--cyan);
      color: #03050a;
      border-color: var(--cyan);
    }

    /* SINGLE FOCUSED FLOATING SHEET (OPENS ONLY WHEN SELECTED) */
    .studio-sheet {
      position: fixed;
      left: 50%;
      bottom: 76px;
      transform: translateX(-50%) translateY(16px);
      width: min(440px, 92vw);
      max-height: 62vh;
      overflow-y: auto;
      background: var(--glass-strong);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 1.05rem 1.15rem;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.78);
      transition: opacity 0.2s ease, transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .studio-sheet.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      font-family: var(--mono);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--cyan);
    }

    .sheet-close {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--dim);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .sheet-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      margin-bottom: 0.65rem;
      font-family: var(--mono);
      font-size: 0.68rem;
      color: var(--dim);
    }

    .sheet-grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.36rem;
    }

    .sheet-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.42rem;
    }

    .chip-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.48rem 0.35rem;
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
      text-align: center;
      transition: all 0.12s ease;
    }

    .chip-btn:hover { border-color: var(--cyan); background: rgba(56, 189, 248, 0.14); }
    .chip-btn.active { border-color: var(--emerald); background: rgba(16, 185, 129, 0.22); color: #a7f3d0; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      height: 4px;
      border-radius: 999px;
      outline: none;
      flex: 1;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    select.sheet-select {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.38rem 0.6rem;
      color: var(--text);
      font-family: var(--mono);
      font-size: 0.66rem;
      font-weight: 700;
      outline: none;
    }

    select.sheet-select option { background: #0b1120; }

    /* LONG-PRESS RIPPLE RING */
    .hold-ring {
      position: fixed;
      width: 68px;
      height: 68px;
      margin-left: -34px;
      margin-top: -34px;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      pointer-events: none;
      z-index: 38;
      opacity: 0;
      transform: scale(0.4);
      transition: transform 0.4s linear, opacity 0.15s ease;
    }

    .hold-ring.charging {
      opacity: 0.9;
      transform: scale(1.15);
    }

    .toast-pill {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 55;
      background: rgba(16, 185, 129, 0.24);
      border: 1px solid var(--emerald);
      color: #a7f3d0;
      font-family: var(--mono);
      font-size: 0.66rem;
      padding: 0.34rem 0.85rem;
      border-radius: 999px;
      backdrop-filter: blur(12px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }

    .toast-pill.show { opacity: 1; }
  </style>
</head>

  <script>
    // =========================================================================
    // 1. NATIVE iOS & ANDROID APP LOGO GENERATOR + PWA MANIFEST
    // =========================================================================
    function generateAppIconDataUrl(size = 512) {
      const c = document.createElement("canvas");
      c.width = size;
      c.height = size;
      const g = c.getContext("2d");

      // Deep-space obsidian rounded backdrop
      const bgGrad = g.createRadialGradient(size * 0.5, size * 0.45, size * 0.05, size * 0.5, size * 0.5, size * 0.72);
      bgGrad.addColorStop(0, "#0f172a");
      bgGrad.addColorStop(0.6, "#050814");
      bgGrad.addColorStop(1, "#020308");
      g.fillStyle = bgGrad;
      g.fillRect(0, 0, size, size);

      const cx = size * 0.5;
      const cy = size * 0.5;

      // 3 Concentric Orbital Rings
      const rings = [
        { r: size * 0.36, color: "rgba(56, 189, 248, 0.38)", w: size * 0.008, angle: -0.6, orbColor: "#38bdf8", orbR: size * 0.026 },
        { r: size * 0.26, color: "rgba(192, 132, 252, 0.45)", w: size * 0.009, angle: 1.9, orbColor: "#c084fc", orbR: size * 0.022 },
        { r: size * 0.16, color: "rgba(245, 158, 11, 0.52)", w: size * 0.01, angle: 0.7, orbColor: "#f59e0b", orbR: size * 0.02 }
      ];

      rings.forEach(ring => {
        g.beginPath();
        g.arc(cx, cy, ring.r, 0, Math.PI * 2);
        g.strokeStyle = ring.color;
        g.lineWidth = ring.w;
        g.stroke();

        const ox = cx + Math.cos(ring.angle) * ring.r;
        const oy = cy + Math.sin(ring.angle) * ring.r;
        g.beginPath();
        g.arc(ox, oy, ring.orbR, 0, Math.PI * 2);
        g.fillStyle = ring.orbColor;
        g.shadowColor = ring.orbColor;
        g.shadowBlur = size * 0.04;
        g.fill();
        g.shadowBlur = 0;
      });

      // Central Glowing Pulsar Sun Core
      const sunGrad = g.createRadialGradient(cx, cy, size * 0.01, cx, cy, size * 0.11);
      sunGrad.addColorStop(0, "#ffffff");
      sunGrad.addColorStop(0.45, "#38bdf8");
      sunGrad.addColorStop(1, "rgba(56, 189, 248, 0)");
      g.beginPath();
      g.arc(cx, cy, size * 0.11, 0, Math.PI * 2);
      g.fillStyle = sunGrad;
      g.fill();

      return c.toDataURL("image/png");
    }

    function injectNativeMobileIcons() {
      const icon512 = generateAppIconDataUrl(512);
      const icon180 = generateAppIconDataUrl(180);
      document.getElementById("appleTouchIcon").href = icon180;
      document.getElementById("faviconIcon").href = icon180;

        name: "PLUVOX Orbital Studio",
        short_name: "PLUVOX",
        start_url: ".",
        display: "standalone",
        background_color: "#03050a",
        theme_color: "#03050a",
        icons: [
          { src: icon180, sizes: "180x180", type: "image/png" },
          { src: icon512, sizes: "512x512", type: "image/png", purpose: "any maskable" }
        ]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: "application/manifest+json" });
      document.getElementById("pwaManifest").href = URL.createObjectURL(blob);
    }

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
    function freqToMidi(freq) { return Math.round(69 + 12 * Math.log2(freq / 440)); }
    function midiToName(midi) { return `${NOTE_NAMES[midi % 12]}${Math.floor(midi / 12) - 1}`; }

    function quantizeMidiToScale(rawMidi, scaleKey) {
      const intervals = SCALES[scaleKey] || SCALES.minorPentatonic;
      const baseC = 48;
      let bestMidi = rawMidi;
      let minDiff = Infinity;
      for (let oct = -1; oct <= 3; oct++) {
        for (const interval of intervals) {
          const candidate = baseC + oct * 12 + interval;
          const diff = Math.abs(rawMidi - candidate);
          if (diff < minDiff) { minDiff = diff; bestMidi = candidate; }
        }
      }
      return bestMidi;
    }

    function generateEuclidean(steps, pulses) {
      pulses = Math.max(0, Math.min(steps, pulses));
      const pattern = new Array(steps).fill(false);
      if (pulses === 0) return pattern;
      let bucket = 0;
      for (let i = 0; i < steps; i++) {
        bucket += pulses;
        if (bucket >= steps) { bucket -= steps; pattern[i] = true; }
      }
      return pattern;
    }

      return {

    function updateTopLabel() {
      document.getElementById("topBiomeLabel").textContent = `${activeBiomeKey.toUpperCase()} · ${bpm} BPM`;
    }

    // =========================================================================
    // 5. WEB AUDIO API DSP ENGINE
    // =========================================================================
    let audioCtx = null;
    let masterFilter = null;
    let masterAnalyser = null;
    let tapeSaturator = null;
    let compressorNode = null;
    let delayNode = null;
    let delayWet = null;
    let rainBandFilter = null;
    let rainGain = null;
    let vinylGain = null;
    let focusCarrierOsc = null;
    let focusLfoOsc = null;
    let focusMasterGain = null;

    let wavProcessor = null;
    let isRecordingWav = false;
    let wavLeftChunks = [];
    let wavRightChunks = [];

    let isPlaying = false;
    let schedulerTimer = null;
    let nextTickTime = 0;
    let globalTick = 0;
    let currentChordIndex = 0;

    let micStream = null;
    let analyserNode = null;
    let isHumCapturing = false;
    let humCapturedSteps = new Array(16).fill(false);
    let humCapturedNotes = new Array(16).fill(0);

    function makeTapeSaturationCurve(amount) {
      const k = amount * 1.4;
      const nSamples = 44100;
      const curve = new Float32Array(nSamples);
      const deg = Math.PI / 180;
      for (let i = 0; i < nSamples; i++) {
        const x = (i * 2) / nSamples - 1;
        curve[i] = k === 0 ? x : ((3 + k) * x * 20 * deg) / (Math.PI + k * Math.abs(x));
      }
      return curve;
    }

    function updateTapeDrive(pct) {
      if (tapeSaturator) tapeSaturator.curve = makeTapeSaturationCurve(Number(pct));
    }

    function initAudioEngine() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      compressorNode = audioCtx.createDynamicsCompressor();
      compressorNode.threshold.value = -14;
      compressorNode.ratio.value = 3.5;

      tapeSaturator = audioCtx.createWaveShaper();
      tapeSaturator.oversample = "2x";
      updateTapeDrive(driveLevel);

      masterFilter = audioCtx.createBiquadFilter();
      masterFilter.type = "lowpass";
      masterFilter.frequency.value = filterCutoff;

      masterAnalyser = audioCtx.createAnalyser();
      masterAnalyser.fftSize = 128;

      delayNode = audioCtx.createDelay(2.0);
      delayNode.delayTime.value = 0.35;
      const fb = audioCtx.createGain();
      fb.gain.value = 0.4;
      delayWet = audioCtx.createGain();
      delayWet.gain.value = delayAmount / 100;

      delayNode.connect(fb);
      fb.connect(delayNode);
      delayNode.connect(delayWet);
      delayWet.connect(tapeSaturator);

      tapeSaturator.connect(masterFilter);
      masterFilter.connect(compressorNode);
      compressorNode.connect(masterAnalyser);
      masterAnalyser.connect(audioCtx.destination);

      wavProcessor = audioCtx.createScriptProcessor(4096, 2, 2);
      wavProcessor.onaudioprocess = e => {
        if (!isRecordingWav) return;
        wavLeftChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
        wavRightChunks.push(new Float32Array(e.inputBuffer.getChannelData(1)));
      };
      compressorNode.connect(wavProcessor);
      wavProcessor.connect(audioCtx.destination);

      focusCarrierOsc = audioCtx.createOscillator();
      focusCarrierOsc.frequency.value = 174;
      const modGain = audioCtx.createGain();
      modGain.gain.value = 0.5;
      focusLfoOsc = audioCtx.createOscillator();
      focusLfoOsc.frequency.value = focusHz || 12.5;
      const depth = audioCtx.createGain();
      depth.gain.value = 0.45;
      focusMasterGain = audioCtx.createGain();
      focusMasterGain.gain.value = 0.0001;

      focusLfoOsc.connect(depth);
      depth.connect(modGain.gain);
      focusCarrierOsc.connect(modGain);
      modGain.connect(focusMasterGain);
      focusMasterGain.connect(compressorNode);
      focusCarrierOsc.start();
      focusLfoOsc.start();
      updateBrainwaveCarrier();

      const bufferSize = audioCtx.sampleRate * 3;
      const rainBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const rd = rainBuf.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + w * 0.0555179;
        b1 = 0.99332 * b1 + w * 0.0750759;
        b2 = 0.96900 * b2 + w * 0.1538520;
        b3 = 0.86650 * b3 + w * 0.3104856;
        b4 = 0.55000 * b4 + w * 0.5329522;
        b5 = -0.7616 * b5 - w * 0.0168980;
        rd[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.042;
        b6 = w * 0.115926;
      }
      const rainSrc = audioCtx.createBufferSource();
      rainSrc.buffer = rainBuf;
      rainSrc.loop = true;
      rainBandFilter = audioCtx.createBiquadFilter();
      rainBandFilter.type = "bandpass";
      rainBandFilter.frequency.value = BIOMES[activeBiomeKey].rainFreq;
      rainGain = audioCtx.createGain();
      rainGain.gain.value = (rainLevel / 100) * 0.55;
      rainSrc.connect(rainBandFilter);
      rainBandFilter.connect(rainGain);
      rainGain.connect(compressorNode);
      rainSrc.start();

      const vinylBuf = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const vd = vinylBuf.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        vd[i] = Math.random() > 0.9978 ? (Math.random() * 2 - 1) * 0.48 : (Math.random() * 2 - 1) * 0.005;
      }
      const vinylSrc = audioCtx.createBufferSource();
      vinylSrc.buffer = vinylBuf;
      vinylSrc.loop = true;
      const vh = audioCtx.createBiquadFilter();
      vh.type = "highpass";
      vh.frequency.value = 1850;
      vinylGain = audioCtx.createGain();
      vinylGain.gain.value = (vinylLevel / 100) * 0.65;
      vinylSrc.connect(vh);
      vh.connect(vinylGain);
      vinylGain.connect(compressorNode);
      vinylSrc.start();
    }

    function updateBrainwaveCarrier() {
      if (!audioCtx || !focusMasterGain) return;
      if (focusHz <= 0) {
        focusMasterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.12);
      } else {
        focusLfoOsc.frequency.setTargetAtTime(focusHz, audioCtx.currentTime, 0.08);
        focusMasterGain.gain.setTargetAtTime(0.032, audioCtx.currentTime, 0.12);
      }
    }

    function setBiome(key, silent = false) {
      if (!BIOMES[key]) return;
      activeBiomeKey = key;
      const b = BIOMES[key];
      filterCutoff = b.filterDefault;
      driveLevel = b.driveDefault;
      if (rainBandFilter && audioCtx) rainBandFilter.frequency.setTargetAtTime(b.rainFreq, audioCtx.currentTime, 0.12);
      if (masterFilter && audioCtx) masterFilter.frequency.setTargetAtTime(filterCutoff, audioCtx.currentTime, 0.12);
      updateTapeDrive(driveLevel);
      updateTopLabel();
      if (!silent) showToast(`Environment: ${b.label}`);
    }

    function createNoiseBuffer(dur) {
      const len = Math.floor(audioCtx.sampleRate * dur);
      const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const out = buf.getChannelData(0);
      for (let i = 0; i < len; i++) out[i] = Math.random() * 2 - 1;
      return buf;
    }

    function triggerChordPad(time, durationSec) {
      if (!audioCtx) return;
      const chords = CHORD_PROGRESSIONS[chordProgKey];
      if (!chords || chords.length === 0) return;
      const notes = chords[currentChordIndex % chords.length];
      currentChordIndex++;

      notes.forEach((midi, idx) => {
        const freq = midiToFreq(midi);
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();
        osc1.type = activeBiomeKey === "rock" ? "sawtooth" : "triangle";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(freq, time);
        osc2.frequency.setValueAtTime(freq * 1.003, time);
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(activeBiomeKey === "rock" ? 1350 : 950, time);

        const peak = 0.06 / Math.sqrt(notes.length);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(peak, time + 0.35);
        gain.gain.setValueAtTime(peak * 0.85, time + durationSec - 0.4);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(tapeSaturator);
        if (idx === 0) gain.connect(delayNode);
        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + durationSec + 0.05);
        osc2.stop(time + durationSec + 0.05);
      });
    }

    function triggerPlanetVoice(planet, time, stepIndex, panVal = 0) {
      if (!audioCtx) return;
      const intervals = SCALES[scaleKey] || SCALES.minorPentatonic;
      const t = planet.type;

      let layerGain = 1.0;
      if (planet.layer === "rock" && hybridXfade > 0) layerGain = Math.max(0.08, 1 - hybridXfade / 105);
      if (planet.layer === "synth" && hybridXfade < 0) layerGain = Math.max(0.08, 1 + hybridXfade / 105);
      const effectiveVol = planet.volume * layerGain;

      const panner = audioCtx.createStereoPanner();
      const vMeta = VOICE_ENGINES.find(v => v.id === t);
      panner.pan.setValueAtTime(Math.max(-1, Math.min(1, panVal * (vMeta?.band === "low" ? 0.22 : 0.85))), time);
      panner.connect(tapeSaturator);

      const stepDegree = planet.stepNotes[stepIndex % planet.stepNotes.length] || 0;
      const noteIdx = (stepDegree + planet.pitchOffset) % intervals.length;

      if (t.startsWith("kick") || t === "taikoDrum") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = t === "kick808" ? "sine" : "triangle";
        osc.frequency.setValueAtTime(t === "kick808" ? 135 : 176, time);
        osc.frequency.exponentialRampToValueAtTime(38, time + 0.16);
        gain.gain.setValueAtTime(effectiveVol, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.38);
        osc.connect(gain);
        gain.connect(panner);
        osc.start(time);
        osc.stop(time + 0.4);
      } else if (t.startsWith("snare") || t === "rim") {
        const dur = t === "rim" ? 0.11 : 0.22;
        const noise = audioCtx.createBufferSource();
        noise.buffer = createNoiseBuffer(dur);
        const filter = audioCtx.createBiquadFilter();
        filter.type = t === "rim" ? "bandpass" : "highpass";
        filter.frequency.value = t === "rim" ? 1550 : 950;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(effectiveVol * 0.62, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        gain.connect(delayNode);
        noise.start(time);
      } else if (t === "djScratch") {
        const dur = 0.22;
        const noise = audioCtx.createBufferSource();
        noise.buffer = createNoiseBuffer(dur);
        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.Q.value = 6.5;
        filter.frequency.setValueAtTime(650 + stepDegree * 80, time);
        filter.frequency.exponentialRampToValueAtTime(3400, time + 0.08);
        filter.frequency.exponentialRampToValueAtTime(520, time + dur);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(effectiveVol * 0.68, time + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        gain.connect(delayNode);
        noise.start(time);
      } else if (t.startsWith("hat") || t === "crashCym") {
        const dur = t === "hatClosed" ? 0.055 : (t === "hatOpen" ? 0.22 : 0.52);
        const noise = audioCtx.createBufferSource();
        noise.buffer = createNoiseBuffer(dur);
        const filter = audioCtx.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.value = 6200;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(effectiveVol * 0.36, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + dur);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        noise.start(time);
      } else {
        const octaveBase = (t.includes("Bass") || t === "nuMetalGtr" || t === "palmMuteGtr") ? 36 : 52;
        const freq = midiToFreq(octaveBase + intervals[noteIdx]);
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc1.type = (t === "nuMetalGtr" || t === "elecGuitar" || t === "screamerLead" || t === "saxLead") ? "sawtooth" : "triangle";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(freq, time);
        osc2.frequency.setValueAtTime(freq * (t === "nuMetalGtr" ? 1.498 : 2.0), time);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(t === "nuMetalGtr" ? 2600 : 1750, time);
        filter.frequency.exponentialRampToValueAtTime(320, time + 0.32);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(effectiveVol * 0.44, time + 0.012);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.42);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(panner);
        gain.connect(delayNode);
        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + 0.45);
        osc2.stop(time + 0.45);
      }
    }

    // =========================================================================
    // 6. SCHEDULER + HUM-TO-ORBIT + JAM PARTNER + RETRO CAPTURE
    // =========================================================================
    function schedulerLoop() {
      const sixteenthDuration = (60 / bpm) / 4;

      while (nextTickTime < audioCtx.currentTime + 0.1) {
        if (isChainActive && globalTick > 0 && globalTick % 16 === 0 && queuedSceneIdx === null) {
          chainBarCounter++;
          const targetBars = solarScenes[activeSceneIdx]?.bars || 4;
          if (chainBarCounter >= targetBars) {
            chainBarCounter = 0;
            const populated = solarScenes.map((s, i) => (s ? i : -1)).filter(i => i !== -1);
            if (populated.length > 1) queuedSceneIdx = populated[(populated.indexOf(activeSceneIdx) + 1) % populated.length];
          }
        }

        if (queuedSceneIdx !== null && globalTick % 8 === 0) {
          const nextIdx = queuedSceneIdx;
          queuedSceneIdx = null;
          activeSceneIdx = nextIdx;
          chainBarCounter = 0;
          const delayMs = Math.max(0, (nextTickTime - audioCtx.currentTime) * 1000);
          setTimeout(() => applySnapshot(solarScenes[nextIdx], true), delayMs);
        }

        const swingOffset = (globalTick % 2 === 1) ? sixteenthDuration * 0.14 : 0;
        const playTime = nextTickTime + swingOffset;

        if (globalTick % 16 === 0) triggerChordPad(playTime, sixteenthDuration * 15.5);

        const barTick64 = globalTick % 64;
        const isFillWindow = autoFillsEnabled && (barTick64 >= 60);
        const anySoloed = planets.some(pl => pl.soloed);

        planets.forEach(p => {
          const stepIdx = globalTick % p.steps;
          const isAudible = anySoloed ? p.soloed : !p.muted;
          const passesProb = (p.probability >= 100) || (Math.random() * 100 <= p.probability);
          let isHit = p.pattern[stepIdx] && isAudible && passesProb;

          if (isFillWindow && isAudible) {
            if (p.id === 1) isHit = true;
            if (barTick64 === 63 && (p.type.startsWith("kick") || p.type.includes("Bass"))) isHit = false;
          }

          if (isHit) {
            triggerPlanetVoice(p, playTime, stepIdx, Math.cos(p.visualAngle));
          }

          const delayMs = Math.max(0, (playTime - audioCtx.currentTime) * 1000);
          setTimeout(() => {
            p.currentStep = stepIdx;
            if (isHit) {
              p.pulseFlash = 1.0;
              p.springVel += (p.type.startsWith("kick") ? 5.2 : 3.2);
              if (p.type.startsWith("kick")) sunVel += 5.5;
              const pos = getPlanetPosition(p);
              shockwaves.push({ x: pos.x, y: pos.y, r: p.planetRadius, maxR: 75, color: p.color, alpha: 0.8 });
            }
          }, delayMs);
        });

        // Jam Partner counter-melody answer
        if (jamPartnerEnabled && globalTick % 2 === 1) {
          const silenceMs = performance.now() - lastUserPlayTime;
          if (silenceMs > 650 && silenceMs < 6000) {
            const intervals = SCALES[scaleKey];
            const replyDeg = (globalTick % 5 + 2) % intervals.length;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(midiToFreq(60 + intervals[replyDeg]), playTime);
            gain.gain.setValueAtTime(0.001, playTime);
            gain.gain.linearRampToValueAtTime(0.14, playTime + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, playTime + 0.32);
            osc.connect(gain);
            gain.connect(delayNode);
            gain.connect(tapeSaturator);
            osc.start(playTime);
            osc.stop(playTime + 0.35);
          }
        }

        nextTickTime += sixteenthDuration;
        globalTick++;
      }
    }

    function togglePlay() {
      initAudioEngine();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const btn = document.getElementById("btnPlay");
      if (!isPlaying) {
        isPlaying = true;
        globalTick = 0;
        currentChordIndex = 0;
        nextTickTime = audioCtx.currentTime + 0.05;
        schedulerTimer = setInterval(schedulerLoop, 25);
        updateBrainwaveCarrier();
        btn.textContent = "■ STOP";
        btn.classList.add("playing");
      } else {
        isPlaying = false;
        clearInterval(schedulerTimer);
        if (focusMasterGain && audioCtx) focusMasterGain.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.15);
        btn.textContent = "▶ IGNITE";
        btn.classList.remove("playing");
      }
    }

    // Hum-to-Orbit Pitch & Rhythm Capture
    function autoCorrelate(buf, sampleRate) {
      let size = buf.length;
      let rms = 0;
      for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / size);
      if (rms < 0.018) return { freq: -1, rms };

      let r1 = 0, r2 = size - 1, thres = 0.2;
      for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }
      buf = buf.slice(r1, r2);
      size = buf.length;

      const c = new Array(size).fill(0);
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size - i; j++) c[i] += buf[j] * buf[j + i];
      }
      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < size; i++) if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
      return maxpos > 0 ? { freq: sampleRate / maxpos, rms } : { freq: -1, rms };
    }

    async function toggleHumToOrbit() {
      initAudioEngine();
      if (audioCtx.state === "suspended") await audioCtx.resume();

      if (isHumCapturing) {
        isHumCapturing = false;
        renderBottomDock();
        const secondHalf = humCapturedSteps.slice(8).filter(Boolean).length;
        const steps = secondHalf === 0 ? 8 : 16;
        const pat = humCapturedSteps.slice(0, steps);
        const notes = humCapturedNotes.slice(0, steps);
        const hits = pat.filter(Boolean).length;
        if (hits === 0) { showToast("No hum detected—try closer to mic"); return; }

        const targetIdx = planets.length < 7 ? planets.length : selectedPlanetId;
        const orbit = createPlanetFromTemplate(targetIdx, { type: "nuMetalGtr", steps, pulses: hits, pattern: pat, stepNotes: notes, volume: 0.72 });
        orbit.name = `${orbit.baseName} · HUM RIFF`;
        orbit.springVel = 6.5;
        if (planets.length < 7) planets.push(orbit);
        else planets[targetIdx] = orbit;
        selectPlanet(targetIdx);
        saveStudioState();
        showToast(`✨ Captured ${hits}-note Hum Orbit!`);
        return;
      }

      try {
        if (!micStream) {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
          const src = audioCtx.createMediaStreamSource(micStream);
          analyserNode = audioCtx.createAnalyser();
          analyserNode.fftSize = 2048;
          src.connect(analyserNode);
        }
        isHumCapturing = true;
        humCapturedSteps = new Array(16).fill(false);
        humCapturedNotes = new Array(16).fill(0);
        renderBottomDock();
        showToast("🎙️ Hum 'na-na-na' now! Tap FINISH HUM when done.");
        if (!isPlaying) togglePlay();

        const timeData = new Float32Array(analyserNode.fftSize);
        const intervals = SCALES[scaleKey];
        const loop = () => {
          if (!isHumCapturing) return;
          analyserNode.getFloatTimeDomainData(timeData);
          const { freq, rms } = autoCorrelate(timeData, audioCtx.sampleRate);
          const slot = globalTick % 16;
          if (rms > 0.024 && freq > 75 && freq < 1600) {
            const qMidi = quantizeMidiToScale(freqToMidi(freq), scaleKey);
            const rel = ((qMidi % 12) + 12) % 12;
            let bestDeg = 0, minD = 99;
            intervals.forEach((iv, i) => { if (i < 8 && Math.abs((iv % 12) - rel) < minD) { minD = Math.abs((iv % 12) - rel); bestDeg = i; } });
            humCapturedSteps[slot] = true;
            humCapturedNotes[slot] = bestDeg;
            retroSteps[slot] = true;
            retroNotes[slot] = bestDeg;
            lastUserPlayTime = performance.now();
            sunVel += 2.2;

          requestAnimationFrame(loop);
        };

    function exportMultiTrackMidi() {
      const intervals = SCALES[scaleKey];
      const tpq = 480, stepTicks = 120, events = [];
      planets.forEach((p, pIdx) => {
        if (p.muted) return;
        const ch = p.type.startsWith("kick") || p.type.startsWith("snare") || p.type === "rim" ? 9 : (pIdx % 8);
        for (let step = 0; step < 64; step++) {
          const sIdx = step % p.steps;
          if (!p.pattern[sIdx]) continue;
          const note = p.type.startsWith("kick") ? 36 : (p.type.startsWith("snare") ? 38 : 48 + intervals[(p.stepNotes[sIdx] || 0) % intervals.length]);
          events.push({ tick: step * stepTicks, data: [0x90 | ch, note, 100] });
          events.push({ tick: step * stepTicks + 110, data: [0x80 | ch, note, 0] });
        }
      });
      events.sort((a, b) => a.tick - b.tick);
      const trackBytes = [];
      let lastTick = 0;
      events.forEach(ev => {
        let d = ev.tick - lastTick; lastTick = ev.tick;
        const v = []; let buf = d & 0x7f;
        while ((d >>= 7)) { buf <<= 8; buf |= ((d & 0x7f) | 0x80); }
        while (true) { v.push(buf & 0xff); if (buf & 0x80) buf >>= 8; else break; }
        trackBytes.push(...v, ...ev.data);
      });
      trackBytes.push(0x00, 0xff, 0x2f, 0x00);
      const hdr = [0x4d,0x54,0x68,0x64,0,0,0,6,0,0,0,1,1,0xe0,0x4d,0x54,0x72,0x6b,(trackBytes.length>>24)&255,(trackBytes.length>>16)&255,(trackBytes.length>>8)&255,trackBytes.length&255];
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([new Uint8Array([...hdr, ...trackBytes])], { type: "audio/midi" }));
      a.download = `PLUVOX-${bpm}BPM.mid`;
      a.click();
      showToast("🎹 Exported Standard .MID File!");
    }

      } else {
        isRecordingWav = false;
        const total = wavLeftChunks.reduce((acc, c) => acc + c.length, 0);
        const buf = new ArrayBuffer(44 + total * 4);
        const view = new DataView(buf);
        const ws = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
        ws(0,"RIFF"); view.setUint32(4,36+total*4,true); ws(8,"WAVE"); ws(12,"fmt ");
        view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,2,true);
        view.setUint32(24,audioCtx.sampleRate,true); view.setUint32(28,audioCtx.sampleRate*4,true);
        view.setUint16(32,4,true); view.setUint16(34,16,true); ws(36,"data"); view.setUint32(40,total*4,true);
        let off = 44;
        for (let c = 0; c < wavLeftChunks.length; c++) {
          for (let i = 0; i < wavLeftChunks[c].length; i++) {
            const L = Math.max(-1, Math.min(1, wavLeftChunks[c][i]));
            const R = Math.max(-1, Math.min(1, wavRightChunks[c][i]));
            view.setInt16(off, L < 0 ? L * 0x8000 : L * 0x7FFF, true);
            view.setInt16(off + 2, R < 0 ? R * 0x8000 : R * 0x7FFF, true);
            off += 4;
          }
        }
        const a = document.createElement("a");
        a.href = URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));

    // =========================================================================

    const canvas = document.getElementById("cosmos");

    const holdRing = document.getElementById("holdRing");

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const stars = Array.from({ length: 200 }, () => ({ x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.5, tw: Math.random() * 6.28, sp: 0.01 + Math.random() * 0.025 }));
    const particles = Array.from({ length: 85 }, () => ({ x: Math.random() * window.innerWidth, y: Math.random() * window.innerHeight, len: 12 + Math.random() * 20, size: 1.5 + Math.random() * 2.5, speed: 3 + Math.random() * 5, alpha: 0.15 + Math.random() * 0.3, wob: Math.random() * 6.28 }));
    const shockwaves = [];
    const waveData = new Uint8Array(64);
    let sunSpring = 0, sunVel = 0, reelAngle = 0, lastFrame = performance.now();

    function getOrbitRadius(index) {
      const minDim = Math.min(canvas.width, canvas.height);
      const maxSpan = minDim * 0.4;
      const base = Math.max(64, minDim * 0.11);
      const spacing = Math.min(54, (maxSpan - base) / Math.max(1, Math.max(4, planets.length) - 1));
      return base + index * spacing;
    }

    function getPlanetPosition(p) {
      const cx = canvas.width / 2, cy = canvas.height / 2;
      const r = getOrbitRadius(p.id) + p.springOffset + Math.sin(p.floatPhase) * 3.5;
      return { x: cx + Math.cos(p.visualAngle) * r, y: cy + Math.sin(p.visualAngle) * r, orbitR: r };
    }

    function selectPlanet(id) {
      selectedPlanetId = id;
      planets[id].springVel += 3.5;
      showToast(`Selected ${planets[id].name}`);
    }

    function renderCosmos(now) {
      const dt = Math.min(0.05, (now - lastFrame) / 1000);
      lastFrame = now;
      const w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
      const sixteenthSec = (60 / bpm) / 4;
      const biome = BIOMES[activeBiomeKey];

      ctx.fillStyle = biome.bgTrail;
      ctx.fillRect(0, 0, w, h);

      if (biome.particleMode === "studio") {
        if (isPlaying) reelAngle += dt * (bpm / 45);
        const rr = Math.min(w, h) * 0.15;
        [w * 0.25, w * 0.75].forEach(rx => {
          ctx.save(); ctx.translate(rx, h * 0.32); ctx.rotate(reelAngle);
          ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2);
          ctx.strokeStyle = "rgba(245, 158, 11, 0.15)"; ctx.lineWidth = 2; ctx.stroke();
          ctx.restore();
        });
      }

      stars.forEach(s => {
        s.tw += s.sp;
        ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${biome.streakColor}, ${(0.22 + (Math.sin(s.tw) + 1) * 0.34) * 0.65})`;
        ctx.fill();
      });

      const rainPct = rainLevel / 100;
      const activeP = Math.floor(particles.length * rainPct);
      for (let i = 0; i < activeP; i++) {
        const p = particles[i];
        p.wob += 0.03;
        if (biome.particleMode === "rain" || biome.particleMode === "neonrain") {
          p.x -= p.speed * 0.55; p.y += p.speed * 1.25;
          if (p.y > h + 20 || p.x < -20) { p.x = Math.random() * (w + 200); p.y = -20; }
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.len * 0.45, p.y - p.len);
          ctx.strokeStyle = `rgba(${biome.streakColor}, ${p.alpha * rainPct})`; ctx.lineWidth = 1.3; ctx.stroke();
        } else {
          p.y -= p.speed * 0.3; p.x += Math.sin(p.wob) * 0.8;
          if (p.y < -20) { p.y = h + 20; p.x = Math.random() * w; }
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${biome.streakColor}, ${p.alpha * rainPct})`; ctx.fill();
        }
      }

      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.11;
        sw.alpha *= 0.91;
        if (sw.alpha < 0.02) { shockwaves.splice(i, 1); continue; }
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color; ctx.globalAlpha = sw.alpha; ctx.lineWidth = 2; ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // Central Sun + Live Audio Oscilloscope Ring
      sunVel = (sunVel - sunSpring * 0.11) * 0.88;
      sunSpring += sunVel;
      const sunR = Math.max(16, 26 + sunSpring);
      const sunGrad = ctx.createRadialGradient(cx, cy, 4, cx, cy, sunR * 2.8);
      sunGrad.addColorStop(0, "#ffffff");
      sunGrad.addColorStop(0.28, isHumCapturing ? "#fb7185" : (isPlaying ? biome.sunCore : "#94a3b8"));
      sunGrad.addColorStop(0.65, isHumCapturing ? "rgba(244,63,94,0.45)" : (isPlaying ? biome.sunHalo : "rgba(56,189,248,0.12)"));
      sunGrad.addColorStop(1, "rgba(0,0,0,0)");
      ctx.beginPath(); ctx.arc(cx, cy, sunR * 2.8, 0, Math.PI * 2); ctx.fillStyle = sunGrad; ctx.fill();

      if (masterAnalyser && isPlaying) {
        masterAnalyser.getByteTimeDomainData(waveData);
        ctx.beginPath();
        for (let i = 0; i < waveData.length; i++) {
          const a = (i / waveData.length) * Math.PI * 2;
          const rW = sunR + 12 + ((waveData[i] - 128) / 128) * 16;
          const wx = cx + Math.cos(a) * rW, wy = cy + Math.sin(a) * rW;
          if (i === 0) ctx.moveTo(wx, wy); else ctx.lineTo(wx, wy);
        }
        ctx.closePath(); ctx.strokeStyle = `rgba(${biome.streakColor}, 0.52)`; ctx.lineWidth = 1.4; ctx.stroke();
      }

      const anySolo = planets.some(pl => pl.soloed);
      planets.forEach(p => {
        p.springVel = (p.springVel - p.springOffset * 0.09) * 0.89;
        p.springOffset += p.springVel;
        p.floatPhase += dt * (1.2 + p.id * 0.25);
        p.pulseFlash *= 0.91;

        if (isPlaying) {
          p.visualAngle += ((Math.PI * 2) / (p.steps * sixteenthSec)) * dt;
          const expA = (p.currentStep / p.steps) * Math.PI * 2 - Math.PI / 2;
          let err = expA - p.visualAngle;
          while (err < -Math.PI) err += Math.PI * 2;
          while (err > Math.PI) err -= Math.PI * 2;
          p.visualAngle += err * 0.06;
        } else {
          p.visualAngle += 0.08 * dt * (p.id % 2 === 0 ? 1 : -1);
        }

        const orbitR = getOrbitRadius(p.id) + p.springOffset + Math.sin(p.floatPhase) * 3.5;
        const isSel = p.id === selectedPlanetId;
        const dimmed = anySolo ? !p.soloed : p.muted;

        ctx.beginPath(); ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
        ctx.strokeStyle = p.locked ? "#38bdf8" : (isSel ? p.color : "rgba(148, 163, 184, 0.16)");
        ctx.globalAlpha = dimmed ? 0.15 : (isSel || p.locked ? 0.55 : 1);
        ctx.lineWidth = isSel || p.locked ? 2 : 1.1; ctx.stroke(); ctx.globalAlpha = 1;

        const nodes = [];
        for (let s = 0; s < p.steps; s++) {
          const sa = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = cx + Math.cos(sa) * orbitR, ny = cy + Math.sin(sa) * orbitR;
          const active = p.pattern[s];
          if (active) nodes.push({ x: nx, y: ny });
          ctx.beginPath(); ctx.arc(nx, ny, active ? 5.8 : 3.1, 0, Math.PI * 2);
          ctx.globalAlpha = dimmed ? 0.25 : 1;
          ctx.fillStyle = active ? p.color : "rgba(100, 116, 139, 0.42)";
          ctx.fill(); ctx.globalAlpha = 1;
        }

        if (nodes.length > 1) {
          ctx.beginPath();
          nodes.forEach((pt, i) => { if (i === 0) ctx.moveTo(pt.x, pt.y); else ctx.lineTo(pt.x, pt.y); });
          ctx.closePath(); ctx.strokeStyle = p.color;
          ctx.globalAlpha = dimmed ? 0.08 : (0.24 + p.pulseFlash * 0.35);
          ctx.lineWidth = 1.4; ctx.stroke(); ctx.globalAlpha = 1;
        }

        const px = cx + Math.cos(p.visualAngle) * orbitR;
        const py = cy + Math.sin(p.visualAngle) * orbitR;
        const pRad = p.planetRadius + p.pulseFlash * 5.5;

        pGrad.addColorStop(0, "#ffffff"); pGrad.addColorStop(0.35, p.color); pGrad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.beginPath(); ctx.arc(px, py, pRad * 2.4, 0, Math.PI * 2);

    // Long-Press anywhere in open space to summon the Radial Weapon Wheel!

    canvas.addEventListener("pointerdown", e => {

      const cx = canvas.width / 2, cy = canvas.height / 2;
      pressStartPos = { x: mx, y: my };

        for (let s = 0; s < p.steps; s++) {
          const sa = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = cx + Math.cos(sa) * orbitR, ny = cy + Math.sin(sa) * orbitR;
          if (Math.hypot(mx - nx, my - ny) <= 15) {

              draggingOrb = { planetId: p.id, originStep: s, hoverStep: s, moved: false };
            } else {
              p.pattern[s] = true;
              p.pulses = p.pattern.filter(Boolean).length;

        clearTimeout(longPressTimer);

      if (draggingOrb) {

        let a = Math.atan2(my - cy, mx - cx) + Math.PI / 2;
        if (a < 0) a += Math.PI * 2;
        draggingOrb.hoverStep = Math.round((a / (Math.PI * 2)) * p.steps) % p.steps;
      }
    });

    window.addEventListener("pointerup", () => {
      clearTimeout(longPressTimer);
      holdRing.classList.remove("charging");
      pressStartPos = null;

      if (draggingOrb) {
        const p = planets[draggingOrb.planetId];
        if (!draggingOrb.moved || draggingOrb.hoverStep === draggingOrb.originStep) {
          p.pattern[draggingOrb.originStep] = false;
        } else {
          p.pattern[draggingOrb.originStep] = false;
          p.pattern[draggingOrb.hoverStep] = true;
          p.springVel += 2.8;
        }
        p.pulses = p.pattern.filter(Boolean).length;
        saveStudioState();
        draggingOrb = null;
      }
    });

    document.getElementById("btnPlay").addEventListener("click", togglePlay);
    window.addEventListener("keydown", e => {
      if (e.code === "Space" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); togglePlay(); }
    });

    // Boot
    injectNativeMobileIcons();
    solarScenes[0] = captureCurrentSnapshot("SYS 01");
    loadStudioState();
    updateTopLabel();
    renderBottomDock();
    requestAnimationFrame(renderCosmos);
  </script>
</body>
</html>
