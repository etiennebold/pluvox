<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLUVOX — Orbital Polyrhythm Synth, Rain DSP & Whistle-to-Synth</title>
  <style>
    :root {
      --void: #04060b;
      --glass: rgba(11, 16, 28, 0.72);
      --glass-border: rgba(148, 163, 184, 0.18);
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --cyan: #38bdf8;
      --amber: #f59e0b;
      --rose: #fb7185;
      --violet: #c084fc;
      --emerald: #10b981;
      --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--void);
      color: var(--text-main);
      font-family: var(--font-sans);
      user-select: none;
    }

    canvas#cosmos {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: grab;
    }

    canvas#cosmos:active {
      cursor: grabbing;
    }

    /* FLOATING MINIMAL TOP HUD (NO CARDS) */
    .hud-top {
      position: fixed;
      top: 18px;
      left: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      pointer-events: auto;
      flex-wrap: wrap;
    }

    .brand-title {
      font-family: var(--font-mono);
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      background: linear-gradient(90deg, #ffffff 20%, var(--cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.35);
    }

    .brand-hint {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .pill {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 0.42rem 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      color: var(--text-dim);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .pill:hover {
      border-color: rgba(255, 255, 255, 0.35);
    }

    .pill strong {
      color: var(--text-main);
    }

    button.hud-btn {
      background: var(--glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 0.48rem 1rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    button.hud-btn:hover {
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    button.hud-btn:active {
      transform: scale(0.95);
    }

    button.hud-btn.active-play {
      background: rgba(16, 185, 129, 0.22);
      border-color: var(--emerald);
      color: #6ee7b7;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
    }

    button.hud-btn.active-mic {
      background: rgba(56, 189, 248, 0.24);
      border-color: var(--cyan);
      color: #bae6fd;
      box-shadow: 0 0 22px rgba(56, 189, 248, 0.4);
    }

    button.hud-btn.active-rec {
      background: rgba(251, 113, 133, 0.25);
      border-color: var(--rose);
      color: #fecdd3;
      box-shadow: 0 0 20px rgba(251, 113, 133, 0.45);
      animation: pulseRec 1.4s infinite;
    }

    @keyframes pulseRec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.65; }
    }

    select {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.74rem;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    select option {
      background: #0b101c;
      color: #f8fafc;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.14);
      height: 4px;
      border-radius: 999px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
      transition: transform 0.12s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    /* FLOATING PLANETARY INSPECTOR (APPEARS ONLY WHEN A PLANET IS SELECTED) */
    .planet-inspector {
      position: fixed;
      left: 24px;
      bottom: 78px;
      z-index: 25;
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      padding: 0.55rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 1.1rem;
      flex-wrap: wrap;
      font-family: var(--font-mono);
      font-size: 0.74rem;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55);
      transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .planet-inspector.hidden {
      opacity: 0;
      pointer-events: none;
      transform: translateY(14px);
    }

    .inspector-title {
      font-weight: 800;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .planet-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .inspector-control {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-dim);
    }

    /* FLOATING BOTTOM ATMOSPHERE & TELEMETRY DOCK */
    .hud-bottom {
      position: fixed;
      bottom: 18px;
      left: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      pointer-events: none;
    }

    .hud-bottom > * {
      pointer-events: auto;
    }

    .vox-pill {
      border-color: rgba(56, 189, 248, 0.35);
    }

    .vox-note {
      color: var(--cyan);
      font-weight: 800;
      min-width: 34px;
      text-align: center;
    }
  </style>
</head>
<body>

  <canvas id="cosmos"></canvas>

  <!-- TOP FLOATING ORBITAL TRANSPORT -->
  <div class="hud-top">
    <div class="hud-group">
      <div>
        <div class="brand-title">PLUVOX</div>
        <div class="brand-hint">CLICK SUN TO IGNITE · CLICK ORBIT NODES TO TOGGLE PULSES · DRAG PLANETS</div>
      </div>
    </div>

    <div class="hud-group">
      <button id="btnPlay" class="hud-btn">▶ IGNITE SUN</button>

      <div class="pill">
        <span>GRAVITY</span>
        <input type="range" id="bpmSlider" min="58" max="165" value="86" style="width: 76px;" />
        <strong id="bpmVal">86 BPM</strong>
      </div>

      <div class="pill">
        <span>SCALE</span>
        <select id="scaleSelect">
          <option value="minorPentatonic">C Minor Pentatonic</option>
          <option value="dorian">C Dorian (Neo-Soul)</option>

        </select>
      </div>

      <div class="pill">
        <span>CHORDS</span>
        <select id="chordProgSelect">
          <option value="none">Off</option>
          <option value="lofi1" selected>i – VI – III – VII (Rain)</option>
          <option value="neosoul">ii – V – I – vi (Velvet)</option>
          <option value="drift">i – iv – v – i (Deep Space)</option>
        </select>
      </div>

      <div class="pill">
        <span>ORBIT</span>
        <select id="presetSelect">
          <option value="afro">3:4:5:7 Afro-Solar</option>
          <option value="kyoto">5:7:8:11 Kyoto Drift</option>
          <option value="dub">4:6:3:8 Sub-Gravity</option>
          <option value="mutate">🎲 Mutate System</option>
        </select>
      </div>

  </div>

  <!-- FLOATING SELECTED PLANET ORBITAL RING CONTROLS -->
  <div class="planet-inspector" id="planetInspector">
    <div class="inspector-title">
      <span class="planet-dot" id="inspDot"></span>
      <span id="inspName">VULCAN · SUB KICK</span>
    </div>
    <div class="inspector-control">
      <span>ORBIT STEPS</span>
      <input type="range" id="inspSteps" min="2" max="16" value="3" style="width: 72px;" />
      <strong id="inspStepsVal">3</strong>
    </div>
    <div class="inspector-control">
      <span>ACTIVE MOONS</span>
      <input type="range" id="inspPulses" min="1" max="16" value="2" style="width: 72px;" />
      <strong id="inspPulsesVal">2</strong>
    </div>
    <div class="inspector-control">
      <span>PITCH</span>
      <input type="range" id="inspPitch" min="0" max="11" value="0" style="width: 58px;" />
      <strong id="inspPitchVal">+0</strong>
    </div>
    <div class="inspector-control">
      <span>GAIN</span>
      <input type="range" id="inspVol" min="0" max="100" value="88" style="width: 64px;" />
      <strong id="inspVolVal">88%</strong>
    </div>
  </div>

  <!-- BOTTOM FLOATING ATMOSPHERE, WHISTLE SYNTH & RECORDER BAR -->
  <div class="hud-bottom">
    <div class="hud-group">
      <div class="pill">
        <span>☄️ METEOR RAIN</span>
        <input type="range" id="rainSlider" min="0" max="100" value="42" style="width: 70px;" />
        <strong id="rainVal">42%</strong>
      </div>
      <div class="pill">
        <span>🪨 ASTEROID VINYL</span>
        <input type="range" id="vinylSlider" min="0" max="100" value="30" style="width: 70px;" />
        <strong id="vinylVal">30%</strong>
      </div>
      <div class="pill">
        <span>📼 TAPE FILTER</span>
        <input type="range" id="toneSlider" min="550" max="14000" value="3800" style="width: 70px;" />
        <strong id="toneVal">3.8k</strong>
      </div>
      <div class="pill">
        <span>🌊 ECHO</span>
        <input type="range" id="delaySlider" min="0" max="80" value="36" style="width: 60px;" />
        <strong id="delayVal">36%</strong>
      </div>
    </div>

    <div class="hud-group">
      <div class="pill vox-pill">
        <button id="btnToggleMic" class="hud-btn" style="padding: 0.25rem 0.7rem; border: none;">🎙️ WHISTLE / HUM</button>
        <span class="vox-note" id="quantizedNote">--</span>
        <select id="voiceWaveSelect" title="Whistle Synth Timbre">
          <option value="triangle">Flute</option>
          <option value="sawtooth">Plasma Saw</option>
          <option value="sine">Pure Sine</option>
        </select>
      </div>

      <button id="btnRecord" class="hud-btn">⏺ REC</button>
    </div>
  </div>

  <script>
    // =========================================================================
    // 1. MUSICAL SCALES, CHORD PROGRESSIONS & EUCLIDEAN GENERATOR
    // =========================================================================
    const SCALES = {
      minorPentatonic: [0, 3, 5, 7, 10, 12, 15, 17, 19, 22, 24],
      dorian:          [0, 2, 3, 5, 7, 9, 10, 12, 14, 15, 17, 19],
      lydian:          [5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24],
      hirajoshi:       [0, 2, 3, 7, 8, 12, 14, 15, 19, 20, 24]
    };

    const CHORD_PROGRESSIONS = {
      none: [],
      lofi1:   [[48, 55, 58, 62], [44, 51, 55, 60], [51, 58, 62, 67], [46, 53, 58, 62]], // Cm9 - Abmaj7 - Ebmaj7 - Bb6
      neosoul: [[50, 57, 60, 64], [55, 59, 62, 65], [48, 55, 59, 64], [45, 52, 55, 60]], // Dm9 - G13 - Cmaj9 - Am7
      drift:   [[48, 55, 60, 63], [53, 60, 65, 68], [55, 62, 67, 70], [48, 55, 60, 67]]  // Cm - Fm - Gm - Csus
    };

    const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

    function midiToFreq(midi) {
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function freqToMidi(freq) {
      return Math.round(69 + 12 * Math.log2(freq / 440));
    }

    function midiToName(midi) {
      return `${NOTE_NAMES[midi % 12]}${Math.floor(midi / 12) - 1}`;
    }

    function quantizeMidiToScale(rawMidi, scaleKey) {
      const intervals = SCALES[scaleKey] || SCALES.minorPentatonic;
      const baseC = 48;
      let bestMidi = rawMidi;
      let minDiff = Infinity;
      for (let oct = -1; oct <= 3; oct++) {
        for (const interval of intervals) {
          const candidate = baseC + oct * 12 + interval;
          const diff = Math.abs(rawMidi - candidate);
          if (diff < minDiff) {
            minDiff = diff;
            bestMidi = candidate;
          }
        }
      }
      return bestMidi;
    }

    function generateEuclidean(steps, pulses) {
      pulses = Math.max(0, Math.min(steps, pulses));
      const pattern = new Array(steps).fill(false);
      if (pulses === 0) return pattern;
      let bucket = 0;
      for (let i = 0; i < steps; i++) {
        bucket += pulses;
        if (bucket >= steps) {
          bucket -= steps;
          pattern[i] = true;
        }
      }
      return pattern;
    }

    // =========================================================================
    // 2. CELESTIAL BODIES (4 ORBITING EUCLIDEAN PLANETS)
    // =========================================================================
    const planets = [
      {
        id: 0,
        name: "VULCAN · SUB KICK",
        type: "kick",
        color: "#f59e0b",
        glow: "rgba(245, 158, 11, 0.45)",
        planetRadius: 15,
        steps: 3,
        pulses: 2,
        pitchOffset: 0,
        volume: 0.88,
        pattern: [true, false, true],
        currentStep: 0,
        smoothAngle: -Math.PI / 2,
        springOffset: 0,
        springVel: 0,
        pulseFlash: 0
      },
      {
        id: 1,
        name: "CRIMSON · LO-FI RIM",
        type: "snare",
        color: "#fb7185",
        glow: "rgba(251, 113, 133, 0.45)",
        planetRadius: 12,
        steps: 4,
        pulses: 2,
        pitchOffset: 0,
        volume: 0.68,
        pattern: [false, true, false, true],
        currentStep: 0,
        smoothAngle: -Math.PI / 2,
        springOffset: 0,
        springVel: 0,
        pulseFlash: 0
      },
      {
        id: 2,
        name: "AQUARIA · RHODES PLUCK",
        type: "pluck",
        color: "#38bdf8",
        glow: "rgba(56, 189, 248, 0.45)",
        planetRadius: 14,
        steps: 5,
        pulses: 3,
        pitchOffset: 3,
        volume: 0.64,
        pattern: [true, false, true, false, true],
        currentStep: 0,
        smoothAngle: -Math.PI / 2,
        springOffset: 0,
        springVel: 0,
        pulseFlash: 0
      },
      {
        id: 3,
        name: "NEBULA · GLASS BELL",
        type: "bell",
        color: "#c084fc",
        glow: "rgba(192, 132, 252, 0.45)",
        planetRadius: 13,
        steps: 7,
        pulses: 4,
        pitchOffset: 6,
        volume: 0.54,
        pattern: [true, false, true, false, true, false, true],
        currentStep: 0,
        smoothAngle: -Math.PI / 2,
        springOffset: 0,
        springVel: 0,
        pulseFlash: 0
      }
    ];

    let selectedPlanetId = 0;

    // =========================================================================
    // 3. WEB AUDIO API DSP ENGINE (SYNTHS, CHORD PAD, RAIN, VINYL, RECORDER)
    // =========================================================================
    let audioCtx = null;
    let masterFilter = null;
    let delayNode = null;
    let delayWet = null;
    let rainGain = null;
    let vinylGain = null;
    let recordDest = null;
    let mediaRecorder = null;
    let recordedChunks = [];

    let isPlaying = false;
    let schedulerTimer = null;
    let nextTickTime = 0;
    let globalTick = 0;
    let currentChordIndex = 0;

    // Mic Pitch Tracker
    let micStream = null;
    let analyserNode = null;
    let micOsc = null;
    let micGainNode = null;
    let pitchRaf = null;
    let activeVoxFreq = 0;
    let activeVoxMidi = 0;

    function initAudioEngine() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();

      const compressor = audioCtx.createDynamicsCompressor();
      compressor.threshold.value = -14;
      compressor.ratio.value = 3.5;

      masterFilter = audioCtx.createBiquadFilter();
      masterFilter.type = "lowpass";
      masterFilter.frequency.value = Number(document.getElementById("toneSlider").value);
      masterFilter.Q.value = 0.8;

      // Dub Stereo Delay
      delayNode = audioCtx.createDelay(2.0);
      delayNode.delayTime.value = 0.35;
      const delayFeedback = audioCtx.createGain();
      delayFeedback.gain.value = 0.4;
      delayWet = audioCtx.createGain();
      delayWet.gain.value = Number(document.getElementById("delaySlider").value) / 100;

      delayNode.connect(delayFeedback);
      delayFeedback.connect(delayNode);
      delayNode.connect(delayWet);
      delayWet.connect(masterFilter);

      masterFilter.connect(compressor);
      compressor.connect(audioCtx.destination);

      // Session Recorder Tap
      recordDest = audioCtx.createMediaStreamDestination();
      compressor.connect(recordDest);

      // Procedural Rain Buffer
      const bufferSize = audioCtx.sampleRate * 3;
      const rainBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const rainData = rainBuffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        rainData[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.042;
        b6 = white * 0.115926;
      }

      const rainSource = audioCtx.createBufferSource();
      rainSource.buffer = rainBuffer;
      rainSource.loop = true;

      const rainBand = audioCtx.createBiquadFilter();
      rainBand.type = "bandpass";
      rainBand.frequency.value = 1050;
      rainBand.Q.value = 0.5;

      rainGain = audioCtx.createGain();
      rainGain.gain.value = (Number(document.getElementById("rainSlider").value) / 100) * 0.55;

      rainSource.connect(rainBand);
      rainBand.connect(rainGain);
      rainGain.connect(compressor);
      rainSource.start();

      // Procedural Vinyl Crackle Buffer
      const vinylBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const vinylData = vinylBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        const r = Math.random();
        vinylData[i] = r > 0.9982 ? (Math.random() * 2 - 1) * 0.45 : (Math.random() * 2 - 1) * 0.004;
      }

      const vinylSource = audioCtx.createBufferSource();
      vinylSource.buffer = vinylBuffer;
      vinylSource.loop = true;

      const vinylHigh = audioCtx.createBiquadFilter();
      vinylHigh.type = "highpass";
      vinylHigh.frequency.value = 1850;

      vinylGain = audioCtx.createGain();
      vinylGain.gain.value = (Number(document.getElementById("vinylSlider").value) / 100) * 0.6;

      vinylSource.connect(vinylHigh);
      vinylHigh.connect(vinylGain);
      vinylGain.connect(compressor);
      vinylSource.start();
    }

    function triggerChordPad(time, durationSec) {
      if (!audioCtx) return;
      const progKey = document.getElementById("chordProgSelect").value;
      const chords = CHORD_PROGRESSIONS[progKey];
      if (!chords || chords.length === 0) return;

      const notes = chords[currentChordIndex % chords.length];
      currentChordIndex++;

      notes.forEach((midi, idx) => {
        const freq = midiToFreq(midi);
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc1.type = "triangle";
        osc2.type = "sine";
        osc1.frequency.setValueAtTime(freq, time);
        osc2.frequency.setValueAtTime(freq * 1.003, time); // Warm analog detune

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(950, time);

        const peak = 0.065 / Math.sqrt(notes.length);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(peak, time + 0.35);
        gain.gain.setValueAtTime(peak * 0.85, time + durationSec - 0.4);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + durationSec);

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(gain);
        gain.connect(masterFilter);
        if (idx === 0) gain.connect(delayNode);

        osc1.start(time);
        osc2.start(time);
        osc1.stop(time + durationSec + 0.05);
        osc2.stop(time + durationSec + 0.05);
      });
    }

    function triggerSyzygySwell(time) {
      if (!audioCtx) return;
      const scaleKey = document.getElementById("scaleSelect").value;
      const intervals = SCALES[scaleKey];
      [0, 2, 4].forEach(idx => {
        const freq = midiToFreq(72 + intervals[idx % intervals.length]);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq, time);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(0.045, time + 0.12);
        gain.gain.exponentialRampToValueAtTime(0.0001, time + 1.1);
        osc.connect(gain);
        gain.connect(delayNode);
        gain.connect(masterFilter);
        osc.start(time);
        osc.stop(time + 1.15);
      });
    }

    function triggerPlanetVoice(planet, time, stepIndex) {
      if (!audioCtx) return;
      const scaleKey = document.getElementById("scaleSelect").value;
      const intervals = SCALES[scaleKey];

      if (planet.type === "kick") {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(145, time);
        osc.frequency.exponentialRampToValueAtTime(38, time + 0.16);

        gain.gain.setValueAtTime(planet.volume, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.36);

        osc.connect(gain);
        gain.connect(masterFilter);
        osc.start(time);
        osc.stop(time + 0.38);
      } else if (planet.type === "snare") {
        const noiseLen = Math.floor(audioCtx.sampleRate * 0.14);
        const buf = audioCtx.createBuffer(1, noiseLen, audioCtx.sampleRate);
        const out = buf.getChannelData(0);
        for (let i = 0; i < noiseLen; i++) out[i] = Math.random() * 2 - 1;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buf;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1480;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(planet.volume * 0.55, time);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.13);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(masterFilter);
        gain.connect(delayNode);
        noise.start(time);
      } else if (planet.type === "pluck") {
        const noteIdx = (stepIndex + planet.pitchOffset) % intervals.length;
        const freq = midiToFreq(48 + intervals[noteIdx]);

        const osc = audioCtx.createOscillator();
        const sub = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const gain = audioCtx.createGain();

        osc.type = "triangle";
        sub.type = "sine";
        osc.frequency.setValueAtTime(freq, time);
        sub.frequency.setValueAtTime(freq * 2, time);

        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1750, time);
        filter.frequency.exponentialRampToValueAtTime(260, time + 0.3);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(planet.volume * 0.45, time + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.38);

        osc.connect(filter);
        sub.connect(filter);
        filter.connect(gain);
        gain.connect(masterFilter);
        gain.connect(delayNode);

        osc.start(time);
        sub.start(time);
        osc.stop(time + 0.4);
        sub.stop(time + 0.4);
      } else if (planet.type === "bell") {
        const noteIdx = (stepIndex * 2 + planet.pitchOffset) % intervals.length;
        const freq = midiToFreq(60 + intervals[noteIdx]);

        const osc = audioCtx.createOscillator();
        const mod = audioCtx.createOscillator();
        const modGain = audioCtx.createGain();
        const gain = audioCtx.createGain();

        osc.type = "sine";
        mod.type = "sine";
        osc.frequency.setValueAtTime(freq, time);
        mod.frequency.setValueAtTime(freq * 2.5, time);
        modGain.gain.setValueAtTime(freq * 0.75, time);
        modGain.gain.exponentialRampToValueAtTime(1, time + 0.22);

        gain.gain.setValueAtTime(0.001, time);
        gain.gain.linearRampToValueAtTime(planet.volume * 0.32, time + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.56);

        mod.connect(modGain);
        modGain.connect(osc.frequency);
        osc.connect(gain);
        gain.connect(masterFilter);
        gain.connect(delayNode);

        osc.start(time);
        mod.start(time);
        osc.stop(time + 0.6);
        mod.stop(time + 0.6);
      }
    }

    // =========================================================================
    // 4. LOOKAHEAD SCHEDULER + SYZYGY DETECTION
    // =========================================================================
    function schedulerLoop() {
      const bpm = Number(document.getElementById("bpmSlider").value);
      const sixteenthDuration = (60 / bpm) / 4;

      while (nextTickTime < audioCtx.currentTime + 0.1) {
        const swingOffset = (globalTick % 2 === 1) ? sixteenthDuration * 0.16 : 0;
        const playTime = nextTickTime + swingOffset;

        // Trigger 4-bar Lo-Fi Chord Pad every 16 sixteenth notes
        if (globalTick % 16 === 0) {
          triggerChordPad(playTime, sixteenthDuration * 15.5);
        }

        let simultaneousHits = 0;
        planets.forEach(p => {
          const stepIdx = globalTick % p.steps;
          const isHit = p.pattern[stepIdx];
          if (isHit) {
            simultaneousHits++;
            triggerPlanetVoice(p, playTime, stepIdx);
          }

          const delayMs = Math.max(0, (playTime - audioCtx.currentTime) * 1000);
          setTimeout(() => {
            p.currentStep = stepIdx;
            if (isHit) {
              p.pulseFlash = 1.0;
              p.springVel += (p.type === "kick" ? 6.5 : 4.2);
              if (p.type === "kick") sunVel += 7.0;

              const pos = getPlanetPosition(p);
              shockwaves.push({
                x: pos.x,
                y: pos.y,
                r: p.planetRadius,
                maxR: p.type === "kick" ? 95 : 65,
                color: p.color,
                alpha: 0.9
              });
            }
          }, delayMs);
        });

        // Syzygy Gravitational Alignment Bonus (3+ planets hit simultaneously)
        if (simultaneousHits >= 3) {
          triggerSyzygySwell(playTime);
          const delayMs = Math.max(0, (playTime - audioCtx.currentTime) * 1000);
          setTimeout(() => {
            shockwaves.push({
              x: canvas.width / 2,
              y: canvas.height / 2,
              r: 24,
              maxR: Math.min(canvas.width, canvas.height) * 0.45,
              color: "#ffffff",
              alpha: 0.65
            });
          }, delayMs);
        }

        nextTickTime += sixteenthDuration;
        globalTick++;
      }
    }

    function togglePlay() {
      initAudioEngine();
      if (audioCtx.state === "suspended") audioCtx.resume();
      const btn = document.getElementById("btnPlay");

      if (!isPlaying) {

      }
    }

    // =========================================================================
    // 5. ACOUSTIC "WHISTLE & HUM" PITCH-TO-SYNTH ENGINE
    // =========================================================================
    function autoCorrelate(buf, sampleRate) {
      let size = buf.length;
      let rms = 0;
      for (let i = 0; i < size; i++) rms += buf[i] * buf[i];
      rms = Math.sqrt(rms / size);
      if (rms < 0.016) return { freq: -1, rms };

      let r1 = 0, r2 = size - 1, thres = 0.2;
      for (let i = 0; i < size / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
      for (let i = 1; i < size / 2; i++) if (Math.abs(buf[size - i]) < thres) { r2 = size - i; break; }

      buf = buf.slice(r1, r2);
      size = buf.length;

      const c = new Array(size).fill(0);
      for (let i = 0; i < size; i++) {
        for (let j = 0; j < size - i; j++) {
          c[i] += buf[j] * buf[j + i];
        }
      }

      let d = 0;
      while (c[d] > c[d + 1]) d++;
      let maxval = -1, maxpos = -1;
      for (let i = d; i < size; i++) {
        if (c[i] > maxval) {
          maxval = c[i];
          maxpos = i;
        }
      }
      return maxpos > 0 ? { freq: sampleRate / maxpos, rms } : { freq: -1, rms };
    }

    async function toggleMicrophoneSynth() {
      initAudioEngine();
      if (audioCtx.state === "suspended") await audioCtx.resume();
      const btn = document.getElementById("btnToggleMic");

      if (micStream) {
        cancelAnimationFrame(pitchRaf);
        micStream.getTracks().forEach(t => t.stop());
        micStream = null;
        if (micOsc) { micOsc.stop(); micOsc.disconnect(); micOsc = null; }
        activeVoxFreq = 0;
        btn.textContent = "🎙️ WHISTLE / HUM";
        btn.classList.remove("active-mic");
        document.getElementById("quantizedNote").textContent = "--";
        return;
      }

      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const micSource = audioCtx.createMediaStreamSource(micStream);
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 2048;
        micSource.connect(analyserNode);

        micOsc = audioCtx.createOscillator();
        micOsc.type = document.getElementById("voiceWaveSelect").value;
        micOsc.frequency.value = 261.63;

        const micFilter = audioCtx.createBiquadFilter();
        micFilter.type = "lowpass";
        micFilter.frequency.value = 2100;

        micGainNode = audioCtx.createGain();
        micGainNode.gain.value = 0.0001;

        micOsc.connect(micFilter);
        micFilter.connect(micGainNode);
        micGainNode.connect(masterFilter);
        micGainNode.connect(delayNode);
        micOsc.start();

        btn.textContent = "🎙️ LIVE AURORA";
        btn.classList.add("active-mic");

        const timeData = new Float32Array(analyserNode.fftSize);
        const trackPitchLoop = () => {
          if (!micStream) return;
          analyserNode.getFloatTimeDomainData(timeData);
          const { freq, rms } = autoCorrelate(timeData, audioCtx.sampleRate);

          if (freq > 75 && freq < 1800) {
            const rawMidi = freqToMidi(freq);
            const scaleKey = document.getElementById("scaleSelect").value;
            const quantMidi = quantizeMidiToScale(rawMidi, scaleKey);
            const targetFreq = midiToFreq(quantMidi);
            activeVoxFreq = targetFreq;
            activeVoxMidi = quantMidi;

            document.getElementById("quantizedNote").textContent = midiToName(quantMidi);
            micOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.055);
            micGainNode.gain.setTargetAtTime(Math.min(0.28, rms * 2.4), audioCtx.currentTime, 0.03);
          } else {
            activeVoxFreq = 0;
            micGainNode.gain.setTargetAtTime(0.0001, audioCtx.currentTime, 0.06);
          }

          pitchRaf = requestAnimationFrame(trackPitchLoop);
        };
        trackPitchLoop();
      } catch (err) {
        alert("Microphone access denied: " + err.message);
      }
    }

    // =========================================================================
    // 7. OPEN-SPACE SOLAR SYSTEM CANVAS & DIRECT PHYSICS INTERACTION
    // =========================================================================
    const canvas = document.getElementById("cosmos");
    const ctx = canvas.getContext("2d");

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    // Deep-space starfield, meteors, and vinyl asteroid belt
    const stars = Array.from({ length: 220 }, () => ({
      x: Math.random(),
      y: Math.random(),
      r: 0.5 + Math.random() * 1.6,
      twinkle: Math.random() * Math.PI * 2,
      speed: 0.01 + Math.random() * 0.03
    }));

    const meteors = Array.from({ length: 90 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      len: 14 + Math.random() * 24,
      speed: 5 + Math.random() * 7,
      alpha: 0.12 + Math.random() * 0.3
    }));

    const asteroids = Array.from({ length: 65 }, (_, i) => ({
      angle: (i / 65) * Math.PI * 2,
      distOffset: (Math.random() - 0.5) * 26,
      size: 1 + Math.random() * 2.2,
      speed: 0.0015 + Math.random() * 0.002
    }));

    const shockwaves = [];
    const plasmaTrail = [];
    let sunSpring = 0;
    let sunVel = 0;

    function getOrbitRadius(index) {
      const minDim = Math.min(canvas.width, canvas.height);
      const base = Math.max(78, minDim * 0.13);
      const spacing = Math.max(54, minDim * 0.082);
      return base + index * spacing;
    }

    function getPlanetPosition(planet) {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const r = getOrbitRadius(planet.id) + planet.springOffset;
      return {
        x: cx + Math.cos(planet.smoothAngle) * r,
        y: cy + Math.sin(planet.smoothAngle) * r,
        orbitR: r
      };
    }

    function renderCosmos() {
      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;

      // Subtle motion-trail fade in deep space
      ctx.fillStyle = "rgba(4, 6, 11, 0.38)";
      ctx.fillRect(0, 0, w, h);

      // 1. Twinkling Starfield
      stars.forEach(s => {
        s.twinkle += s.speed;
        const alpha = 0.25 + (Math.sin(s.twinkle) + 1) * 0.35;
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(226, 232, 240, ${alpha})`;
        ctx.fill();
      });

      // 2. Meteor Shower (Driven by Rain DSP Slider)
      const rainPct = Number(document.getElementById("rainSlider").value) / 100;
      const activeMeteors = Math.floor(meteors.length * rainPct);
      ctx.lineWidth = 1.3;
      for (let i = 0; i < activeMeteors; i++) {
        const m = meteors[i];
        m.x -= m.speed * 0.65;
        m.y += m.speed * 1.15;
        if (m.y > h + 30 || m.x < -30) {
          m.x = Math.random() * (w + 250);
          m.y = -20;
        }
        ctx.beginPath();
        ctx.moveTo(m.x, m.y);
        ctx.lineTo(m.x + m.len * 0.55, m.y - m.len);
        ctx.strokeStyle = `rgba(56, 189, 248, ${m.alpha * rainPct})`;
        ctx.stroke();
      }

      // 3. Outer Asteroid Belt (Driven by Vinyl Crackle DSP Slider)
      const vinylPct = Number(document.getElementById("vinylSlider").value) / 100;
      const beltBaseR = getOrbitRadius(3) + 52;
      if (vinylPct > 0.02) {
        asteroids.forEach(ast => {
          ast.angle += ast.speed * (0.4 + vinylPct);
          const ax = cx + Math.cos(ast.angle) * (beltBaseR + ast.distOffset);
          const ay = cy + Math.sin(ast.angle) * (beltBaseR + ast.distOffset);
          const spark = Math.random() > 0.985;
          ctx.beginPath();
          ctx.arc(ax, ay, spark ? ast.size * 2.1 : ast.size, 0, Math.PI * 2);
          ctx.fillStyle = spark
            ? `rgba(251, 191, 36, ${0.85 * vinylPct})`
            : `rgba(148, 163, 184, ${0.32 * vinylPct})`;
          ctx.fill();
        });
      }

      // 4. Shockwave Ripples
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.r += (sw.maxR - sw.r) * 0.12;
        sw.alpha *= 0.92;
        if (sw.alpha < 0.02) {
          shockwaves.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.strokeStyle = sw.color;
        ctx.globalAlpha = sw.alpha;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.globalAlpha = 1;
      }

      // 5. Acoustic Whistle/Hum Plasma Beam from the Sun
      if (activeVoxFreq > 0) {
        const noteAngle = ((activeVoxMidi % 12) / 12) * Math.PI * 2 - Math.PI / 2;
        const beamDist = getOrbitRadius(2) + Math.sin(performance.now() * 0.012) * 28;
        const bx = cx + Math.cos(noteAngle) * beamDist;
        const by = cy + Math.sin(noteAngle) * beamDist;
        plasmaTrail.push({ x: bx, y: by, alpha: 1.0 });

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(bx, by);
        ctx.strokeStyle = "rgba(56, 189, 248, 0.55)";
        ctx.lineWidth = 3;
        ctx.stroke();
      }
      for (let i = plasmaTrail.length - 1; i >= 0; i--) {
        plasmaTrail[i].alpha *= 0.93;
        if (plasmaTrail[i].alpha < 0.03) {
          plasmaTrail.splice(i, 1);
          continue;
        }
        ctx.beginPath();
        ctx.arc(plasmaTrail[i].x, plasmaTrail[i].y, 6 * plasmaTrail[i].alpha, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(125, 211, 252, ${plasmaTrail[i].alpha})`;
        ctx.fill();
      }

      // 6. Central Pulsar Sun (Spring Physics)
      sunVel = (sunVel - sunSpring * 0.16) * 0.82;
      sunSpring += sunVel;
      const sunR = Math.max(18, 28 + sunSpring);

      const sunGrad = ctx.createRadialGradient(cx, cy, 4, cx, cy, sunR * 2.8);
      sunGrad.addColorStop(0, "#ffffff");
      sunGrad.addColorStop(0.28, isPlaying ? "#fde047" : "#94a3b8");
      sunGrad.addColorStop(0.65, isPlaying ? "rgba(245, 158, 11, 0.35)" : "rgba(56, 189, 248, 0.12)");
      sunGrad.addColorStop(1, "rgba(0, 0, 0, 0)");

      ctx.beginPath();
      ctx.arc(cx, cy, sunR * 2.8, 0, Math.PI * 2);
      ctx.fillStyle = sunGrad;
      ctx.fill();

      // 7. Orbit Rings, Euclidean Step Nodes & Planets
      planets.forEach(p => {
        p.springVel = (p.springVel - p.springOffset * 0.18) * 0.8;
        p.springOffset += p.springVel;
        p.pulseFlash *= 0.9;

        const targetAngle = (p.currentStep / p.steps) * Math.PI * 2 - Math.PI / 2;
        if (isPlaying) {
          // Smooth shortest-arc angular interpolation
          let diff = targetAngle - p.smoothAngle;
          while (diff < -Math.PI) diff += Math.PI * 2;
          while (diff > Math.PI) diff -= Math.PI * 2;
          p.smoothAngle += diff * 0.28;
        } else {
          p.smoothAngle = -Math.PI / 2;
        }

        const orbitR = getOrbitRadius(p.id) + p.springOffset;
        const isSelected = p.id === selectedPlanetId;

        // Orbital Track Ring
        ctx.beginPath();
        ctx.arc(cx, cy, orbitR, 0, Math.PI * 2);
        ctx.strokeStyle = isSelected ? p.color : "rgba(148, 163, 184, 0.18)";
        ctx.globalAlpha = isSelected ? 0.55 : 1;
        ctx.lineWidth = isSelected ? 2 : 1.1;
        ctx.stroke();
        ctx.globalAlpha = 1;

        // Euclidean Polygon Geometry connecting active step nodes
        const activeNodes = [];
        for (let s = 0; s < p.steps; s++) {
          const stepAngle = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = cx + Math.cos(stepAngle) * orbitR;
          const ny = cy + Math.sin(stepAngle) * orbitR;
          const active = p.pattern[s];
          if (active) activeNodes.push({ x: nx, y: ny });

          // Draw clickable step node on the orbit ring
          ctx.beginPath();
          ctx.arc(nx, ny, active ? 5.5 : 3.2, 0, Math.PI * 2);
          ctx.fillStyle = active ? p.color : "rgba(100, 116, 139, 0.45)";
          ctx.fill();
        }

        if (activeNodes.length > 1) {
          ctx.beginPath();
          activeNodes.forEach((pt, idx) => {
            if (idx === 0) ctx.moveTo(pt.x, pt.y);
            else ctx.lineTo(pt.x, pt.y);
          });
          ctx.closePath();
          ctx.strokeStyle = p.color;
          ctx.globalAlpha = 0.24 + p.pulseFlash * 0.35;
          ctx.lineWidth = 1.4;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        // Orbiting Planet Body
        const px = cx + Math.cos(p.smoothAngle) * orbitR;
        const py = cy + Math.sin(p.smoothAngle) * orbitR;
        const pRad = p.planetRadius + p.pulseFlash * 6;

        // Planet Glow Aura
        const pGrad = ctx.createRadialGradient(px, py, 2, px, py, pRad * 2.4);
        pGrad.addColorStop(0, "#ffffff");
        pGrad.addColorStop(0.35, p.color);
        pGrad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.beginPath();
        ctx.arc(px, py, pRad * 2.4, 0, Math.PI * 2);
        ctx.fillStyle = pGrad;
        ctx.fill();

        // Selection Halo Ring
        if (isSelected) {
          ctx.beginPath();
          ctx.arc(px, py, pRad + 6, 0, Math.PI * 2);
          ctx.strokeStyle = "#ffffff";
          ctx.lineWidth = 1.5;
          ctx.stroke();
        }
      });

      requestAnimationFrame(renderCosmos);
    }

    // =========================================================================
    // 8. DIRECT CANVAS INTERACTION (CLICK SUN, PLANETS, ORBIT NODES & DRAG)
    // =========================================================================
    let isDraggingSun = false;
    let dragStartY = 0;
    let dragStartBpm = 86;

    canvas.addEventListener("pointerdown", e => {
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      // 1. Check Central Sun Click / Drag
      if (Math.hypot(mx - cx, my - cy) <= 42) {
        isDraggingSun = true;
        dragStartY = my;
        dragStartBpm = Number(document.getElementById("bpmSlider").value);
        togglePlay();
        return;
      }

      // 2. Check Planet Body Click (Selects Planet for Orbital Inspector)
      for (const p of planets) {
        const pos = getPlanetPosition(p);
        if (Math.hypot(mx - pos.x, my - pos.y) <= p.planetRadius + 14) {
          selectPlanet(p.id);
          p.springVel += 4;
          return;
        }
      }

      // 3. Check Orbit Step Node Click (Toggles individual Euclidean pulse directly in space)
      for (const p of planets) {
        const orbitR = getOrbitRadius(p.id);
        for (let s = 0; s < p.steps; s++) {
          const stepAngle = (s / p.steps) * Math.PI * 2 - Math.PI / 2;
          const nx = cx + Math.cos(stepAngle) * orbitR;
          const ny = cy + Math.sin(stepAngle) * orbitR;
          if (Math.hypot(mx - nx, my - ny) <= 13) {
            p.pattern[s] = !p.pattern[s];
            p.pulses = p.pattern.filter(Boolean).length;
            selectPlanet(p.id);
            shockwaves.push({ x: nx, y: ny, r: 4, maxR: 34, color: p.color, alpha: 0.85 });
            return;
          }
        }
      }
    });

    canvas.addEventListener("pointermove", e => {
      if (!isDraggingSun) return;
      const deltaY = dragStartY - e.clientY;
      const newBpm = Math.max(58, Math.min(165, Math.round(dragStartBpm + deltaY * 0.4)));
      document.getElementById("bpmSlider").value = newBpm;
      document.getElementById("bpmVal").textContent = `${newBpm} BPM`;
    });

    window.addEventListener("pointerup", () => {
      isDraggingSun = false;
    });

    window.addEventListener("keydown", e => {
      if (e.code === "Space" && document.activeElement.tagName !== "SELECT") {
        e.preventDefault();
        togglePlay();
      }
    });

    // =========================================================================
    // 9. FLOATING INSPECTOR & HUD BINDINGS
    // =========================================================================
    function selectPlanet(id) {
      selectedPlanetId = id;
      const p = planets[id];
      document.getElementById("planetInspector").classList.remove("hidden");
      document.getElementById("inspDot").style.background = p.color;
      document.getElementById("inspName").textContent = p.name;
      document.getElementById("inspName").style.color = p.color;

      document.getElementById("inspSteps").value = p.steps;
      document.getElementById("inspStepsVal").textContent = p.steps;

      const pulsesEl = document.getElementById("inspPulses");
      pulsesEl.max = p.steps;
      pulsesEl.value = p.pulses;
      document.getElementById("inspPulsesVal").textContent = p.pulses;

      document.getElementById("inspPitch").value = p.pitchOffset;
      document.getElementById("inspPitchVal").textContent = `+${p.pitchOffset}`;

      const volPct = Math.round(p.volume * 100);
      document.getElementById("inspVol").value = volPct;
      document.getElementById("inspVolVal").textContent = `${volPct}%`;
    }

    document.getElementById("inspSteps").addEventListener("input", e => {
      const p = planets[selectedPlanetId];
      p.steps = Number(e.target.value);
      p.pulses = Math.min(p.pulses, p.steps);
      p.pattern = generateEuclidean(p.steps, p.pulses);
      selectPlanet(p.id);
    });

    document.getElementById("inspPulses").addEventListener("input", e => {
      const p = planets[selectedPlanetId];
      p.pulses = Number(e.target.value);
      p.pattern = generateEuclidean(p.steps, p.pulses);
      selectPlanet(p.id);
    });

    document.getElementById("inspPitch").addEventListener("input", e => {
      const p = planets[selectedPlanetId];
      p.pitchOffset = Number(e.target.value);
      document.getElementById("inspPitchVal").textContent = `+${p.pitchOffset}`;
    });

    document.getElementById("inspVol").addEventListener("input", e => {
      const p = planets[selectedPlanetId];
      p.volume = Number(e.target.value) / 100;
      document.getElementById("inspVolVal").textContent = `${e.target.value}%`;
    });

    const ORBIT_PRESETS = {
      afro:  [{ steps: 3, pulses: 2 }, { steps: 4, pulses: 2 }, { steps: 5, pulses: 3 }, { steps: 7, pulses: 4 }],
      kyoto: [{ steps: 5, pulses: 3 }, { steps: 7, pulses: 3 }, { steps: 8, pulses: 5 }, { steps: 11, pulses: 6 }],
      dub:   [{ steps: 4, pulses: 2 }, { steps: 6, pulses: 2 }, { steps: 3, pulses: 2 }, { steps: 8, pulses: 5 }]
    };

    document.getElementById("presetSelect").addEventListener("change", e => {
      const val = e.target.value;
      if (val === "mutate") {
        planets.forEach(p => {
          p.steps = Math.floor(Math.random() * 10) + 3;
          p.pulses = Math.max(1, Math.floor(p.steps * (0.4 + Math.random() * 0.35)));
          p.pattern = generateEuclidean(p.steps, p.pulses);
        });
      } else if (ORBIT_PRESETS[val]) {
        ORBIT_PRESETS[val].forEach((cfg, idx) => {
          planets[idx].steps = cfg.steps;
          planets[idx].pulses = cfg.pulses;
          planets[idx].pattern = generateEuclidean(cfg.steps, cfg.pulses);
        });
      }
      selectPlanet(selectedPlanetId);
    });

    document.getElementById("btnPlay").addEventListener("click", togglePlay);
    document.getElementById("btnToggleMic").addEventListener("click", toggleMicrophoneSynth);
    document.getElementById("btnRecord").addEventListener("click", toggleRecording);

    document.getElementById("bpmSlider").addEventListener("input", e => {
      document.getElementById("bpmVal").textContent = `${e.target.value} BPM`;
    });

    document.getElementById("rainSlider").addEventListener("input", e => {
      document.getElementById("rainVal").textContent = `${e.target.value}%`;
      if (rainGain) rainGain.gain.setTargetAtTime((Number(e.target.value) / 100) * 0.55, audioCtx.currentTime, 0.05);
    });

    document.getElementById("vinylSlider").addEventListener("input", e => {
      document.getElementById("vinylVal").textContent = `${e.target.value}%`;
      if (vinylGain) vinylGain.gain.setTargetAtTime((Number(e.target.value) / 100) * 0.6, audioCtx.currentTime, 0.05);
    });

    document.getElementById("toneSlider").addEventListener("input", e => {
      const hz = Number(e.target.value);
      document.getElementById("toneVal").textContent = hz >= 1000 ? `${(hz / 1000).toFixed(1)}k` : `${hz}`;
      if (masterFilter) masterFilter.frequency.setTargetAtTime(hz, audioCtx.currentTime, 0.05);
    });

    document.getElementById("delaySlider").addEventListener("input", e => {
      document.getElementById("delayVal").textContent = `${e.target.value}%`;
      if (delayWet) delayWet.gain.setTargetAtTime(Number(e.target.value) / 100, audioCtx.currentTime, 0.05);
    });

    document.getElementById("voiceWaveSelect").addEventListener("change", e => {
      if (micOsc) micOsc.type = e.target.value;
    });

    // Boot
    selectPlanet(0);
    renderCosmos();
  </script>
</body>
</html>
